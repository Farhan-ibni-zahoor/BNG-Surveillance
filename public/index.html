<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNG Surveillance | Secure Systems Command</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        /* ============================================================
           1. CORE DESIGN SYSTEM & VARIABLES
           ============================================================ */
        :root {
            /* Color Palette */
            --bg-deep: #020202;
            --bg-panel: #0a0a0a;
            --bg-glass: rgba(10, 10, 10, 0.95);
            --primary: #f59e0b;
            --primary-dim: rgba(245, 158, 11, 0.1);
            --primary-glow: rgba(245, 158, 11, 0.4);
            --secondary: #1a1a1a;
            
            /* UI Semantic Colors */
            --success: #10b981;
            --danger: #ef4444;
            --info: #3b82f6;
            
            /* Text Colors */
            --text-main: #ffffff;
            --text-muted: #888888;
            --text-dim: #555555;
            
            /* Layout & Spacing */
            --border: rgba(255, 255, 255, 0.08);
            --radius-lg: 16px;
            --radius-md: 8px;
            --sidebar-width: 280px;
            
            /* Typography */
            --font-main: 'Outfit', sans-serif;
            --font-tech: 'Space Grotesk', monospace;
        }

        /* ============================================================
           2. GLOBAL RESET & BASE STYLES
           ============================================================ */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            outline: none; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { 
            background: #222; 
            border: 2px solid var(--bg-deep); 
            border-radius: 10px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* Typography Selection */
        ::selection { background: var(--primary); color: #000; }

        /* ============================================================
           3. ENHANCED ANIMATIONS
           ============================================================ */
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(40px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        @keyframes pulseBorder {
            0%, 100% { border-color: var(--border); }
            50% { border-color: var(--primary); }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px var(--primary-glow); }
            50% { box-shadow: 0 0 40px var(--primary-glow), 0 0 60px var(--primary-glow); }
        }

        .animate-enter { animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        .scale-in { animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .slide-in-right { animation: slideInRight 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        /* ============================================================
           4. ENHANCED UI COMPONENTS
           ============================================================ */
        
        /* Buttons with Better Interactions */
        .btn { 
            padding: 14px 28px; 
            border-radius: var(--radius-md); 
            font-family: var(--font-tech); 
            font-weight: 700; 
            text-transform: uppercase; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 1px solid transparent; 
            display: inline-flex; 
            align-items: center; 
            gap: 10px; 
            justify-content: center; 
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary { 
            background: var(--primary); 
            color: #000; 
            box-shadow: 0 10px 20px -10px var(--primary-glow); 
        }
        .btn-primary:hover { 
            background: #fff; 
            transform: translateY(-3px); 
            box-shadow: 0 15px 30px -10px rgba(255,255,255,0.2);
        }
        .btn-primary:active { transform: translateY(-1px); }

        .btn-secondary { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid var(--border); 
            color: var(--text-main); 
            backdrop-filter: blur(10px);
        }
        .btn-secondary:hover { 
            border-color: var(--primary); 
            color: var(--primary); 
            background: var(--primary-dim);
            transform: translateY(-2px);
        }

        .btn-danger { 
            background: rgba(239, 68, 68, 0.1); 
            color: var(--danger); 
            border: 1px solid var(--danger); 
        }
        .btn-danger:hover { 
            background: var(--danger); 
            color: #fff; 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -10px rgba(239, 68, 68, 0.5);
        }

        .btn-success { 
            background: rgba(16, 185, 129, 0.1); 
            color: var(--success); 
            border: 1px solid var(--success); 
        }
        .btn-success:hover { 
            background: var(--success); 
            color: #000; 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -10px rgba(16, 185, 129, 0.5);
        }

        /* Enhanced Form Controls */
        .form-group { 
            margin-bottom: 20px; 
            position: relative;
        }
        
        .label-tech { 
            font-family: var(--font-tech); 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            display: block; 
            text-transform: uppercase;
            transition: color 0.3s;
        }
        
        input, textarea, select { 
            width: 100%; 
            background: #111; 
            border: 1px solid var(--border); 
            padding: 16px; 
            color: #fff; 
            border-radius: var(--radius-md); 
            font-family: var(--font-main); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem;
        }
        
        input:focus, textarea:focus, select:focus { 
            border-color: var(--primary); 
            background: #151515;
            box-shadow: 0 0 0 4px var(--primary-dim), 0 10px 30px -10px var(--primary-glow);
            transform: translateY(-2px);
        }

        .form-group:focus-within .label-tech {
            color: var(--primary);
        }

        /* Badges */
        .badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            font-family: var(--font-tech);
            display: inline-block;
            animation: scaleIn 0.3s ease;
        }
        .badge-solved { background: var(--success); color: #000; }
        .badge-open { background: var(--primary); color: #000; }

        /* ============================================================
           5. ENHANCED NAVIGATION & HEADER
           ============================================================ */
        nav { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 1.2rem 8%; 
            background: var(--bg-glass); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border); 
            transition: all 0.3s ease;
        }

        nav:hover {
            background: rgba(10, 10, 10, 0.98);
        }

        .logo { 
            font-size: 1.6rem; 
            font-family: var(--font-tech); 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            letter-spacing: -1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.05);
        }
        
        .logo i { 
            color: var(--primary); 
            filter: drop-shadow(0 0 8px var(--primary-glow));
            animation: float 3s ease-in-out infinite;
        }
        .logo span { color: #fff; }

        .nav-right { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }

        /* ============================================================
           6. ENHANCED HERO & HOME SECTIONS
           ============================================================ */
        .hero { 
            position: relative; 
            height: 70vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            margin: 2rem 5%; 
            border-radius: 24px; 
            overflow: hidden; 
            border: 1px solid var(--border); 
            background: url('https://images.unsplash.com/photo-1557597774-9d273605dfa9?q=80&w=1920&auto=format&fit=crop') center/cover; 
        }
        
        .hero::before { 
            content: ''; 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(0deg, var(--bg-deep) 10%, rgba(0,0,0,0.4) 100%); 
        }
        
        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 0%, var(--bg-deep) 100%);
        }
        
        .hero-content { 
            position: relative; 
            z-index: 2; 
            max-width: 900px; 
            padding: 40px; 
        }
        
        .hero-content h1 {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 20px;
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .text-gradient {
            background: linear-gradient(135deg, var(--primary) 0%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Service Banner */
        .service-banner { 
            background: linear-gradient(135deg, #0a0a0a 0%, #111 100%); 
            border: 1px solid var(--border); 
            border-left: 5px solid var(--primary); 
            padding: 4rem; 
            margin: 5rem 5% 3rem; 
            border-radius: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 30px; 
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        
        .service-banner:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -20px rgba(0,0,0,0.8);
        }
        
        .service-banner::after {
            content: '\f3ed';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: -20px;
            bottom: -30px;
            font-size: 15rem;
            color: rgba(255,255,255,0.02);
            transform: rotate(-15deg);
        }

        /* ============================================================
           7. ENHANCED PRODUCT CATALOG STYLES
           ============================================================ */
        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 2.5rem; 
            margin-top: 3rem; 
        }
        
        .card { 
            background: var(--bg-panel); 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            overflow: hidden; 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; 
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: left 0.5s;
        }
        
        .card:hover::before {
            left: 100%;
        }
        
        .card:hover { 
            transform: translateY(-15px) scale(1.02); 
            border-color: var(--primary); 
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8), 0 0 0 1px var(--primary-glow);
        }

        .card-img-box { 
            height: 280px; 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 30px; 
            position: relative; 
            overflow: hidden; 
        }
        
        /* Enhanced Scanline */
        .card-img-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: var(--primary);
            opacity: 0.3;
            z-index: 2;
            animation: scanline 4s linear infinite;
        }
        
        .card img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }
        .card:hover img { 
            transform: scale(1.1) rotate(2deg); 
            filter: drop-shadow(0 20px 40px rgba(245, 158, 11, 0.3));
        }
        
        .card-info { padding: 2rem; }
        .price-tag { 
            font-size: 1.8rem; 
            font-family: var(--font-tech); 
            font-weight: 800; 
            margin: 10px 0;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary-glow);
        }

        /* OUT OF STOCK OVERLAY */
        .out-of-stock { 
            filter: grayscale(1) contrast(0.8); 
            pointer-events: none; 
        }
        .stock-label { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: #ef4444; 
            color: #fff; 
            padding: 8px 15px; 
            border-radius: 6px; 
            font-size: 0.75rem; 
            font-weight: 900; 
            font-family: var(--font-tech);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
            animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ============================================================
           8. SUCCESS LOGIN MODAL (NEW!)
           ============================================================ */
        .success-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .success-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .success-content {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            border: 2px solid var(--primary);
            border-radius: 30px;
            padding: 4rem 3rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            overflow: hidden;
            transform: scale(0.8) translateY(50px);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 40px 100px -20px var(--primary-glow), 0 0 0 1px rgba(245, 158, 11, 0.2);
        }

        .success-modal.active .success-content {
            transform: scale(1) translateY(0);
        }

        .success-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            animation: glow 3s ease-in-out infinite;
        }

        .success-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, var(--primary) 0%, #fbbf24 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #000;
            position: relative;
            z-index: 1;
            animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s both;
            box-shadow: 0 20px 40px -20px var(--primary-glow);
        }

        .success-title {
            font-family: var(--font-tech);
            font-size: 2rem;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease 0.5s both;
        }

        .success-subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease 0.6s both;
        }

        .user-info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease 0.7s both;
        }

        .user-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .user-info-row:last-child {
            border-bottom: none;
        }

        .user-info-label {
            font-family: var(--font-tech);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .user-info-value {
            font-weight: 600;
            color: var(--primary);
        }

        /* ============================================================
           9. ADMIN PANEL LAYOUT & DASHBOARD
           ============================================================ */
        .admin-layout { 
            display: flex; 
            min-height: calc(100vh - 75px); 
        }
        
        .sidebar { 
            width: var(--sidebar-width); 
            background: #080808; 
            border-right: 1px solid var(--border); 
            padding: 2.5rem 1.5rem; 
            position: fixed; 
            height: 100%; 
            top: 75px; 
            left: 0; 
            overflow-y: auto; 
        }

        .sidebar-btn { 
            width: 100%; 
            text-align: left; 
            padding: 16px 20px; 
            margin-bottom: 12px; 
            background: transparent; 
            border: 1px solid transparent; 
            color: #777; 
            cursor: pointer; 
            border-radius: 12px; 
            font-family: var(--font-tech); 
            font-size: 0.95rem; 
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .sidebar-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--primary);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }
        
        .sidebar-btn:hover::before,
        .sidebar-btn.active::before {
            transform: scaleY(1);
        }
        
        .sidebar-btn i { font-size: 1.1rem; width: 25px; }
        .sidebar-btn:hover { 
            background: rgba(255,255,255,0.03); 
            color: #fff; 
            transform: translateX(5px);
        }
        .sidebar-btn.active { 
            background: var(--primary-dim); 
            color: var(--primary); 
            border-color: rgba(245, 158, 11, 0.2);
        }

        .admin-content { 
            margin-left: var(--sidebar-width); 
            padding: 4rem; 
            width: 100%; 
            background: var(--bg-deep);
        }

        /* Enhanced stat boxes */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .stat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary) 0%, transparent 100%);
            transform: scaleX(0);
            transition: transform 0.5s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px -20px var(--primary-glow);
        }

        .stat-box:hover::before {
            transform: scaleX(1);
        }

        /* ============================================================
           10. ENHANCED MODALS & UI OVERLAYS
           ============================================================ */
        .overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.92); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        
        .modal { 
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%); 
            width: 95%; 
            max-width: 600px; 
            padding: 3.5rem; 
            border-radius: 28px; 
            border: 1px solid var(--border); 
            transform: translateY(60px) scale(0.95); 
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            max-height: 85vh; 
            overflow-y: auto; 
            position: relative;
            box-shadow: 0 40px 100px -30px rgba(0,0,0,0.8);
        }
        .overlay.active .modal { transform: translateY(0) scale(1); }

        /* Enhanced Cart Panel */
        .cart-panel { 
            position: fixed; 
            top: 0; 
            right: -500px; 
            width: 450px; 
            height: 100vh; 
            background: linear-gradient(180deg, #0a0a0a 0%, #050505 100%); 
            border-left: 2px solid var(--primary); 
            z-index: 2100; 
            padding: 3rem; 
            transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1); 
            display: flex; 
            flex-direction: column; 
            box-shadow: -20px 0 60px rgba(0,0,0,0.8);
        }
        .cart-panel.open { right: 0; }

        /* Enhanced Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--primary) 0%, #fbbf24 100%);
            color: #000;
            padding: 18px 30px;
            border-radius: 50px;
            font-family: var(--font-tech);
            font-weight: 700;
            font-size: 0.9rem;
            opacity: 0;
            transform: translateY(100px) scale(0.8);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 4000;
            box-shadow: 0 20px 40px -20px var(--primary-glow);
            pointer-events: none;
            letter-spacing: 1px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Enhanced Loader */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Enhanced Tag */
        .tag {
            display: inline-block;
            background: var(--primary-dim);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            font-family: var(--font-tech);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* Enhanced Data Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead tr {
            border-bottom: 2px solid var(--border);
        }

        .data-table th {
            padding: 1rem;
            text-align: left;
            font-family: var(--font-tech);
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }

        .data-table td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s ease;
        }

        .data-table tbody tr {
            transition: all 0.3s ease;
        }

        .data-table tbody tr:hover {
            background: rgba(255,255,255,0.02);
            transform: scale(1.01);
        }

        /* ============================================================
           11. FOOTER
           ============================================================ */
        footer {
            text-align: center;
            padding: 6rem 2rem;
            margin-top: 8rem;
            background: #050505;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 30px;
        }
        .social-links a {
            font-size: 1.8rem;
            color: #fff;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .social-links a:hover { 
            color: var(--primary); 
            transform: translateY(-5px) scale(1.1);
        }

        /* Container utility */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
        }

        /* ============================================================
           12. RESPONSIVE MEDIA QUERIES
           ============================================================ */
        @media (max-width: 1024px) {
            .admin-content { padding: 2rem; }
            .hero-content h1 { font-size: 3rem; }
        }

        @media (max-width: 768px) {
            :root { --sidebar-width: 100%; }
            .cart-panel { width: 100%; right: -100%; }
            .sidebar { 
                position: static; 
                width: 100%; 
                height: auto; 
                display: flex; 
                overflow-x: auto; 
                padding: 1rem; 
                border-right: none; 
                border-bottom: 1px solid var(--border); 
                margin-top: 0;
            }
            .sidebar-btn { 
                width: auto; 
                white-space: nowrap; 
                margin-bottom: 0; 
                flex-shrink: 0;
            }
            .admin-layout { flex-direction: column; }
            .admin-content { margin-left: 0; padding: 1.5rem; }
            nav { padding: 1rem 5%; }
            .service-banner { 
                padding: 2rem; 
                text-align: center; 
                justify-content: center; 
            }
            .hero-content h1 { font-size: 2.5rem; }
            .grid {
                grid-template-columns: 1fr;
            }
            .stat-grid {
                grid-template-columns: 1fr;
            }
            .success-content {
                padding: 3rem 2rem;
            }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="margin-top: 25px; font-family: var(--font-tech); letter-spacing: 5px; color: var(--primary); font-weight: 600;">INITIALIZING COMMAND CENTER...</div>
    </div>

    <div id="toast" class="toast">Action Logged Successfully</div>

    <!-- SUCCESS LOGIN MODAL (NEW!) -->
    <div id="success-modal" class="success-modal">
        <div class="success-content">
            <div class="success-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="success-title">ACCESS GRANTED</h2>
            <p class="success-subtitle">Welcome to the command center, Agent.</p>
            <div class="user-info-card">
                <div class="user-info-row">
                    <span class="user-info-label">Agent Name</span>
                    <span class="user-info-value" id="success-user-name">-</span>
                </div>
                <div class="user-info-row">
                    <span class="user-info-label">Clearance Level</span>
                    <span class="user-info-value" id="success-user-role">-</span>
                </div>
                <div class="user-info-row">
                    <span class="user-info-label">Secure Channel</span>
                    <span class="user-info-value" id="success-user-email">-</span>
                </div>
            </div>
            <button onclick="app.closeSuccessModal()" class="btn btn-primary" style="width: 100%; position: relative; z-index: 1;">
                <i class="fa-solid fa-rocket"></i> Enter System
            </button>
        </div>
    </div>

    <div id="cart-panel" class="cart-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
            <h2 style="font-family: var(--font-tech);"><i class="fa-solid fa-cart-arrow-down"></i> LOGISTICS CART</h2>
            <button onclick="app.toggleCart()" class="btn btn-secondary" style="padding: 10px 15px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div id="cart-items-container" style="flex: 1; overflow-y: auto; padding-right: 10px;">
            <div style="text-align: center; color: var(--text-muted); margin-top: 100px; opacity: 0.5;">
                <i class="fa-solid fa-box-open" style="font-size: 4rem; margin-bottom: 20px;"></i>
                <p>No hardware staged for deployment.</p>
            </div>
        </div>

        <div style="border-top: 1px solid var(--border); padding-top: 2rem; margin-top: 1rem;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 1.4rem; font-weight: 800; font-family: var(--font-tech);">
                <span>NET TOTAL</span>
                <span id="cart-total-display" class="text-gradient">₹0</span>
            </div>
            <button onclick="app.checkout()" id="checkout-main-btn" class="btn btn-primary" style="width: 100%; padding: 20px;">Execute Acquisition</button>
        </div>
    </div>

    <nav>
        <div class="logo" onclick="app.renderShop()">
            <i class="fa-solid fa-shield-halved"></i>
            <span>BNG <span style="font-weight:300; opacity:0.7;">SURVEILLANCE</span></span>
        </div>
        <div class="nav-right" id="nav-actions-area">
        </div>
    </nav>

    <main id="app-root-view">
    </main>

    <div id="modal-overlay" class="overlay">
        <div id="modal-body-content" class="modal">
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const COMMAND_CONFIG = {
            API_BASE: '/api', 
            RAZORPAY_ID: 'rzp_live_SDiqNk2jPMuXQQ',
            WHATSAPP_ID: '916006750581'
        };

        // --- 2. APPLICATION STATE ---
        const APP_STATE = {
            user: JSON.parse(sessionStorage.getItem('user')) || null,
            cart: [],
            inventory: [],
            orders: [],
            queries: [],
            currentAdminTab: 'dashboard',
            registrationEmail: null
        };

        // --- 3. SYSTEM ENGINE ---
        const app = {
            
            /**
             * Boot sequence
             */
            init: async () => {
                setTimeout(() => {
                    const loader = document.getElementById('loader');
                    if(loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.remove(), 600);
                    }
                }, 1800);

                await app.syncInventory();
                app.refreshUI();
            },

            /**
             * Fetch latest products and stock from DB
             */
            syncInventory: async () => {
                try {
                    const response = await fetch(`${COMMAND_CONFIG.API_BASE}/products`);
                    if(response.ok) {
                        APP_STATE.inventory = await response.json();
                    }
                } catch(err) {
                    console.error("Database Sync Failed", err);
                    app.showToast("Critical: Sync Failure");
                }
            },

            /**
             * Primary UI Router
             */
            refreshUI: () => {
                app.renderHeader();
                app.renderShop();
            },

            // ============================================================
            // UI RENDERERS
            // ============================================================

            renderHeader: () => {
                const nav = document.getElementById('nav-actions-area');
                if (!APP_STATE.user) {
                    nav.innerHTML = `<button onclick="app.showAuth('login')" class="btn btn-secondary"><i class="fa-solid fa-right-to-bracket"></i> Agent Login</button>`;
                } else {
                    const isAdmin = APP_STATE.user.role === 'author';
                    nav.innerHTML = `
                        ${isAdmin ? `<button onclick="app.renderAdminPortal()" class="btn btn-secondary"><i class="fa-solid fa-terminal"></i> Command Panel</button>` : ''}
                        <button onclick="app.renderProfile()" class="btn btn-secondary" title="View Profile"><i class="fa-solid fa-id-card-clip"></i></button>
                        <button onclick="app.toggleCart()" class="btn btn-primary">
                            <i class="fa-solid fa-cart-flatbed-suitcases"></i>
                            <span id="header-cart-count" style="background:#000; padding:2px 6px; border-radius:4px; font-size:0.7rem;">${APP_STATE.cart.length}</span>
                        </button>
                        <button onclick="app.executeLogout()" class="btn btn-danger" style="padding: 10px 15px;"><i class="fa-solid fa-power-off"></i></button>
                    `;
                }
            },

            renderShop: () => {
                const root = document.getElementById('app-root-view');
                
                let productCards = APP_STATE.inventory.map(p => {
                    const isSoldOut = p.stock <= 0;
                    return `
                        <div class="card ${isSoldOut ? 'out-of-stock' : ''}">
                            ${isSoldOut ? '<div class="stock-label">OUT OF STOCK</div>' : ''}
                            <div class="card-img-box">
                                <img src="${p.image}" alt="${p.name}">
                            </div>
                            <div class="card-info">
                                <div class="tag">${p.category}</div>
                                <h3 style="font-family: var(--font-tech); margin-bottom: 5px;">${p.name}</h3>
                                <div class="price-tag">₹${p.price.toLocaleString('en-IN')}</div>
                                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Available Stock: ${p.stock} Units</p>
                                ${!isSoldOut 
                                    ? `<button onclick="app.viewProductDetails('${p._id}')" class="btn btn-secondary" style="width:100%;">View Specifications</button>`
                                    : `<button class="btn btn-secondary" style="width:100%;" disabled>Hardware Depleted</button>`
                                }
                            </div>
                        </div>
                    `;
                }).join('');

                root.innerHTML = `
                    <div class="animate-enter">
                        <section class="hero">
                            <div class="hero-content">
                                <div class="badge-open" style="display:inline-block; padding:5px 15px; border-radius:50px; margin-bottom:20px; font-size:0.7rem; letter-spacing:2px; font-weight:bold;">MILITARY GRADE SECURITY</div>
                                <h1>NEXT GENERATION <br><span class="text-gradient">SURVEILLANCE SYSTEMS</span></h1>
                                <p style="color: #bbb; margin: 2rem auto; font-size: 1.2rem; max-width: 600px; font-weight: 300;">
                                    Deploying high-fidelity optics and AI-integrated recording arrays for total environment control.
                                </p>
                                <div style="display:flex; gap:15px; justify-content:center;">
                                    <button onclick="document.getElementById('catalog-anchor').scrollIntoView({behavior:'smooth'})" class="btn btn-primary">Initialize Access</button>
                                    <button onclick="app.renderRaiseRequest()" class="btn btn-secondary">Request Support</button>
                                </div>
                            </div>
                        </section>

                        <div class="container" id="catalog-anchor">
                            <div class="catalog-header">
                                <div>
                                    <h2 style="font-size: 2.2rem;">HARDWARE <span class="text-gradient">INVENTORY</span></h2>
                                    <p style="color: var(--text-muted);">Browse current tactical equipment availability.</p>
                                </div>
                                <div style="font-family: var(--font-tech); font-size: 0.8rem; opacity: 0.6;">
                                    STATUS: ONLINE | STREAMS: ENCRYPTED
                                </div>
                            </div>

                            <div class="grid">
                                ${productCards || '<div style="grid-column: 1/-1; text-align:center; padding:5rem;">No hardware currently listed in the database.</div>'}
                            </div>
                        </div>

                        <div class="service-banner animate-enter">
                            <div style="max-width: 600px;">
                                <h2 style="font-size: 2.2rem; margin-bottom: 10px;"><i class="fa-solid fa-headset" style="color:var(--primary)"></i> TECHNICAL SUPPORT</h2>
                                <p style="color:#aaa; font-size: 1.1rem;">
                                    Facing system downtime or require professional installation? Raise a high-priority service request and our engineers will respond within 24 hours.
                                </p>
                            </div>
                            <div>
                                <button onclick="app.renderRaiseRequest()" class="btn btn-primary" style="padding: 20px 40px;">Open Service Query</button>
                            </div>
                        </div>

                        <footer>
                            <div class="social-links">
                                <a href="https://www.instagram.com/bng_surveillance/?hl=en" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                                <a href="https://www.facebook.com/profile.php?id=61585589131328" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                                <a href="mailto:bngsurveillance@gmail.com"><i class="fa-solid fa-envelope"></i></a>
                            </div>
                            <div style="font-family: var(--font-tech); font-size: 1.2rem; margin-bottom: 20px; letter-spacing: 3px;">BNG SURVEILLANCE SYSTEMS</div>
                            <p style="margin-bottom: 15px; opacity: 0.5; font-size: 0.8rem;">
                                ALL SYSTEMS RECORDED & ENCRYPTED. UNAUTHORIZED ACCESS IS PROHIBITED.
                            </p>
                            <p style="font-size: 0.9rem;">
                                Infrastructure Developed by 
                                <a href="https://farhanzahoor.info" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 700;">
                                    FARHAN ZAHOOR
                                </a>
                            </p>
                        </footer>
                    </div>
                `;
            },

            // ============================================================
            // PRODUCT & CART LOGIC
            // ============================================================

            viewProductDetails: (id) => {
                const p = APP_STATE.inventory.find(x => x._id === id);
                if(!p) return;

                const hasReviews = p.reviews && p.reviews.length > 0;

                const html = `
                    <div class="fade-in">
                        <img src="${p.image}" style="width:100%; height:320px; object-fit:contain; background:#000; border-radius:20px; margin-bottom:2rem; border: 1px solid var(--border);">
                        
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <div class="tag">${p.category}</div>
                                <h2 style="font-size: 2rem; font-family: var(--font-tech);">${p.name}</h2>
                            </div>
                            <div class="price-tag" style="font-size: 2.2rem; margin:0;">₹${p.price.toLocaleString('en-IN')}</div>
                        </div>

                        <p style="color: #aaa; margin: 1.5rem 0; line-height: 1.8; font-size: 1.1rem; border-left: 2px solid var(--primary); padding-left: 20px;">
                            ${p.desc}
                        </p>

                        <div style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <span class="label-tech">Inventory Status</span>
                                <span style="font-weight: 800; font-size: 1.1rem; color: ${p.stock < 5 ? 'var(--danger)' : 'var(--success)'}">
                                    ${p.stock} Units in Reserve
                                </span>
                            </div>
                            <div style="width: 120px;">
                                <span class="label-tech">Select Qty</span>
                                <input type="number" id="purchase-qty-input" value="1" min="1" max="${p.stock}" style="margin:0; padding: 10px; text-align:center;">
                            </div>
                        </div>

                        <button onclick="app.executeAddToCart('${p._id}')" class="btn btn-primary" style="width:100%; padding: 20px;">
                            <i class="fa-solid fa-plus-circle"></i> Add to Logistics Cart
                        </button>

                        <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border);">
                            <h4 style="font-family: var(--font-tech); margin-bottom: 1.5rem;"><i class="fa-solid fa-clipboard-check"></i> FIELD OPERATION REPORTS</h4>
                            
                            <div id="review-list" style="max-height: 250px; overflow-y: auto; margin-bottom: 2rem; padding-right: 10px;">
                                ${!hasReviews ? '<p style="color: var(--text-dim); text-align:center;">No field reports available for this hardware.</p>' : 
                                    p.reviews.map(r => `
                                        <div style="background: #111; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border);">
                                            <div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
                                                <strong style="color: var(--primary); font-size: 0.8rem; text-transform:uppercase;">${r.user}</strong>
                                                <small style="opacity:0.4; font-size:0.7rem;">${new Date(r.date).toLocaleDateString()}</small>
                                            </div>
                                            <div style="font-size: 0.95rem; color: #ccc;">${r.comment}</div>
                                        </div>
                                    `).join('')
                                }
                            </div>

                            ${APP_STATE.user ? `
                                <div style="display: flex; gap: 10px;">
                                    <input type="text" id="review-comment-field" placeholder="Draft a field report..." style="margin:0;">
                                    <button onclick="app.postFieldReport('${p._id}')" class="btn btn-secondary" style="padding: 0 20px;"><i class="fa-solid fa-paper-plane"></i></button>
                                </div>
                            ` : '<p style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">Login required to post reports.</p>'}
                        </div>
                    </div>
                `;

                app.openModal(html);
            },

            executeAddToCart: (id) => {
                if(!APP_STATE.user) {
                    app.showToast("Access Denied: Please Login First");
                    app.showAuth('login');
                    return;
                }

                const product = APP_STATE.inventory.find(x => x._id === id);
                const qtyRequested = parseInt(document.getElementById('purchase-qty-input').value) || 1;

                if(qtyRequested > product.stock) {
                    app.showToast("Error: Requested quantity exceeds stock level.");
                    return;
                }

                const existingIndex = APP_STATE.cart.findIndex(item => item._id === id);
                
                if(existingIndex !== -1) {
                    const newTotalQty = APP_STATE.cart[existingIndex].qty + qtyRequested;
                    if(newTotalQty > product.stock) {
                        app.showToast("Limit Reached: Cannot add more to cart.");
                        return;
                    }
                    APP_STATE.cart[existingIndex].qty = newTotalQty;
                } else {
                    APP_STATE.cart.push({ ...product, qty: qtyRequested });
                }

                app.showToast(`${product.name} staged for acquisition.`);
                app.closeModal();
                app.renderHeader();
            },

            toggleCart: () => {
                const panel = document.getElementById('cart-panel');
                if(panel.classList.contains('open')) {
                    panel.classList.remove('open');
                } else {
                    app.renderCartContents();
                    panel.classList.add('open');
                }
            },

            renderCartContents: () => {
                const container = document.getElementById('cart-items-container');
                const totalDisplay = document.getElementById('cart-total-display');
                
                if(APP_STATE.cart.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; color: var(--text-muted); margin-top: 100px; opacity: 0.5;">
                            <i class="fa-solid fa-box-open" style="font-size: 4rem; margin-bottom: 20px;"></i>
                            <p>No hardware staged for deployment.</p>
                        </div>
                    `;
                    totalDisplay.innerText = "₹0";
                    return;
                }

                let total = 0;
                let html = APP_STATE.cart.map((item, idx) => {
                    const rowTotal = item.price * item.qty;
                    total += rowTotal;
                    return `
                        <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 15px; position: relative;" class="animate-enter">
                            <div style="display:flex; gap: 15px; align-items:center;">
                                <img src="${item.image}" style="width: 60px; height: 60px; object-fit: contain; background: #000; border-radius: 8px;">
                                <div style="flex: 1;">
                                    <h4 style="font-family: var(--font-tech); font-size: 0.9rem;">${item.name}</h4>
                                    <div style="font-size: 0.8rem; color: var(--text-muted);">
                                        ₹${item.price.toLocaleString()} x ${item.qty} units
                                    </div>
                                    <div style="color: var(--primary); font-weight: 800; font-family: var(--font-tech);">₹${rowTotal.toLocaleString()}</div>
                                </div>
                                <button onclick="app.removeCartItem(${idx})" style="background:none; border:none; color: var(--danger); cursor:pointer; font-size: 1.2rem;">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = html;
                totalDisplay.innerText = "₹" + total.toLocaleString('en-IN');
            },

            removeCartItem: (idx) => {
                APP_STATE.cart.splice(idx, 1);
                app.renderCartContents();
                app.renderHeader();
            },

            // ============================================================
            // CHECKOUT & PAYMENT FLOW
            // ============================================================

            checkout: () => {
                if(APP_STATE.cart.length === 0) return;
                app.toggleCart();

                const finalTotal = APP_STATE.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

                const html = `
                    <div class="fade-in">
                        <h2 style="font-family: var(--font-tech); margin-bottom: 2rem;"><i class="fa-solid fa-truck-ramp-box"></i> DISPATCH LOGISTICS</h2>
                        
                        <div class="form-group">
                            <label class="label-tech">Operations Agent</label>
                            <input type="text" value="${APP_STATE.user.name}" readonly style="opacity: 0.6; cursor: not-allowed;">
                        </div>

                        <div class="form-group">
                            <label class="label-tech">Communication Line (Phone)</label>
                            <input type="tel" id="checkout-phone" placeholder="+91 XXXXX XXXXX" required>
                        </div>

                        <div class="form-group">
                            <label class="label-tech">Deployment Coordinates (Address)</label>
                            <textarea id="checkout-address" placeholder="Full installation address..." rows="3" required></textarea>
                        </div>

                        <div class="form-group">
                            <label class="label-tech">Regional Code (Pincode)</label>
                            <input type="text" id="checkout-pincode" placeholder="6-Digit Code" maxlength="6" required>
                        </div>

                        <div style="background: var(--primary-dim); border: 1px solid var(--primary); padding: 20px; border-radius: 12px; margin: 2rem 0; text-align: center;">

            initiatePayment: async (amount) => {
                const phone = document.getElementById('checkout-phone').value;
                const address = document.getElementById('checkout-address').value;
                const pincode = document.getElementById('checkout-pincode').value;

                if(!phone || !address || !pincode) {
                    app.showToast("Error: Missing deployment details.");
                    return;
                }

                try {
                    app.showToast("Connecting to Secure Gateway...");
                    
                    const response = await fetch(`${COMMAND_CONFIG.API_BASE}/create-order`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ amount })
                    });
                    
                    const orderData = await response.json();

                    const options = {
                        "key": COMMAND_CONFIG.RAZORPAY_ID,
                        "amount": orderData.amount,
                        "currency": "INR",
                        "name": "BNG SURVEILLANCE",
                        "description": "Tactical Hardware Acquisition",
                        "order_id": orderData.id,
                        "handler": (resp) => app.verifyPaymentResponse(resp, amount, phone, address, pincode),
                        "theme": { "color": "#f59e0b" },
                        "prefill": {
                            "name": APP_STATE.user.name,
                            "email": APP_STATE.user.email,
                            "contact": phone
                        }
                    };

                    const rzp = new Razorpay(options);
                    rzp.open();
                    app.closeModal();

                } catch(e) {
                    app.showToast("Gateway Connection Failure");
                }
            },

            verifyPaymentResponse: async (response, total, phone, address, pincode) => {
                try {
                    app.showToast("Verifying Transaction...");
                    
                    const payload = {
                        orderCreationId: response.razorpay_order_id,
                        razorpayPaymentId: response.razorpay_payment_id,
                        razorpaySignature: response.razorpay_signature,
                        customerDetails: {
                            name: APP_STATE.user.name,
                            email: APP_STATE.user.email,
                            phone,
                            address,
                            pincode,
                            items: APP_STATE.cart,
                            total
                        }
                    };

                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/verify-payment`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });

                    if(res.ok) {
                        APP_STATE.cart = [];
                        app.showToast("Authorization Confirmed.");
                        app.renderOrderSuccess(response.razorpay_order_id, total);
                        app.syncInventory();
                    } else {
                        app.showToast("Payment Verification Failed");
                    }
                } catch(e) {
                    app.showToast("Server Synchronization Error");
                }
            },

                const addr = document.getElementById('req-addr-field').value;
                const pin = document.getElementById('req-pin-field').value;

                    return;

                const fullMessage = `${msg}\n\n[Location Data]\nAddr: ${addr}\nPin: ${pin}`;

                const data = {
                    customerName: APP_STATE.user.name,
                    email: APP_STATE.user.email,
                    type: type,
                    message: fullMessage
                };

                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/requests`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });

                    if(res.ok) {
                        const waText = `*NEW ${type.toUpperCase()} REQUEST*%0AFrom: ${APP_STATE.user.name}%0AEmail: ${APP_STATE.user.email}%0A-----------------%0A${encodeURIComponent(fullMessage)}`;

                                <label class="label-tech">Establish Passcode</label>
                                <input type="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 18px;">Initiate Verification</button>
                        </form>
                    `;
                } else if (mode === 'verify') {
                    content = `
                        <form onsubmit="app.handleVerifyOTP(event)">
                            <h2 style="font-family: var(--font-tech); margin-bottom: 1rem;">OTP AUTHENTICATION</h2>
                            <p style="color: var(--text-muted); margin-bottom: 2rem; text-align: center;">Enter the 6-digit code sent to your encrypted line.</p>
                            <input type="text" name="otp" placeholder="000000" maxlength="6" style="text-align: center; font-size: 2rem; letter-spacing: 10px;">
                            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 18px;">Finalize Identity</button>
                        </form>
                    `;
                }

                app.openModal(`<div class="fade-in">${content}</div>`);
            },

            handleLogin: async (e) => {
                e.preventDefault();
                app.showToast("Authenticating...");
                const fd = Object.fromEntries(new FormData(e.target));
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/login`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(fd)
                    });
                    const data = await res.json();
                    if(res.ok) {
                        APP_STATE.user = data;
                        sessionStorage.setItem('user', JSON.stringify(data));
                        app.closeModal();
                        app.showSuccessModal(data);
                    } else {
                        app.showToast(data.error || "Access Denied");
                    }
                } catch(e) { app.showToast("Connection Interrupted"); }
            },

            // NEW SUCCESS MODAL LOGIC
            showSuccessModal: (user) => {
                const modal = document.getElementById('success-modal');
                document.getElementById('success-user-name').textContent = user.name;
                document.getElementById('success-user-email').textContent = user.email;
                document.getElementById('success-user-role').textContent = user.role === 'author' ? 'ADMIN' : 'OPERATIVE';
                
                modal.classList.add('active');
            },

            closeSuccessModal: () => {
                document.getElementById('success-modal').classList.remove('active');
                app.init();
            },

            handleRegister: async (e) => {
                e.preventDefault();
                app.showToast("Transmitting Protocol...");
                const fd = Object.fromEntries(new FormData(e.target));
                APP_STATE.registrationEmail = fd.email;
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/register`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(fd)
                    });
                    if(res.ok) {
                        app.showToast("OTP Transmitted to Email.");
                        app.showAuth('verify');
                    } else {
                        const data = await res.json();
                        app.showToast(data.error);
                    }
                } catch(e) { app.showToast("Registration Failed"); }
            },

            handleVerifyOTP: async (e) => {
                e.preventDefault();
                const otp = e.target.otp.value;
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/verify-otp`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email: APP_STATE.registrationEmail, otp })
                    });
                    if(res.ok) {
                        app.showToast("Agent Verified. Proceed to Login.");
                        app.showAuth('login');
                    } else {
                        app.showToast("Checksum Invalid (Incorrect OTP)");
                    }
                } catch(e) { app.showToast("Verification Logic Failure"); }
            },

            executeLogout: () => {
                sessionStorage.removeItem('user');
                APP_STATE.user = null;
                APP_STATE.cart = [];
                app.showToast("Session Terminated Safely.");
                app.init();
            },

            postFieldReport: async (id) => {
                const comment = document.getElementById('review-comment-field').value;
                if(!comment) return;
                try {
                    await fetch(`${COMMAND_CONFIG.API_BASE}/review/${id}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ user: APP_STATE.user.name, comment })
                    });
                    app.showToast("Field Report Logged.");
                    app.syncInventory().then(() => app.viewProductDetails(id));
                } catch(e) {}
            },

            // ============================================================
            // UTILITIES
            // ============================================================

            openModal: (html) => {
                document.getElementById('modal-body-content').innerHTML = html;
                document.getElementById('modal-overlay').classList.add('active');
            },

            closeModal: () => {
                document.getElementById('modal-overlay').classList.remove('active');
            },

            showToast: (msg) => {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3500);
            }
        };

        // EVENT LISTENERS
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if(e.target.id === 'modal-overlay') app.closeModal();
        });

        // BOOT THE ENGINE
        window.onload = app.init;
    </script>
</body>
</html>
