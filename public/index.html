<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNG Surveillance | Premium CCTV Solutions</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Geocoding for Map Search -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        /* ============================================================
           DESIGN SYSTEM & GLOBAL VARIABLES
           ============================================================ */
        :root {
            /* Color Palette */
            --bg-main: #f8fafc;
            --bg-white: #ffffff;
            --bg-light: #f1f5f9;
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --primary-light: #7dd3fc;
            --secondary: #64748b;
            --accent: #06b6d4;
            
            /* Semantic Colors */
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            
            /* Text Colors */
            --text-dark: #1e293b;
            --text-main: #334155;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            
            /* UI Elements */
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            
            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            
            /* Typography */
            --font-main: 'Inter', sans-serif;
            --font-display: 'Poppins', sans-serif;
        }

        /* ============================================================
           RESET & BASE STYLES
           ============================================================ */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            background: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ============================================================
           SCROLLBAR CUSTOMIZATION
           ============================================================ */
        ::-webkit-scrollbar { 
            width: 10px; 
            height: 10px;
        }
        
        ::-webkit-scrollbar-track { 
            background: var(--bg-light); 
        }
        
        ::-webkit-scrollbar-thumb { 
            background: var(--primary); 
            border-radius: 10px; 
        }
        
        ::-webkit-scrollbar-thumb:hover { 
            background: var(--primary-dark); 
        }

        ::selection { 
            background: var(--primary-light); 
            color: var(--text-dark); 
        }

        /* ============================================================
           ANIMATIONS & KEYFRAMES
           ============================================================ */
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }

        @keyframes slideUp { 
            from { 
                opacity: 0; 
                transform: translateY(30px); 
            } 
            to { 
                opacity: 1; 
                transform: translateY(0); 
            } 
        }

        @keyframes slideDown {
            from { 
                opacity: 0; 
                transform: translateY(-20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        @keyframes slideInRight {
            from { 
                opacity: 0; 
                transform: translateX(-20px); 
            }
            to { 
                opacity: 1; 
                transform: translateX(0); 
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        /* Animation Classes */
        .fade-in { animation: fadeIn 0.5s ease; }
        .slide-up { animation: slideUp 0.6s ease; }
        .slide-down { animation: slideDown 0.3s ease; }
        .slide-in-right { animation: slideInRight 0.3s ease; }
        .float { animation: float 3s ease-in-out infinite; }
        .pulse { animation: pulse 2s ease-in-out infinite; }

        /* ============================================================
           BUTTON COMPONENTS
           ============================================================ */
        .btn { 
            padding: 12px 24px; 
            border-radius: var(--radius-md); 
            font-family: var(--font-display); 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            border: none;
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            justify-content: center; 
            font-size: 0.95rem;
            text-decoration: none;
            user-select: none;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); 
            color: white; 
            box-shadow: var(--shadow); 
        }
        
        .btn-primary:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary { 
            background: white; 
            border: 2px solid var(--border); 
            color: var(--text-dark); 
        }
        
        .btn-secondary:hover:not(:disabled) { 
            border-color: var(--primary); 
            color: var(--primary); 
        }

        .btn-danger { 
            background: var(--danger); 
            color: white; 
        }
        
        .btn-danger:hover:not(:disabled) { 
            background: #dc2626; 
        }

        .btn-success { 
            background: var(--success); 
            color: white; 
        }
        
        .btn-success:hover:not(:disabled) {
            background: #059669;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }
        
        .btn-warning:hover:not(:disabled) {
            background: #d97706;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85rem;
        }
        
        .btn-lg {
            padding: 16px 32px;
            font-size: 1.1rem;
        }

        /* ============================================================
           FORM COMPONENTS
           ============================================================ */
        .form-group { 
            margin-bottom: 20px; 
        }
        
        .label { 
            font-weight: 600; 
            font-size: 0.9rem; 
            color: var(--text-dark); 
            margin-bottom: 8px; 
            display: block; 
        }
        
        input, textarea, select { 
            width: 100%; 
            background: white; 
            border: 2px solid var(--border); 
            padding: 12px 16px; 
            color: var(--text-dark); 
            border-radius: var(--radius-md); 
            font-family: var(--font-main); 
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        input:focus, textarea:focus, select:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); 
        }
        
        input:disabled, textarea:disabled, select:disabled {
            background: var(--bg-light);
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* ============================================================
           BADGE COMPONENTS
           ============================================================ */
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }
        
        .badge-primary { 
            background: var(--primary-light); 
            color: var(--primary-dark); 
        }
        
        .badge-success { 
            background: #d1fae5; 
            color: #065f46; 
        }
        
        .badge-warning { 
            background: #fef3c7; 
            color: #92400e; 
        }
        
        .badge-danger { 
            background: #fee2e2; 
            color: #991b1b; 
        }
        
        .badge-info { 
            background: #dbeafe; 
            color: #1e40af; 
        }

        /* Clickable badge effect */
        .badge.clickable-badge:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        /* ============================================================
           NAVIGATION BAR
           ============================================================ */
        nav { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: white; 
            box-shadow: var(--shadow-sm); 
            padding: 1rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .logo { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            cursor: pointer;
            transition: transform 0.3s ease;
            user-select: none;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo img {
            height: 50px;
            width: auto;
        }
        
        .logo-text {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .nav-right { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        /* ============================================================
           USER MENU DROPDOWN (3 Dots - For Customers)
           ============================================================ */
        .user-menu-container {
            position: relative;
        }

        .user-menu-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-light);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-dark);
            font-size: 1.2rem;
        }

        .user-menu-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .user-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            background: white;
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            min-width: 220px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 2000;
        }

        .user-dropdown.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .user-dropdown-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border);
        }

        .user-dropdown-item:last-child {
            border-bottom: none;
        }

        .user-dropdown-item:hover {
            background: var(--bg-light);
            color: var(--primary);
        }

        .user-dropdown-header {
            padding: 15px 20px;
            background: var(--bg-light);
            border-bottom: 2px solid var(--border);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .user-dropdown-name {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .user-dropdown-email {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* ============================================================
           ADMIN HAMBURGER MENU (Inside Admin Panel)
           ============================================================ */
        .admin-menu-container {
            position: relative;
            margin-bottom: 20px;
        }

        .admin-hamburger-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s;
            padding: 15px 20px;
            color: white;
            font-weight: 700;
            font-family: var(--font-display);
        }

        .admin-hamburger-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .hamburger-icon {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hamburger-line {
            width: 25px;
            height: 3px;
            background: white;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .admin-dropdown {
            background: white;
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .admin-dropdown.active {
            max-height: 600px;
            opacity: 1;
        }

        .admin-dropdown-item {
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }

        .admin-dropdown-item:last-child {
            border-bottom: none;
        }

        .admin-dropdown-item:hover {
            background: var(--bg-light);
            color: var(--primary);
            padding-left: 25px;
        }

        .admin-dropdown-item.active {
            background: var(--primary-light);
            color: var(--primary-dark);
            border-left: 4px solid var(--primary);
        }

        /* ============================================================
           HERO SECTION
           ============================================================ */
        .hero { 
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            padding: 80px 5%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero .subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* ============================================================
           CATEGORY & PRODUCT GRIDS
           ============================================================ */
        .category-selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 5%;
        }

        .category-card-main {
            background: white;
            border-radius: var(--radius-xl);
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            border: 2px solid var(--border);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .category-card-main:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: var(--shadow-xl);
        }

        .cat-icon-circle {
            width: 80px;
            height: 80px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            color: var(--primary);
            transition: 0.4s;
        }

        .category-card-main:hover .cat-icon-circle {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }

        .cat-title-main {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .cat-badge-main {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
        }
        
        .product-grid-container {
            padding: 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card { 
            background: white; 
            border: 2px solid var(--border); 
            border-radius: var(--radius-lg); 
            overflow: hidden; 
            transition: all 0.3s ease; 
            cursor: pointer; 
        }
        
        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: var(--shadow-xl); 
            border-color: var(--primary);
        }

        .card-img-box { 
            height: 250px; 
            background: var(--bg-light); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            position: relative; 
            overflow: hidden; 
        }
        
        .card img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            transition: 0.3s ease;
        }
        
        .card:hover img { 
            transform: scale(1.1); 
        }
        
        .card-info { 
            padding: 20px; 
        }
        
        .card-title {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .price-tag { 
            font-size: 1.6rem; 
            font-family: var(--font-display); 
            font-weight: 700; 
            color: var(--primary);
            margin: 10px 0;
        }

        .stock-label { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: var(--danger); 
            color: white; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            z-index: 10; 
        }

        .tag {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 8px;
        }

        /* ============================================================
           MODALS & OVERLAYS
           ============================================================ */
        .overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(4px);
            z-index: 2000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.3s ease; 
        }
        
        .overlay.active { 
            opacity: 1; 
            pointer-events: all; 
        }
        
        .modal { 
            background: white; 
            width: 95%; 
            max-width: 600px; 
            padding: 40px; 
            border-radius: var(--radius-xl); 
            box-shadow: var(--shadow-xl); 
            transform: scale(0.9); 
            transition: 0.3s ease; 
            max-height: 90vh; 
            overflow-y: auto; 
        }
        
        .overlay.active .modal { 
            transform: scale(1); 
        }

        /* Map Modal */
        .map-modal {
            max-width: 800px;
            width: 95%;
        }

        #location-map {
            width: 100%;
            height: 450px;
            border-radius: var(--radius-md);
            margin: 20px 0;
            border: 2px solid var(--border);
        }

        .map-instructions {
            background: var(--bg-light);
            padding: 15px;
            border-radius: var(--radius-md);
            margin-bottom: 15px;
            border-left: 4px solid var(--info);
        }

        .location-status {
            background: white;
            border: 2px solid var(--border);
            padding: 15px;
            border-radius: var(--radius-md);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .location-status.loading {
            border-color: var(--warning);
            background: #fef3c7;
        }

        .location-status.success {
            border-color: var(--success);
            background: #d1fae5;
        }

        /* ============================================================
           CART PANEL
           ============================================================ */
        .cart-panel { 
            position: fixed; 
            top: 0; 
            right: -450px; 
            width: 450px; 
            height: 100vh; 
            background: white; 
            border-left: 2px solid var(--border); 
            z-index: 2100; 
            padding: 30px; 
            transition: 0.4s ease; 
            display: flex; 
            flex-direction: column; 
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.1);
        }
        
        .cart-panel.open { 
            right: 0; 
        }

        /* ============================================================
           TOAST NOTIFICATIONS
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 50px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(100px);
            transition: all 0.4s ease;
            z-index: 4000;
            box-shadow: var(--shadow-xl);
            max-width: 400px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
        }

        .toast.error {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
        }

        .toast.warning {
            background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%);
        }

        /* ============================================================
           FLOATING WHATSAPP BUTTON
           ============================================================ */
        .whatsapp-float {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            z-index: 3500;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-float.show {
            display: flex;
        }

        /* ============================================================
           LOADER
           ============================================================ */
        #loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* ============================================================

            // New helper functions for carousel
            changeCarouselImage: (delta) => {
                const newIndex = APP_STATE.currentImageIndex + delta;
                if (newIndex < 0 || newIndex >= APP_STATE.currentProductImages.length) return;
                APP_STATE.currentImageIndex = newIndex;
                const mainImg = document.getElementById('carousel-main-img');
                if (mainImg) {
                    mainImg.src = APP_STATE.currentProductImages[newIndex];
                }
                // Update active dot
                document.querySelectorAll('.carousel-dot').forEach((dot, i) => {
                    if (i === newIndex) dot.classList.add('active');
                    else dot.classList.remove('active');
                });
                // Update active thumbnail
                document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
                    if (i === newIndex) thumb.classList.add('active');
                    else thumb.classList.remove('active');
                });
            },

            setCarouselImage: (index) => {
                if (index < 0 || index >= APP_STATE.currentProductImages.length) return;
                APP_STATE.currentImageIndex = index;
                const mainImg = document.getElementById('carousel-main-img');
                if (mainImg) {
                    mainImg.src = APP_STATE.currentProductImages[index];
                }
                // Update active dot
                document.querySelectorAll('.carousel-dot').forEach((dot, i) => {
                    if (i === index) dot.classList.add('active');
                    else dot.classList.remove('active');
                });
                // Update active thumbnail
                document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
                    if (i === index) thumb.classList.add('active');
                    else thumb.classList.remove('active');
                });
            },

            // ============================================================
            // ADD TO CART
            // ============================================================
            executeAddToCart: (id) => {
                if(!APP_STATE.user) {
                    app.showToast("Please login to add items to cart", 'error');
                    app.closeModal();
                    app.showAuth('login');
                    return;
                }

                const product = APP_STATE.inventory.find(x => x._id === id);
                const qtyRequested = parseInt(document.getElementById('purchase-qty-input')?.value) || 1;

                if(qtyRequested > product.stock) {
                    app.showToast("Requested quantity exceeds available stock", 'error');
                    return;
                }

                const existingIndex = APP_STATE.cart.findIndex(item => item._id === id);
                
                if(existingIndex !== -1) {
                    const newTotalQty = APP_STATE.cart[existingIndex].qty + qtyRequested;
                    if(newTotalQty > product.stock) {
                        app.showToast("Cannot add more items - stock limit reached", 'error');
                        return;
                    }
                    APP_STATE.cart[existingIndex].qty = newTotalQty;
                } else {
                    APP_STATE.cart.push({ ...product, qty: qtyRequested });
                }

                app.showToast(`${product.name} added to cart!`, 'success');
                app.closeModal();
                app.renderHeader();
            },

                    return `

                                    <div style="color: var(--primary); font-weight: 700; margin-top: 4px;">₹${rowTotal.toLocaleString()}</div>
                                </div>

                }).join('');

                container.innerHTML = html;

            initializeMap: () => {
                const defaultLat = 20.5937;
                const defaultLng = 78.9629;
                
                APP_STATE.map = L.map('location-map').setView([defaultLat, defaultLng], 5);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(APP_STATE.map);
                
                // Add geocoder search control
                const geocoder = L.Control.geocoder({
                    defaultMarkGeocode: false
                }).on('markgeocode', function(e) {
                    const latlng = e.geocode.center;
                    if (APP_STATE.marker) {
                        APP_STATE.map.removeLayer(APP_STATE.marker);
                    }
                    APP_STATE.marker = L.marker(latlng, { draggable: true }).addTo(APP_STATE.map);
                    APP_STATE.userLocation = { latitude: latlng.lat, longitude: latlng.lng };
                    APP_STATE.map.setView(latlng, 15);
                    
                    APP_STATE.marker.on('dragend', function(event) {
                        const position = event.target.getLatLng();
                        APP_STATE.userLocation = { latitude: position.lat, longitude: position.lng };
                    });

                    // Update status
                    const statusEl = document.getElementById('location-status');
                    if (statusEl) {
                        statusEl.className = 'location-status success';
                        statusEl.innerHTML = '<i class="fa-solid fa-check-circle"></i><span>Location selected from search. Adjust marker if needed.</span>';
                    }
                }).addTo(APP_STATE.map);
                
                APP_STATE.map.on('click', function(e) {
                    if (APP_STATE.marker) {
                        APP_STATE.map.removeLayer(APP_STATE.marker);
                    }
                    
                    APP_STATE.marker = L.marker([e.latlng.lat, e.latlng.lng], {
                        draggable: true
                    }).addTo(APP_STATE.map);
                    
                    APP_STATE.userLocation = {
                        latitude: e.latlng.lat,
                        longitude: e.latlng.lng
                    };
                    
                    APP_STATE.marker.on('dragend', function(event) {
                        const position = event.target.getLatLng();
                        APP_STATE.userLocation = {
                            latitude: position.lat,
                            longitude: position.lng
                        };
                    });

                    // Update status
                    const statusEl = document.getElementById('location-status');
                    if (statusEl) {
                        statusEl.className = 'location-status success';
                        statusEl.innerHTML = '<i class="fa-solid fa-check-circle"></i><span>Location pinned on map. Drag to adjust.</span>';
                    }
                });
                
                // Get live location
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            
                            APP_STATE.map.setView([lat, lng], 15);
                            
                            APP_STATE.marker = L.marker([lat, lng], {
                                draggable: true
                            }).addTo(APP_STATE.map);
                            
                            APP_STATE.userLocation = {
                                latitude: lat,
                                longitude: lng
                            };
                            
                            const statusEl = document.getElementById('location-status');
                            if (statusEl) {
                                statusEl.className = 'location-status success';
                                statusEl.innerHTML = '<i class="fa-solid fa-check-circle"></i><span>Live location found! Adjust marker if needed.</span>';
                            }
                            
                            APP_STATE.marker.on('dragend', function(event) {
                                const position = event.target.getLatLng();
                                APP_STATE.userLocation = {
                                    latitude: position.lat,
                                    longitude: position.lng
                                };
                            });
                        },
                        (error) => {
                            const statusEl = document.getElementById('location-status');
                            if (statusEl) {
                                statusEl.className = 'location-status';
                                statusEl.innerHTML = '<i class="fa-solid fa-exclamation-triangle"></i><span>Could not get live location. Use search or click on map.</span>';
                            }
                        }
                    );
                }
            },

            initiatePayment: async (amount) => {
                const phone = document.getElementById('checkout-phone').value;
                const address = document.getElementById('checkout-address').value;
                const pincode = document.getElementById('checkout-pincode').value;

                if(!phone || !address || !pincode) {
                    app.showToast("Please fill all required fields", 'error');
                    return;
                }

                if(!/^[0-9]{10}$/.test(phone.replace(/\D/g, ''))) {
                    app.showToast("Please enter a valid 10-digit phone number", 'error');
                    return;
                }

                if(!/^[0-9]{6}$/.test(pincode)) {
                    app.showToast("Please enter a valid 6-digit pincode", 'error');
                    return;
                }

                try {
                    app.showToast("Connecting to payment gateway...", 'warning');
                    
                    const response = await fetch(`${COMMAND_CONFIG.API_BASE}/create-order`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ amount })
                    });
                    
                    const orderData = await response.json();

                    const options = {
                        "key": COMMAND_CONFIG.RAZORPAY_ID,
                        "amount": orderData.amount,
                        "currency": "INR",
                        "name": "BNG Surveillance",
                        "description": "CCTV & Security Equipment",
                        "order_id": orderData.id,
                        "handler": (resp) => app.verifyPaymentResponse(resp, amount, phone, address, pincode),
                        "theme": { "color": "#0ea5e9" },
                        "prefill": {
                            "name": APP_STATE.user.name,
                            "email": APP_STATE.user.email,
                            "contact": phone
                        }
                    };

                    const rzp = new Razorpay(options);
                    rzp.open();
                    app.closeModal();

                } catch(e) {
                    app.showToast("Payment gateway error. Please try again.", 'error');
                }
            },

            showForgotPassword: () => {

                            </div>

                                <i class="fa-solid fa-paper-plane"></i> Send OTP
                            </button>

                            <a href="#" onclick="app.showAuth('login'); return false;" style="color: var(--primary);">
                                Back to Login
                            </a>
                        </p>
                    </div>
                `;
                app.openModal(html);
            },

            handleForgotPassword: async (e) => {
                e.preventDefault();
                const email = e.target.email.value;
                app.showToast("Sending OTP...", 'warning');
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/forgot-password`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    if(res.ok) {
                        app.showToast("OTP sent to your email!", 'success');
                        app.showResetPassword(email);
                    } else {
                        app.showToast(data.error || "Failed to send OTP", 'error');
                    }
                } catch(e) {
                    app.showToast("Network error", 'error');
                }
            },

            showResetPassword: (email) => {
                const html = `
                    <div class="fade-in">
                        <h2 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 25px; color: var(--text-dark);">
                            Reset Password
                        </h2>
                        <form onsubmit="app.handleResetPassword(event, '${email}')">
                            <div class="form-group">
                                <label class="label">OTP</label>
                                <input type="text" name="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
                            </div>
                            <div class="form-group">
                                <label class="label">New Password</label>
                                <input type="password" name="newPassword" placeholder="Enter new password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-full" style="padding: 16px;">
                                <i class="fa-solid fa-key"></i> Reset Password
                            </button>
                        </form>
                        <p class="text-center mt-20">
                            <a href="#" onclick="app.showAuth('login'); return false;" style="color: var(--primary);">
                                Back to Login
                            </a>
                        </p>
                    </div>
                `;
                app.openModal(html);
            },

            handleResetPassword: async (e, email) => {
                e.preventDefault();
                const otp = e.target.otp.value;
                const newPassword = e.target.newPassword.value;
                app.showToast("Resetting password...", 'warning');
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/reset-password`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email, otp, newPassword })
                    });
                    const data = await res.json();
                    if(res.ok) {
                        app.showToast("Password reset successfully! Please login.", 'success');
                        app.showAuth('login');
                    } else {
                        app.showToast(data.error || "Reset failed", 'error');
                    }
                } catch(e) {
                    app.showToast("Network error", 'error');
                }
            },

            handleLogin: async (e) => {
                e.preventDefault();
                app.showToast("Logging in...", 'warning');
                const fd = Object.fromEntries(new FormData(e.target));
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/login`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(fd)
                    });
                    const data = await res.json();
                    if(res.ok) {
                        APP_STATE.user = data;
                        sessionStorage.setItem('user', JSON.stringify(data));
                        app.closeModal();
                        
                        app.showToast(`Welcome back, ${data.name}!`, 'success');
                        
                        app.renderHeader();
                        if(APP_STATE.user.role !== 'author') {
                            app.showHome();
                        } else {
                            app.renderAdminPortal();
                        }
                    } else {
                        app.showToast(data.error || "Login failed", 'error');
                    }
                } catch(e) { 
                    app.showToast("Connection error", 'error'); 
                }
            },

            handleRegister: async (e) => {
                e.preventDefault();
                app.showToast("Creating account...", 'warning');
                const fd = Object.fromEntries(new FormData(e.target));
                APP_STATE.registrationEmail = fd.email;
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/register`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(fd)
                    });
                    if(res.ok) {
                        app.showToast("Verification code sent to your email!", 'success');
                        app.showAuth('verify');
                    } else {
                        const data = await res.json();
                        app.showToast(data.error, 'error');
                    }
                } catch(e) { 
                    app.showToast("Registration failed", 'error'); 
                }
            },

            handleVerifyOTP: async (e) => {
                e.preventDefault();
                const otp = e.target.otp.value;
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/verify-otp`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email: APP_STATE.registrationEmail, otp })
                    });
                    if(res.ok) {
                        app.showToast("Email verified! Please login.", 'success');
                        app.showAuth('login');
                    } else {
                        app.showToast("Invalid verification code", 'error');
                    }
                } catch(e) { 
                    app.showToast("Verification failed", 'error'); 
                }
            },

            executeLogout: () => {
                if(!confirm('Are you sure you want to logout?')) return;
                sessionStorage.removeItem('user');
                APP_STATE.user = null;
                APP_STATE.cart = [];
                
                const whatsappBtn = document.getElementById('whatsapp-float');
                if (whatsappBtn) whatsappBtn.classList.remove('show');
                
                app.showToast("Logged out successfully", 'success');
                app.showHome();

            // ============================================================
            // ADMIN PANEL (Hamburger Menu INSIDE Admin Dashboard)
            // ============================================================
            renderAdminPortal: async () => {
                if(!APP_STATE.user || APP_STATE.user.role !== 'author') {
                    return app.showHome();
                }

                try {
                    app.showToast("Loading admin dashboard...", 'warning');
                    const [ordersRes, inventoryRes, queriesRes] = await Promise.all([
                        fetch(`${COMMAND_CONFIG.API_BASE}/orders`),
                        fetch(`${COMMAND_CONFIG.API_BASE}/products`),
                        fetch(`${COMMAND_CONFIG.API_BASE}/admin/requests`)
                    ]);

                    APP_STATE.orders = await ordersRes.json();
                    APP_STATE.inventory = await inventoryRes.json();
                    if(queriesRes.ok) APP_STATE.queries = await queriesRes.json();

                } catch(e) { 
                    console.error("Admin Load Failed:", e); 
                }

                const root = document.getElementById('app-root-view');
                root.innerHTML = `

                        <div id="admin-tab-view">
                            ${app.getTabContent(APP_STATE.currentAdminTab)}

                                            <td>
                                                <div class="flex gap-15" style="align-items: center;">
                                                    <img src="${p.image}" style="width:50px; height:50px; object-fit:contain; background: var(--bg-light); border-radius: var(--radius-sm); padding: 4px;">
                                                    <strong>${p.name}</strong>
                                                </div>
                                            </td>
                                            <td><span class="badge badge-primary">${CATEGORIES[p.category]?.name || p.category}</span></td>
                                            <td style="font-weight: 700;">₹${p.price.toLocaleString()}</td>
                                            <td style="color: ${p.stock < 1 ? 'var(--danger)' : 'var(--success)'}; font-weight: 700;">
                                                ${p.stock}
                                            </td>
                                            <td>
                                                <div class="flex gap-10">
                                                    <button onclick='app.showEditProduct(${JSON.stringify(p)})' class="btn btn-secondary btn-sm">
                                                        <i class="fa-solid fa-pen"></i> Edit
                                                    </button>
                                                    <button onclick="app.executeDeleteProduct('${p._id}', '${p.name}')" class="btn btn-danger btn-sm">
                                                        <i class="fa-solid fa-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }
                return '';
            },

            // ============================================================
            // ADMIN ACTIONS
            // ============================================================
            executeSolveQuery: async (id) => {
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/requests/${id}/solve`, { method: 'PATCH' });
                    if(res.ok) {
                        app.showToast("Request marked as resolved", 'success');
                        await app.renderAdminPortal();
                    }
                } catch(e) { app.showToast("Operation failed", 'error'); }
            },

            executeDeleteQuery: async (id) => {
                if(!confirm("Delete this support request?")) return;
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/requests/${id}`, { method: 'DELETE' });
                    if(res.ok) {
                        app.showToast("Request deleted", 'success');
                        await app.renderAdminPortal();
                    }
                } catch(e) { app.showToast("Delete failed", 'error'); }
            },

            executeOrderDelivery: async (id) => {
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/orders/${id}/deliver`, { method: 'PATCH' });
                    if(res.ok) { 
                        app.showToast("Order marked as delivered", 'success'); 
                        await app.renderAdminPortal(); 
                    }
                } catch(e) { app.showToast("Operation failed", 'error'); }
            },

            // ============================================================
            // PRODUCT MANAGEMENT (with multiple image upload & validation)
            // ============================================================
            showAddProduct: () => {
                const categoryOptions = Object.keys(CATEGORIES).map(key => 
                    `<option value="${key}">${CATEGORIES[key].name}</option>`
                ).join('');

                const html = `
                    <div class="fade-in">
                        <h2 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 25px; color: var(--text-dark);">
                            Add New Product
                        </h2>
                        <form id="add-product-form" onsubmit="app.executeAddProduct(event)">
                            <div class="form-group">
                                <label class="label">Product Name</label>
                                <input name="name" placeholder="Enter product name" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Category</label>
                                <select name="category" required>
                                    <option value="">Select Category</option>
                                    ${categoryOptions}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="label">Price (₹)</label>
                                <input name="price" type="number" placeholder="Enter price" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Stock Quantity</label>
                                <input name="stock" type="number" placeholder="Enter stock quantity" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Description</label>
                                <textarea name="desc" placeholder="Enter product description" required rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label class="label">Product Images (up to 5, max 5MB each)</label>
                                <input type="file" name="images" multiple accept="image/*" style="padding: 10px;" onchange="app.previewMultipleImages(event)">
                                <div id="image-preview-container" class="image-preview-container"></div>
                            </div>
                            <button type="submit" class="btn btn-primary w-full" style="padding: 16px;">
                                <i class="fa-solid fa-plus"></i> Add Product
                            </button>
                        </form>
                    </div>
                `;
                app.openModal(html);
            },

            previewMultipleImages: (event) => {
                const files = event.target.files;
                const container = document.getElementById('image-preview-container');
                if (!container) return;
                container.innerHTML = '';
                const maxSize = 5 * 1024 * 1024; // 5MB
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.size > maxSize) {
                        app.showToast(`File ${file.name} exceeds 5MB limit`, 'error');
                        event.target.value = ''; // clear input
                        container.innerHTML = '';
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.style.width = '100px';
                        img.style.height = '100px';
                        img.style.objectFit = 'cover';
                        img.style.borderRadius = '8px';
                        img.style.margin = '5px';
                        container.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                }
            },

            executeAddProduct: async (e) => {
                e.preventDefault();
                app.showToast("Adding product...", 'warning');
                const fd = new FormData(e.target);
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/products`, { 
                        method: 'POST', 
                        body: fd 
                    });
                    if(res.ok) {
                        app.showToast("Product added successfully!", 'success');
                        app.closeModal();
                        await app.renderAdminPortal();
                    } else {
                        const err = await res.json();
                        app.showToast(err.error || "Failed to add product", 'error');
                    }
                } catch(err) { 
                    app.showToast("Failed to add product", 'error'); 
                }
            },

            showEditProduct: (p) => {
                const categoryOptions = Object.keys(CATEGORIES).map(key => 
                    `<option value="${key}" ${p.category === key ? 'selected' : ''}>${CATEGORIES[key].name}</option>`
                ).join('');

                const html = `
                    <div class="fade-in">
                        <h2 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 25px; color: var(--text-dark);">
                            Edit Product
                        </h2>
                        <form onsubmit="app.executeEditProduct(event, '${p._id}')">
                            <div class="form-group">
                                <label class="label">Product Name</label>
                                <input name="name" value="${p.name}" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Category</label>
                                <select name="category" required>
                                    ${categoryOptions}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="label">Price (₹)</label>
                                <input name="price" type="number" value="${p.price}" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Stock</label>
                                <input name="stock" type="number" value="${p.stock}" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Description</label>
                                <textarea name="desc" required rows="3">${p.desc}</textarea>
                            </div>
                            <div class="form-group">
                                <label class="label">New Images (optional, up to 5, will replace existing, max 5MB each)</label>
                                <input type="file" name="images" multiple accept="image/*" style="padding: 10px;" onchange="app.previewMultipleImages(event)">
                                <div id="image-preview-container" class="image-preview-container"></div>
                            </div>
                            <button type="submit" class="btn btn-primary w-full" style="padding: 16px;">
                                <i class="fa-solid fa-save"></i> Save Changes
                            </button>
                        </form>
                    </div>
                `;
                app.openModal(html);
            },

            executeEditProduct: async (e, id) => {
                e.preventDefault();
                app.showToast("Updating product...", 'warning');
                const fd = new FormData(e.target);
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/products/${id}`, { 
                        method: 'PUT', 
                        body: fd 
                    });
                    if(res.ok) {
                        app.showToast("Product updated successfully!", 'success');
                        app.closeModal();
                        await app.renderAdminPortal();
                    } else {
                        const err = await res.json();
                        app.showToast(err.error || "Update failed", 'error');
                    }
                } catch(err) { 
                    app.showToast("Update failed", 'error'); 
                }
            },

            executeDeleteProduct: async (id, name) => {
                if(!confirm(`Delete "${name}"?\n\nThis action cannot be undone.`)) return;

                try {
                    app.showToast("Deleting product...", 'warning');
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/products/${id}`, { 
                        method: 'DELETE' 
                    });
                    
                    if(res.ok) {
                        app.showToast("Product deleted successfully", 'success');
                        await app.renderAdminPortal();
                    } else {
                        app.showToast("Failed to delete product", 'error');
                    }
                } catch(e) { 
                    app.showToast("Delete operation failed", 'error'); 
                }
            },

            // ============================================================
            // UTILITY METHODS
            // ============================================================
            openModal: (html) => {
                document.getElementById('modal-body-content').innerHTML = html;
                document.getElementById('modal-overlay').classList.add('active');
            },

            closeModal: () => {
                document.getElementById('modal-overlay').classList.remove('active');
                document.getElementById('modal-body-content').classList.remove('map-modal');
                
                if (APP_STATE.map) {
                    APP_STATE.map.remove();
                    APP_STATE.map = null;
                    APP_STATE.marker = null;
                }
            },

            showToast: (msg, type = 'success') => {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.className = 'toast show ' + type;
                setTimeout(() => t.classList.remove('show'), 3500);
            }
        };

        // ================================================================
        // EVENT LISTENERS
        // ================================================================
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if(e.target.id === 'modal-overlay') app.closeModal();
        });

        // Close dropdowns on click outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-menu-container')) {
                app.closeUserMenu();
            }
            if (!e.target.closest('.admin-menu-container')) {
                app.closeAdminNavMenu();
            }
        });

        // ================================================================
        // APPLICATION INITIALIZATION
        // ================================================================
        window.onload = app.init;
        
        console.log('%c🛡️ BNG SURVEILLANCE LOADED', 'color: #0ea5e9; font-size: 20px; font-weight: bold;');
        console.log('%cDeveloped by Farhan Zahoor', 'color: #64748b; font-size: 12px;');
    </script>
</body>
</html>
