<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNG Surveillance | Premium CCTV Solutions</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        /* ============================================================
           1. DESIGN SYSTEM & VARIABLES
           ============================================================ */
        :root {
            /* Colors */
            --bg-main: #f8fafc;
            --bg-white: #ffffff;
            --bg-light: #f1f5f9;
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --primary-light: #7dd3fc;
            --secondary: #64748b;
            --accent: #06b6d4;
            
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            
            --text-dark: #1e293b;
            --text-main: #334155;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            
            --font-main: 'Inter', sans-serif;
            --font-display: 'Poppins', sans-serif;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            background: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-light); }
        ::-webkit-scrollbar-thumb { 
            background: var(--primary); 
            border-radius: 10px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        ::selection { background: var(--primary-light); color: var(--text-dark); }

        /* ============================================================
           2. ANIMATIONS
           ============================================================ */
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fade-in { animation: fadeIn 0.5s ease; }
        .slide-up { animation: slideUp 0.6s ease; }
        .float { animation: float 3s ease-in-out infinite; }

        /* ============================================================
           3. BUTTONS & FORM COMPONENTS
           ============================================================ */
        .btn { 
            padding: 12px 24px; 
            border-radius: var(--radius-md); 
            font-family: var(--font-display); 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            border: none;
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            justify-content: center; 
            font-size: 0.95rem;
            text-decoration: none;
        }

        .btn-primary { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); 
            color: white; 
            box-shadow: var(--shadow); 
        }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary { 
            background: white; 
            border: 2px solid var(--border); 
            color: var(--text-dark); 
        }
        .btn-secondary:hover { 
            border-color: var(--primary); 
            color: var(--primary); 
        }

        .btn-danger { 
            background: var(--danger); 
            color: white; 
        }
        .btn-danger:hover { 
            background: #dc2626; 
        }

        .btn-success { 
            background: var(--success); 
            color: white; 
        }

        .form-group { margin-bottom: 20px; }
        
        .label { 
            font-weight: 600; 
            font-size: 0.9rem; 
            color: var(--text-dark); 
            margin-bottom: 8px; 
            display: block; 
        }
        
        input, textarea, select { 
            width: 100%; 
            background: white; 
            border: 2px solid var(--border); 
            padding: 12px 16px; 
            color: var(--text-dark); 
            border-radius: var(--radius-md); 
            font-family: var(--font-main); 
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        input:focus, textarea:focus, select:focus { 
            outline: none;
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }
        .badge-primary { background: var(--primary-light); color: var(--primary-dark); }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }

        /* ============================================================
           4. NAVIGATION
           ============================================================ */
        nav { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: white; 
            box-shadow: var(--shadow-sm); 
            padding: 1rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .logo { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            cursor: pointer;
            transition: transform 0.3s ease;
            user-select: none;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo img {
            height: 50px;
            width: auto;
        }
        
        .logo-text {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .nav-right { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        /* ============================================================
           5. HERO SECTION
           ============================================================ */
        .hero { 
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            padding: 80px 5%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero .subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* ============================================================
           6. CATEGORY & PRODUCT SECTIONS
           ============================================================ */
        .category-section {
            padding: 60px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .category-banner {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            padding: 30px;
            border-radius: var(--radius-xl);
            color: white;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-lg);
        }

        .category-banner-icon {
            font-size: 4rem;
            opacity: 0.3;
        }

        .category-banner-text h3 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .installation-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            backdrop-filter: blur(10px);
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
        }
        
        .card { 
            background: white; 
            border: 2px solid var(--border); 
            border-radius: var(--radius-lg); 
            overflow: hidden; 
            transition: all 0.3s ease; 
            cursor: pointer;
        }
        
        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: var(--shadow-xl);
            border-color: var(--primary);
        }

        .card-img-box { 
            height: 250px; 
            background: var(--bg-light); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            position: relative;
            overflow: hidden;
        }
        
        .card img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            transition: 0.3s ease;
        }
        .card:hover img { 
            transform: scale(1.1);
        }
        
        .card-info { padding: 20px; }
        
        .card-title {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .price-tag { 
            font-size: 1.6rem; 
            font-family: var(--font-display); 
            font-weight: 700; 
            color: var(--primary);
            margin: 10px 0;
        }

        .stock-label { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: var(--danger); 
            color: white; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 700;
            z-index: 10;
        }

        .tag {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 8px;
        }

        /* ============================================================
           7. MODALS & OVERLAYS
           ============================================================ */
        .overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(4px);
            z-index: 2000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.3s ease; 
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        
        .modal { 
            background: white; 
            width: 95%; 
            max-width: 600px; 
            padding: 40px; 
            border-radius: var(--radius-xl); 
            box-shadow: var(--shadow-xl);
            transform: scale(0.9); 
            transition: 0.3s ease; 
            max-height: 90vh; 
            overflow-y: auto; 
        }
        .overlay.active .modal { transform: scale(1); }

        /* Success Modal */
        .success-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .success-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .success-content {
            background: white;
            border-radius: var(--radius-xl);
            padding: 50px 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.4s ease;
            box-shadow: var(--shadow-xl);
        }

        .success-modal.active .success-content {
            transform: scale(1);
        }

        .success-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: white;
            animation: bounce 0.6s ease;
        }

        .success-title {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 15px;
        }

        .success-subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .user-info-card {
            background: var(--bg-light);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .user-info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .user-info-row:last-child {
            border-bottom: none;
        }

        .user-info-label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .user-info-value {
            font-weight: 600;
            color: var(--primary);
        }

        /* Cart Panel */
        .cart-panel { 
            position: fixed; 
            top: 0; 
            right: -450px; 
            width: 450px; 
            height: 100vh; 
            background: white; 
            border-left: 2px solid var(--border); 
            z-index: 2100; 
            padding: 30px; 
            transition: 0.4s ease; 
            display: flex; 
            flex-direction: column; 
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.1);
        }
        .cart-panel.open { right: 0; }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 50px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(100px);
            transition: all 0.4s ease;
            z-index: 4000;
            box-shadow: var(--shadow-xl);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            z-index: 3500;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-float.show {
            display: flex;
        }

        /* Loader */
        #loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* ============================================================
           8. FOOTER
           ============================================================ */
        footer {
            background: var(--text-dark);
            color: white;
            padding: 60px 5%;
            margin-top: 80px;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .social-links a {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-links a:hover {
            background: var(--primary);
            transform: translateY(-5px);
        }

        /* ============================================================
           9. ADMIN PANEL
           ============================================================ */
        .admin-layout { 
            display: flex; 
            min-height: calc(100vh - 70px); 
        }
        
        .sidebar { 
            width: 280px; 
            background: white; 
            border-right: 2px solid var(--border); 
            padding: 30px 20px; 
            position: fixed; 
            height: 100%; 
            overflow-y: auto; 
        }

        .sidebar-btn { 
            width: 100%; 
            text-align: left; 
            padding: 14px 18px; 
            margin-bottom: 8px; 
            background: transparent; 
            border: none;
            color: var(--text-muted); 
            cursor: pointer; 
            border-radius: var(--radius-md); 
            font-weight: 600;
            transition: all 0.3s; 
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-btn:hover { 
            background: var(--bg-light); 
            color: var(--text-dark); 
        }

        .sidebar-btn.active { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); 
            color: white; 
        }

        .admin-content { 
            margin-left: 280px; 
            padding: 40px; 
            width: 100%; 
            background: var(--bg-main);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-box {
            background: white;
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 25px;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .data-table thead {
            background: var(--bg-light);
        }

        .data-table th {
            padding: 15px;
            text-align: left;
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .data-table td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .data-table tbody tr:hover {
            background: var(--bg-light);
        }

        /* ============================================================
           10. RESPONSIVE DESIGN
           ============================================================ */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .cart-panel { width: 100%; right: -100%; }
            .grid { grid-template-columns: 1fr; }
            .sidebar { 
                position: static; 
                width: 100%; 
                border-right: none;
                border-bottom: 2px solid var(--border);
            }
            .admin-content { margin-left: 0; padding: 20px; }
            .category-banner {
                flex-direction: column;
                text-align: center;
            }
            .whatsapp-float {
                bottom: 80px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="margin-top: 25px; font-family: var(--font-display); color: var(--primary); font-weight: 600; font-size: 1.1rem;">Loading BNG Surveillance...</div>
    </div>

    <div id="toast" class="toast">Action Completed</div>

    <!-- Floating WhatsApp Button -->
    <a id="whatsapp-float" class="whatsapp-float" href="https://wa.me/916006750581?text=Hi%2C%20I%20need%20help%20with%20BNG%20Surveillance%20products" target="_blank" title="Chat with us on WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- SUCCESS LOGIN MODAL -->
    <div id="success-modal" class="success-modal">
        <div class="success-content">
            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2 class="success-title">Welcome Back!</h2>
            <p class="success-subtitle">You've successfully logged in to your account</p>
            <div class="user-info-card">
                <div class="user-info-row">
                    <span class="user-info-label">Name</span>
                    <span class="user-info-value" id="success-user-name">-</span>
                </div>
                <div class="user-info-row">
                    <span class="user-info-label">Email</span>
                    <span class="user-info-value" id="success-user-email">-</span>
                </div>
                <div class="user-info-row">
                    <span class="user-info-label">Account Type</span>
                    <span class="user-info-value" id="success-user-role">-</span>
                </div>
            </div>
            <button onclick="app.closeSuccessModal()" class="btn btn-primary" style="width: 100%;">
                <i class="fa-solid fa-store"></i> Start Shopping
            </button>
        </div>
    </div>

    <!-- CART PANEL -->
    <div id="cart-panel" class="cart-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="font-family: var(--font-display); font-weight: 700; color: var(--text-dark);"><i class="fa-solid fa-shopping-cart"></i> Your Cart</h2>
            <button onclick="app.toggleCart()" class="btn btn-secondary" style="padding: 8px 12px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div id="cart-items-container" style="flex: 1; overflow-y: auto;">
            <div style="text-align: center; color: var(--text-muted); margin-top: 100px;">
                <i class="fa-solid fa-shopping-basket" style="font-size: 4rem; opacity: 0.3; margin-bottom: 20px;"></i>
                <p>Your cart is empty</p>
            </div>
        </div>

        <div style="border-top: 2px solid var(--border); padding-top: 20px; margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.4rem; font-weight: 700; font-family: var(--font-display);">
                <span>Total</span>
                <span id="cart-total-display" style="color: var(--primary);">₹0</span>
            </div>
            <button onclick="app.checkout()" class="btn btn-primary" style="width: 100%; padding: 16px;">
                <i class="fa-solid fa-credit-card"></i> Proceed to Checkout
            </button>
        </div>
    </div>

    <!-- NAVIGATION -->
    <nav>
        <div class="logo" onclick="app.renderShop()" id="app-logo">
            <img src="bngimage.jpg" alt="BNG Logo" />
            <span class="logo-text">BNG Surveillance</span>
        </div>
        <div class="nav-right" id="nav-actions-area"></div>
    </nav>

    <!-- MAIN CONTENT -->
    <main id="app-root-view"></main>

    <!-- MODAL -->
    <div id="modal-overlay" class="overlay">
        <div id="modal-body-content" class="modal"></div>
    </div>

    <script>
        // ================================================================
        // CONFIGURATION
        // ================================================================
        const COMMAND_CONFIG = {
            API_BASE: '/api', 
            RAZORPAY_ID: 'rzphsdsjhch',
            WHATSAPP_ID: '916006750581'
        };

        // Product Categories
        const CATEGORIES = {
            ANALOG: { 
                name: 'CCTV Camera Analog', 
                icon: 'fa-video',
                badge: 'Professional Installation Included',
                color: '#0ea5e9'
            },
            IP: { 
                name: 'IP Camera', 
                icon: 'fa-network-wired',
                badge: 'Professional Installation Included',
                color: '#06b6d4'
            },
            WIFI: { 
                name: 'WiFi Camera', 
                icon: 'fa-wifi',
                badge: 'Professional Installation Included',
                color: '#8b5cf6'
            },
            '4G': { 
                name: '4G Camera', 
                icon: 'fa-signal',
                badge: 'Professional Installation Included',
                color: '#f59e0b'
            },
            ACCESSORIES: { 
                name: 'Camera Accessories', 
                icon: 'fa-toolbox',
                badge: 'Free Delivery',
                color: '#10b981'
            }
        };

        // ================================================================
        // APPLICATION STATE
        // ================================================================
        const APP_STATE = {
            user: JSON.parse(sessionStorage.getItem('user')) || null,
            cart: [],
            inventory: [],
            orders: [],
            queries: [],
            currentAdminTab: 'dashboard',
            registrationEmail: null,
            userLocation: null
        };

        // ================================================================
        // MAIN APPLICATION OBJECT
        // ================================================================
        const app = {
            
            // ============================================================
            // INITIALIZATION
            // ============================================================
            init: async () => {
                console.log('🚀 Initializing BNG Surveillance...');
                
                // Hide loader after 1.5 seconds
                setTimeout(() => {
                    const loader = document.getElementById('loader');
                    if(loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.remove(), 500);
                    }
                }, 1500);

                // Load inventory from server
                await app.syncInventory();
                
                // Render UI
                app.refreshUI();
                
                console.log('✅ Application ready!');
            },

            syncInventory: async () => {
                try {
                    console.log('📦 Syncing inventory...');
                    const response = await fetch(`${COMMAND_CONFIG.API_BASE}/products`);
                    if(response.ok) {
                        APP_STATE.inventory = await response.json();
                        console.log(`✅ Loaded ${APP_STATE.inventory.length} products`);
                    }
                } catch(err) {
                    console.error("❌ Database Sync Failed", err);
                    app.showToast("Failed to load products");
                }
            },

            refreshUI: () => {
                app.renderHeader();
                app.renderShop();
            },

            // ============================================================
            // FIXED SCROLL TO PRODUCTS FUNCTION
            // ============================================================
            scrollToProducts: async () => {
                console.log('📹 Browse Cameras button clicked!');
                
                // Ensure we're on the shop page
                const root = document.getElementById('app-root-view');
                if (!root) {
                    console.error('❌ App root not found');
                    return;
                }
                
                // Check if shop content is rendered
                const hasShopContent = root.innerHTML.includes('category-section');
                
                if (!hasShopContent || APP_STATE.inventory.length === 0) {
                    console.log('🔄 Rendering shop first...');
                    
                    // Sync inventory if empty
                    if (APP_STATE.inventory.length === 0) {
                        await app.syncInventory();
                    }
                    
                    // Render shop
                    app.renderShop();
                    
                    // Wait for DOM update
                    await new Promise(resolve => setTimeout(resolve, 300));
                }
                
                // Now try to find and scroll to first product section
                const categories = ['ANALOG', 'IP', 'WIFI', '4G', 'ACCESSORIES'];
                let targetSection = null;
                
                for (const cat of categories) {
                    const section = document.getElementById(`${cat}-section`);
                    if (section) {
                        targetSection = section;
                        console.log(`✅ Found section: ${cat}`);
                        break;
                    }
                }
                
                if (targetSection) {
                    // Smooth scroll with offset for fixed nav
                    const navHeight = document.querySelector('nav')?.offsetHeight || 70;
                    const yOffset = -navHeight - 20;
                    const y = targetSection.getBoundingClientRect().top + window.pageYOffset + yOffset;
                    
                    window.scrollTo({ 
                        top: y, 
                        behavior: 'smooth' 
                    });
                    
                    console.log('✅ Scrolling to products!');
                } else {
                    console.warn('⚠️ No product sections found');
                    app.showToast("Loading products... Please wait!");
                    
                    // Try one more sync
                    await app.syncInventory();
                    app.renderShop();
                }
            },

            // ============================================================
            // UI RENDERERS
            // ============================================================
            renderHeader: () => {
                const nav = document.getElementById('nav-actions-area');
                const whatsappBtn = document.getElementById('whatsapp-float');
                
                if (!APP_STATE.user) {
                    nav.innerHTML = `<button onclick="app.showAuth('login')" class="btn btn-primary"><i class="fa-solid fa-user"></i> Customer Login</button>`;
                    if (whatsappBtn) whatsappBtn.classList.remove('show');
                } else {
                    const isAdmin = APP_STATE.user.role === 'author';
                    nav.innerHTML = `
                        ${isAdmin ? `<button onclick="app.renderAdminPortal()" class="btn btn-secondary"><i class="fa-solid fa-dashboard"></i> Admin Panel</button>` : ''}
                        <button onclick="app.renderProfile()" class="btn btn-secondary" title="My Orders"><i class="fa-solid fa-user-circle"></i></button>
                        <button onclick="app.toggleCart()" class="btn btn-primary">
                            <i class="fa-solid fa-shopping-cart"></i>
                            <span style="background:white; color: var(--primary); padding:2px 8px; border-radius:50%; font-size:0.8rem; font-weight: 700;">${APP_STATE.cart.length}</span>
                        </button>
                        <button onclick="app.executeLogout()" class="btn btn-danger" style="padding: 10px 15px;"><i class="fa-solid fa-sign-out-alt"></i></button>
                    `;
                    if (whatsappBtn) whatsappBtn.classList.add('show');
                }
            },

            renderShop: () => {
                const root = document.getElementById('app-root-view');
                
                console.log('🏪 Rendering shop...');
                console.log(`📦 Inventory count: ${APP_STATE.inventory.length}`);
                
                // Group products by category
                const productsByCategory = {};
                Object.keys(CATEGORIES).forEach(key => {
                    productsByCategory[key] = APP_STATE.inventory.filter(p => p.category === key);
                    console.log(`Category ${key}: ${productsByCategory[key].length} products`);
                });

                let categorySections = Object.keys(CATEGORIES).map(catKey => {
                    const cat = CATEGORIES[catKey];
                    const products = productsByCategory[catKey] || [];
                    
                    if (products.length === 0) return '';

                    const productCards = products.map(p => {
                        const isSoldOut = p.stock <= 0;
                        return `
                            <div class="card ${isSoldOut ? 'out-of-stock' : ''}">
                                ${isSoldOut ? '<div class="stock-label">OUT OF STOCK</div>' : ''}
                                <div class="card-img-box" onclick="app.viewProductDetails('${p._id}')">
                                    <img src="${p.image}" alt="${p.name}">
                                </div>
                                <div class="card-info">
                                    <div class="tag">${cat.name}</div>
                                    <h3 class="card-title">${p.name}</h3>
                                    <div class="price-tag">₹${p.price.toLocaleString('en-IN')}</div>
                                    <p style="font-size: 0.85rem; color: var(--text-muted); margin: 8px 0;">Stock: ${p.stock} units</p>
                                    ${!isSoldOut 
                                        ? `<button class="btn btn-primary" style="width:100%; margin-top: 10px;" onclick="app.viewProductDetails('${p._id}')">View Details</button>`
                                        : `<button class="btn btn-secondary" style="width:100%; margin-top: 10px;" disabled>Out of Stock</button>`
                                    }
                                </div>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="category-section slide-up" id="${catKey}-section">
                            <div class="category-banner">
                                <div class="category-banner-text">
                                    <h3><i class="fa-solid ${cat.icon}"></i> ${cat.name}</h3>
                                    <div class="installation-badge">
                                        <i class="fa-solid ${catKey === 'ACCESSORIES' ? 'fa-truck-fast' : 'fa-tools'}"></i> 
                                        ${cat.badge}
                                    </div>
                                </div>
                                <i class="fa-solid ${cat.icon} category-banner-icon float"></i>
                            </div>
                            <div class="grid">
                                ${productCards}
                            </div>
                        </div>
                    `;
                }).join('');

                root.innerHTML = `
                    <div class="fade-in">
                        <section class="hero">
                            <div class="hero-content">
                                <div class="badge badge-primary" style="font-size: 0.9rem; padding: 8px 16px; margin-bottom: 20px;">
                                    <i class="fa-solid fa-shield-halved"></i> Trusted Security Solutions
                                </div>
                                <h1>Premium CCTV & <span style="background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Surveillance Systems</span></h1>
                                <p class="subtitle">
                                    Complete security solutions with professional installation and 24/7 support
                                </p>
                                <div style="display:flex; gap:15px; justify-content:center; flex-wrap: wrap;">
                                    <button onclick="app.scrollToProducts()" class="btn btn-primary" style="font-size: 1.1rem; padding: 16px 32px;">
                                        <i class="fa-solid fa-video"></i> Browse Cameras
                                    </button>
                                    <button onclick="app.renderRaiseRequest()" class="btn btn-secondary" style="font-size: 1.1rem; padding: 16px 32px;">
                                        <i class="fa-solid fa-headset"></i> Get Support
                                    </button>
                                </div>
                            </div>
                        </section>

                        ${categorySections}

                        <footer>
                            <div class="footer-content">
                                <div style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; margin-bottom: 20px;">BNG Surveillance</div>
                                <p style="max-width: 600px; margin: 0 auto 30px; opacity: 0.8;">
                                    Your trusted partner for complete CCTV and surveillance solutions. Professional installation and 24/7 customer support.
                                </p>
                                <div class="social-links">
                                    <a href="https://www.instagram.com/bng_surveillance/?hl=en" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                                    <a href="https://www.facebook.com/profile.php?id=61585589131328" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                                    <a href="mailto:bngsurveillance@gmail.com"><i class="fa-solid fa-envelope"></i></a>
                                </div>
                                <p style="opacity: 0.6; font-size: 0.9rem; margin-top: 30px;">
                                    © 2024 BNG Surveillance Systems. All Rights Reserved.
                                </p>
                                <p style="font-size: 0.85rem; margin-top: 10px;">
                                    Developed by <a href="https://farhanzahoor.info" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 600;">Farhan Zahoor</a>
                                </p>
                            </div>
                        </footer>
                    </div>
                `;
                
                console.log('✅ Shop rendered successfully');
            },

            viewProductDetails: (id) => {
                const p = APP_STATE.inventory.find(x => x._id === id);
                if(!p) return;

                const category = CATEGORIES[p.category] || { badge: '', name: p.category };
                const hasReviews = p.reviews && p.reviews.length > 0;

                const html = `
                    <div class="fade-in">
                        <img src="${p.image}" style="width:100%; height:300px; object-fit:contain; background: var(--bg-light); border-radius: var(--radius-lg); margin-bottom: 25px; padding: 20px;">
                        
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap: wrap; gap: 15px;">
                            <div>
                                <div class="tag">${category.name}</div>
                                <h2 style="font-size: 1.8rem; font-family: var(--font-display); font-weight: 700; color: var(--text-dark);">${p.name}</h2>
                            </div>
                            <div class="price-tag" style="font-size: 2rem; margin:0;">₹${p.price.toLocaleString('en-IN')}</div>
                        </div>

                        ${category.badge ? `
                            <div class="badge badge-success" style="margin: 15px 0; font-size: 0.85rem; padding: 8px 16px;">
                                <i class="fa-solid ${p.category === 'ACCESSORIES' ? 'fa-truck-fast' : 'fa-tools'}"></i> ${category.badge}
                            </div>
                        ` : ''}

                        <p style="color: var(--text-main); margin: 20px 0; line-height: 1.8; font-size: 1rem; padding: 20px; background: var(--bg-light); border-radius: var(--radius-md); border-left: 4px solid var(--primary);">
                            ${p.desc}
                        </p>

                        <div style="background: var(--bg-light); padding: 20px; border-radius: var(--radius-md); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                            <div>
                                <span class="label" style="margin: 0; display: block; font-size: 0.85rem;">Available Stock</span>
                                <span style="font-weight: 800; font-size: 1.2rem; color: ${p.stock < 5 ? 'var(--danger)' : 'var(--success)'}">
                                    ${p.stock} Units
                                </span>
                            </div>
                            ${APP_STATE.user ? `
                                <div style="width: 120px;">
                                    <span class="label" style="margin: 0 0 5px 0; display: block; font-size: 0.85rem;">Quantity</span>
                                    <input type="number" id="purchase-qty-input" value="1" min="1" max="${p.stock}" style="padding: 10px; text-align:center;">
                                </div>
                            ` : ''}
                        </div>

                        ${APP_STATE.user ? `
                            <button onclick="app.executeAddToCart('${p._id}')" class="btn btn-primary" style="width:100%; padding: 18px; font-size: 1.1rem;">
                                <i class="fa-solid fa-cart-plus"></i> Add to Cart
                            </button>
                        ` : `
                            <button onclick="app.closeModal(); app.showAuth('login');" class="btn btn-primary" style="width:100%; padding: 18px; font-size: 1.1rem;">
                                <i class="fa-solid fa-sign-in-alt"></i> Login to Purchase
                            </button>
                            <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-top: 10px;">
                                Please login to add items to your cart
                            </p>
                        `}

                        <div style="margin-top: 40px; padding-top: 30px; border-top: 2px solid var(--border);">
                            <h4 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 20px; color: var(--text-dark);">
                                <i class="fa-solid fa-star"></i> Customer Reviews
                            </h4>
                            
                            <div id="review-list" style="max-height: 250px; overflow-y: auto; margin-bottom: 25px;">
                                ${!hasReviews ? '<p style="color: var(--text-muted); text-align:center; padding: 30px;">No reviews yet. Be the first to review!</p>' : 
                                    p.reviews.map(r => `
                                        <div style="background: var(--bg-light); padding: 18px; border-radius: var(--radius-md); margin-bottom: 12px; border-left: 3px solid var(--primary);">
                                            <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
                                                <strong style="color: var(--primary); font-weight: 700;">${r.user}</strong>
                                                <small style="color: var(--text-muted); font-size:0.8rem;">${new Date(r.date).toLocaleDateString()}</small>
                                            </div>
                                            <div style="color: var(--text-main);">${r.comment}</div>
                                        </div>
                                    `).join('')
                                }
                            </div>

                            ${APP_STATE.user ? `
                                <div style="display: flex; gap: 10px;">
                                    <input type="text" id="review-comment-field" placeholder="Write your review..." style="flex: 1;">
                                    <button onclick="app.postReview('${p._id}')" class="btn btn-primary" style="padding: 0 24px;">
                                        <i class="fa-solid fa-paper-plane"></i>
                                    </button>
                                </div>
                            ` : '<p style="font-size: 0.9rem; color: var(--text-muted); text-align: center; padding: 15px; background: var(--bg-light); border-radius: var(--radius-md);">Please login to write a review</p>'}
                        </div>
                    </div>
                `;

                app.openModal(html);
            },

            executeAddToCart: (id) => {
                if(!APP_STATE.user) {
                    app.showToast("Please login to add items to cart");
                    app.closeModal();
                    app.showAuth('login');
                    return;
                }

                const product = APP_STATE.inventory.find(x => x._id === id);
                const qtyRequested = parseInt(document.getElementById('purchase-qty-input')?.value) || 1;

                if(qtyRequested > product.stock) {
                    app.showToast("Requested quantity exceeds available stock");
                    return;
                }

                const existingIndex = APP_STATE.cart.findIndex(item => item._id === id);
                
                if(existingIndex !== -1) {
                    const newTotalQty = APP_STATE.cart[existingIndex].qty + qtyRequested;
                    if(newTotalQty > product.stock) {
                        app.showToast("Cannot add more items - stock limit reached");
                        return;
                    }
                    APP_STATE.cart[existingIndex].qty = newTotalQty;
                } else {
                    APP_STATE.cart.push({ ...product, qty: qtyRequested });
                }

                app.showToast(`${product.name} added to cart!`);
                app.closeModal();
                app.renderHeader();
            },

            toggleCart: () => {
                const panel = document.getElementById('cart-panel');
                if(panel.classList.contains('open')) {
                    panel.classList.remove('open');
                } else {
                    app.renderCartContents();
                    panel.classList.add('open');
                }
            },

            renderCartContents: () => {
                const container = document.getElementById('cart-items-container');
                const totalDisplay = document.getElementById('cart-total-display');
                
                if(APP_STATE.cart.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; color: var(--text-muted); margin-top: 100px;">
                            <i class="fa-solid fa-shopping-basket" style="font-size: 4rem; opacity: 0.3; margin-bottom: 20px;"></i>
                            <p>Your cart is empty</p>
                            <p style="font-size: 0.9rem; margin-top: 10px;">Add some products to get started!</p>
                        </div>
                    `;
                    totalDisplay.innerText = "₹0";
                    return;
                }

                let total = 0;
                let html = APP_STATE.cart.map((item, idx) => {
                    const rowTotal = item.price * item.qty;
                    total += rowTotal;
                    return `
                        <div style="background: var(--bg-light); border: 2px solid var(--border); padding: 18px; border-radius: var(--radius-md); margin-bottom: 15px;" class="slide-up">
                            <div style="display:flex; gap: 15px; align-items:center;">
                                <img src="${item.image}" style="width: 60px; height: 60px; object-fit: contain; background: white; border-radius: var(--radius-sm); padding: 5px;">
                                <div style="flex: 1;">
                                    <h4 style="font-weight: 600; font-size: 0.95rem; color: var(--text-dark); margin-bottom: 4px;">${item.name}</h4>
                                    <div style="font-size: 0.85rem; color: var(--text-muted);">
                                        ₹${item.price.toLocaleString()} × ${item.qty}
                                    </div>
                                    <div style="color: var(--primary); font-weight: 700; margin-top: 4px;">₹${rowTotal.toLocaleString()}</div>
                                </div>
                                <button onclick="app.removeCartItem(${idx})" style="background:none; border:none; color: var(--danger); cursor:pointer; font-size: 1.3rem; padding: 8px;">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = html;
                totalDisplay.innerText = "₹" + total.toLocaleString('en-IN');
            },

            removeCartItem: (idx) => {
                APP_STATE.cart.splice(idx, 1);
                app.renderCartContents();
                app.renderHeader();
                app.showToast("Item removed from cart");
            },

            // CHECKOUT
            checkout: () => {
                if(APP_STATE.cart.length === 0) {
                    app.showToast("Your cart is empty!");
                    return;
                }
                app.toggleCart();

                const finalTotal = APP_STATE.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

                const html = `
                    <div class="fade-in">
                        <h2 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 25px; color: var(--text-dark);">
                            <i class="fa-solid fa-shopping-bag"></i> Checkout
                        </h2>
                        
                        <div class="form-group">
                            <label class="label">Full Name</label>
                            <input type="text" value="${APP_STATE.user.name}" readonly style="background: var(--bg-light); cursor: not-allowed;">
                        </div>

                        <div class="form-group">
                            <label class="label">Phone Number</label>
                            <input type="tel" id="checkout-phone" placeholder="Enter your phone number" required>
                        </div>

                        <div class="form-group">
                            <label class="label">Delivery Address</label>
                            <textarea id="checkout-address" placeholder="Enter complete address with landmarks" rows="3" required></textarea>
                        </div>

                        <div class="form-group">
                            <label class="label">Pincode</label>
                            <input type="text" id="checkout-pincode" placeholder="6-digit pincode" maxlength="6" required>
                        </div>

                        <div class="form-group">
                            <label class="label">
                                <i class="fa-solid fa-location-dot"></i> Share Your Location (Optional)
                            </label>
                            <button onclick="app.getLocation()" id="location-btn" class="btn btn-secondary" style="width: 100%;">
                                <i class="fa-solid fa-map-marker-alt"></i> Get My Current Location
                            </button>
                            <div id="location-display" style="margin-top: 10px; font-size: 0.85rem; color: var(--success); display: none;">
                                <i class="fa-solid fa-check-circle"></i> Location captured successfully
                            </div>
                        </div>

                        <div style="background: linear-gradient(135deg, var(--primary-light) 0%, rgba(14, 165, 233, 0.1) 100%); padding: 25px; border-radius: var(--radius-lg); margin: 25px 0; text-align: center; border: 2px solid var(--primary);">
                            <div style="font-weight: 600; color: var(--text-muted); margin-bottom: 5px;">Total Amount</div>
                            <div style="font-size: 2.5rem; font-weight: 800; font-family: var(--font-display); color: var(--primary);">₹${finalTotal.toLocaleString('en-IN')}</div>
                        </div>

                        <button onclick="app.initiatePayment(${finalTotal})" class="btn btn-primary" style="width: 100%; padding: 18px; font-size: 1.1rem;">
                            <i class="fa-solid fa-lock"></i> Proceed to Payment
                        </button>

                        <p style="text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 15px;">
                            <i class="fa-solid fa-shield-halved"></i> Your payment is 100% secure
                        </p>
                    </div>
                `;
                app.openModal(html);
            },

            getLocation: () => {
                const btn = document.getElementById('location-btn');
                const display = document.getElementById('location-display');
                
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Getting location...';
                btn.disabled = true;

                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            APP_STATE.userLocation = {
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                accuracy: position.coords.accuracy
                            };
                            btn.innerHTML = '<i class="fa-solid fa-check"></i> Location Captured';
                            btn.classList.remove('btn-secondary');
                            btn.classList.add('btn-success');
                            display.style.display = 'block';
                            app.showToast("Location captured successfully!");
                        },
                        (error) => {
                            btn.innerHTML = '<i class="fa-solid fa-map-marker-alt"></i> Get My Current Location';
                            btn.disabled = false;
                            app.showToast("Unable to get location. Please enter manually.");
                        }
                    );
                } else {
                    btn.innerHTML = '<i class="fa-solid fa-map-marker-alt"></i> Get My Current Location';
                    btn.disabled = false;
                    app.showToast("Geolocation not supported by your browser");

            initiatePayment: async (amount) => {
                const phone = document.getElementById('checkout-phone').value;
                const address = document.getElementById('checkout-address').value;
                const pincode = document.getElementById('checkout-pincode').value;

                if(!phone || !address || !pincode) {
                    app.showToast("Please fill all required fields");
                    return;
                }

                if(!/^[0-9]{10}$/.test(phone.replace(/\D/g, ''))) {
                    app.showToast("Please enter a valid 10-digit phone number");
                    return;
                }

                if(!/^[0-9]{6}$/.test(pincode)) {
                    app.showToast("Please enter a valid 6-digit pincode");
                    return;
                }

                try {
                    app.showToast("Connecting to payment gateway...");
                    
                    const response = await fetch(`${COMMAND_CONFIG.API_BASE}/create-order`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ amount })
                    });
                    
                    const orderData = await response.json();

                    const options = {
                        "key": COMMAND_CONFIG.RAZORPAY_ID,
                        "amount": orderData.amount,
                        "currency": "INR",
                        "name": "BNG Surveillance",
                        "description": "CCTV & Security Equipment",
                        "order_id": orderData.id,
                        "handler": (resp) => app.verifyPaymentResponse(resp, amount, phone, address, pincode),
                        "theme": { "color": "#0ea5e9" },
                        "prefill": {
                            "name": APP_STATE.user.name,
                            "email": APP_STATE.user.email,
                            "contact": phone
                        }
                    };

                    const rzp = new Razorpay(options);
                    rzp.open();
                    app.closeModal();

                } catch(e) {
                    app.showToast("Payment gateway error. Please try again.");
                }
            },

            verifyPaymentResponse: async (response, total, phone, address, pincode) => {
                try {
                    app.showToast("Verifying payment...");
                    
                    const payload = {
                        orderCreationId: response.razorpay_order_id,
                        razorpayPaymentId: response.razorpay_payment_id,
                        razorpaySignature: response.razorpay_signature,
                        customerDetails: {
                            name: APP_STATE.user.name,
                            email: APP_STATE.user.email,
                            phone,
                            address,
                            pincode,
                            items: APP_STATE.cart,
                            total,
                            location: APP_STATE.userLocation
                        }
                    };

                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/verify-payment`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });

                    if(res.ok) {
                        APP_STATE.cart = [];
                        APP_STATE.userLocation = null;
                        app.showToast("Payment successful!");
                        app.renderOrderSuccess(response.razorpay_order_id, total);
                        app.syncInventory();
                        app.renderHeader();
                    } else {
                        app.showToast("Payment verification failed");
                    }
                } catch(e) {
                    app.showToast("Server error. Please contact support.");
                }
            },

                            APP_STATE.userLocation = {

                                longitude: position.coords.longitude,
                                accuracy: position.coords.accuracy
                            };
                            btn.innerHTML = '<i class="fa-solid fa-check"></i> Location Captured';

                            btn.classList.add('btn-success');
