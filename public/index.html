<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNG Surveillance | Secure Systems</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --bg-deep: #020202;
            --bg-panel: #0a0a0a;
            --bg-glass: rgba(10, 10, 10, 0.85);
            --primary: #f59e0b; /* Amber Gold */
            --primary-dim: rgba(245, 158, 11, 0.1);
            --primary-glow: rgba(245, 158, 11, 0.5);
            --accent: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.08);
            --font-main: 'Outfit', sans-serif;
            --font-tech: 'Space Grotesk', monospace;
        }

        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; /* Grid Pattern */
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        ::selection { background: var(--primary); color: #000; }

        /* --- ANIMATIONS --- */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scan { 0% { top: -100%; } 100% { top: 200%; } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0.5; } }

        .animate-enter { animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        /* --- TYPOGRAPHY --- */
        h1, h2, h3, h4 { font-family: var(--font-tech); text-transform: uppercase; letter-spacing: -0.5px; }
        .text-gradient {
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- UI COMPONENTS --- */
        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            font-family: var(--font-tech);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary-dim);
        }
        .btn-primary:hover {
            background: #fff;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-dim);
        }

        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-whatsapp { background: #25D366; color: #000; border: none; }

        /* --- INPUTS --- */
        input, textarea, select {
            width: 100%;
            background: #151515;
            border: 1px solid var(--border);
            padding: 15px;
            color: #fff;
            border-radius: 8px;
            font-family: var(--font-main);
            transition: 0.3s;
            margin-bottom: 15px;
        }
        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-dim);
        }

        /* --- NAVBAR --- */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        
        .logo { font-size: 1.5rem; font-family: var(--font-tech); font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--primary); animation: pulse 2s infinite; }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: 2rem 5%;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=1920&auto=format&fit=crop') center/cover;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(0deg, var(--bg-deep) 0%, rgba(0,0,0,0.6) 100%);
        }
        .hero-content { position: relative; z-index: 2; max-width: 800px; padding: 20px; }

        /* --- PRODUCT GRID --- */
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem 5%; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.4s ease;
            position: relative;
        }
        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 20px 50px -20px rgba(0,0,0,0.7);
        }
        .card-img-box {
            height: 250px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .card-img-box::after {
            content: ''; position: absolute; top: -100%; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, transparent, var(--primary-dim), transparent);
            animation: scan 3s infinite linear;
        }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; transition: 0.4s; }
        .card:hover img { transform: scale(1.1); }
        
        .card-info { padding: 1.5rem; }
        .tag { font-size: 0.7rem; color: var(--primary); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .price { font-size: 1.5rem; font-family: var(--font-tech); font-weight: 700; margin-top: 5px; }

        /* --- MODALS & SLIDE OVERS --- */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; pointer-events: none;
            transition: 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: all; }

        .modal {
            background: #111;
            width: 90%; max-width: 500px;
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            transform: translateY(50px); transition: 0.4s;
            max-height: 90vh; overflow-y: auto;
        }
        .overlay.active .modal { transform: translateY(0); }

        /* Cart Slide-Over */
        .cart-panel {
            position: fixed; top: 0; right: -450px;
            width: 400px; height: 100vh;
            background: #0e0e0e;
            border-left: 1px solid var(--primary);
            z-index: 1100;
            padding: 2rem;
            transition: 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex; flex-direction: column;
            box-shadow: -20px 0 50px rgba(0,0,0,0.8);
        }
        .cart-panel.open { right: 0; }

        /* --- ADMIN DASHBOARD --- */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-box { background: linear-gradient(145deg, #151515, #0a0a0a); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .data-table th { text-align: left; padding: 1rem; color: var(--text-muted); font-size: 0.8rem; border-bottom: 1px solid var(--border); }
        .data-table td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

        /* --- UTILS --- */
        .toast {
            position: fixed; bottom: 30px; right: 30px;
            background: #111; border-left: 4px solid var(--primary);
            padding: 1rem 2rem; border-radius: 8px;
            color: #fff; transform: translateY(100px); transition: 0.3s;
            z-index: 2000; font-family: var(--font-tech);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.show { transform: translateY(0); }

        /* LOADING */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.5s;
        }
        .spinner { width: 50px; height: 50px; border: 3px solid #333; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .cart-panel { width: 100%; right: -100%; }
            .hero-content h1 { font-size: 2.5rem; }
            nav { padding: 1rem; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="margin-top: 20px; font-family: var(--font-tech); letter-spacing: 3px; color: var(--primary);">INITIALIZING SYSTEM...</div>
    </div>

    <div id="toast" class="toast">Action Successful</div>

    <div id="cart-panel" class="cart-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2><i class="fa-solid fa-server"></i> Cart</h2>
            <button onclick="app.toggleCart()" class="btn btn-secondary" style="padding: 8px 12px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cart-items" style="flex: 1; overflow-y: auto;">
            <div style="text-align: center; color: var(--text-muted); margin-top: 50px;">Cart is empty</div>
        </div>
        <div style="border-top: 1px solid var(--border); padding-top: 1.5rem;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 1.2rem; font-weight: 700;">
                <span>TOTAL</span>
                <span id="cart-total" class="text-gradient">₹0</span>
            </div>
            <button onclick="app.checkout()" class="btn btn-primary" style="width: 100%;">Initialize Checkout</button>
        </div>
    </div>

    <nav>
        <div class="logo">
            <i class="fa-solid fa-video"></i> BNG <span style="color:var(--text-main)">SURVEILLANCE</span>
        </div>
        <div id="nav-actions">
        </div>
    </nav>

    <main id="app-root">
    </main>

    <div id="modal-overlay" class="overlay">
        <div id="modal-body" class="modal">
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            API_URL: '/api', // Change to your backend URL if hosted elsewhere
            RAZORPAY_KEY: 'rzp_live_SDiqNk2jPMuXQQ', // ⚠️ REPLACE WITH REAL KEY
            ADMIN_PHONE: '916006750581'
        };

        // --- STATE MANAGEMENT ---
        const state = {
            user: JSON.parse(sessionStorage.getItem('user')) || null,
            cart: [],
            products: [],
            orders: [],
            tempEmail: null // Stores email during OTP verification
        };

        // --- APP ENGINE ---
        const app = {
            
            init: async () => {
                // Simulate boot sequence
                setTimeout(() => {
                    document.getElementById('loader').style.opacity = 0;
                    setTimeout(() => {
                        const loader = document.getElementById('loader');
                        if(loader) loader.remove();
                    }, 500);
                }, 1500);

                await app.fetchProducts(); // Initial data load
                app.renderNav();
                app.renderShop(); // Default View
            },

            // --- API HELPERS ---
            fetchProducts: async () => {
                try {
                    const res = await fetch(`${CONFIG.API_URL}/products`);
                    if(res.ok) state.products = await res.json();
                } catch(e) { console.error("API Error", e); }
            },

            // --- VIEW RENDERERS ---
            renderNav: () => {
                const container = document.getElementById('nav-actions');
                if (!state.user) {
                    container.innerHTML = `<button onclick="app.renderAuth('login')" class="btn btn-secondary">Login Terminal</button>`;
                } else {
                    const adminBtn = state.user.role === 'author' 
                        ? `<button onclick="app.renderAdmin()" class="btn btn-secondary"><i class="fa-solid fa-chart-line"></i> Admin</button>` 
                        : '';
                    
                    container.innerHTML = `
                        ${adminBtn}
                        <button onclick="app.renderProfile()" class="btn btn-secondary"><i class="fa-solid fa-user-astronaut"></i></button>
                        <button onclick="app.toggleCart()" class="btn btn-primary">
                            <i class="fa-solid fa-cart-shopping"></i> <span id="cart-count">${state.cart.length}</span>
                        </button>
                        <button onclick="app.logout()" class="btn btn-danger" style="padding: 8px 12px;"><i class="fa-solid fa-power-off"></i></button>
                    `;
                }
            },

            renderShop: () => {
                const root = document.getElementById('app-root');
                root.innerHTML = `
                    <div class="animate-enter">
                        <section class="hero">
                            <div class="hero-content">
                                <h1>Next Gen <span class="text-gradient">Security</span></h1>
                                <p style="color: #ccc; margin: 1.5rem 0; font-size: 1.1rem;">
                                    Professional grade surveillance equipment for mission-critical environments.
                                    24/7 Monitoring. Cloud Integrated. AI Powered.
                                </p>
                                <button onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})" class="btn btn-primary">
                                    Access Catalog
                                </button>
                            </div>
                        </section>

                        <div class="container" id="grid">
                            <h3 style="color:var(--primary); margin-bottom:10px;">Welcome, ${state.user ? state.user.name : 'Guest'}</h3>
                            
                            <div class="grid">
                                ${state.products.map(p => `
                                    <div class="card">
                                        <div class="card-img-box">
                                            <img src="${p.image}" alt="${p.name}">
                                        </div>
                                        <div class="card-info">
                                            <div class="tag">${p.category}</div>
                                            <h3 style="margin: 5px 0;">${p.name}</h3>
                                            <div class="price">₹${p.price.toLocaleString('en-IN')}</div>
                                            <button onclick="app.openProductModal('${p._id}')" class="btn btn-secondary" style="width:100%; margin-top:1rem;">
                                                System Details
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <footer style="text-align:center; padding: 4rem; margin-top:4rem; border-top:1px solid var(--border); color:var(--text-muted);">
                            <p style="margin-bottom:1rem;">BNG SURVEILLANCE SYSTEMS © 2024</p>
                            <p style="font-size:0.9rem;">Secured by <span style="color:var(--primary)">Farhan Zahoor</span></p>
                        </footer>
                    </div>
                `;
            },

            renderAuth: (mode = 'login') => {
                const root = document.getElementById('app-root');
                
                let title = 'Terminal Login';
                let content = '';

                if (mode === 'login') {
                    content = `
                        <form onsubmit="app.handleLogin(event)">
                            <input type="email" name="email" placeholder="Secure Email" required>
                            <input type="password" name="password" placeholder="Passcode" required>
                            <button type="submit" class="btn btn-primary" style="width:100%">Access System</button>
                        </form>
                        <p style="text-align:center; margin-top:1.5rem; color:var(--text-muted);">
                            Need clearance? <a href="#" onclick="app.renderAuth('register')" style="color:var(--primary)">Register</a>
                        </p>
                    `;
                } else if (mode === 'register') {
                    title = 'New Agent Registration';
                    content = `
                        <form onsubmit="app.handleRegister(event)">
                            <input type="text" name="name" placeholder="Agent Name" required>
                            <input type="email" name="email" placeholder="Secure Email" required>
                            <input type="password" name="password" placeholder="Passcode" required>
                            <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
                        </form>
                        <p style="text-align:center; margin-top:1.5rem; color:var(--text-muted);">
                            Already have ID? <a href="#" onclick="app.renderAuth('login')" style="color:var(--primary)">Login</a>
                        </p>
                    `;
                } else if (mode === 'verify') {
                    title = 'Security Verification';
                    content = `
                        <p style="text-align:center; color:#ccc; margin-bottom:1.5rem;">
                            Enter the 6-digit code sent to <br><strong style="color:var(--primary)">${state.tempEmail}</strong>
                        </p>
                        <form onsubmit="app.handleVerifyOTP(event)">
                            <input type="text" name="otp" placeholder="000000" maxlength="6" style="text-align:center; letter-spacing:5px; font-size:1.5rem;" required>
                            <button type="submit" class="btn btn-primary" style="width:100%">Verify Identity</button>
                        </form>
                        <button onclick="app.renderAuth('register')" class="btn btn-secondary" style="width:100%; margin-top:10px;">Back</button>
                    `;
                }

                root.innerHTML = `
                    <div class="container animate-enter" style="min-height: 80vh; display:flex; align-items:center; justify-content:center;">
                        <div style="background:var(--bg-panel); padding:3rem; border-radius:20px; border:1px solid var(--border); width:100%; max-width:450px;">
                            <h2 style="text-align:center; margin-bottom:2rem;">${title}</h2>
                            ${content}
                        </div>
                    </div>
                `;
            },

            renderAdmin: async () => {
                if(!state.user || state.user.role !== 'author') return app.renderShop();
                
                try {
                    const [oRes, pRes] = await Promise.all([
                        fetch(`${CONFIG.API_URL}/orders`),
                        fetch(`${CONFIG.API_URL}/products`)
                    ]);
                    state.orders = await oRes.json();
                    state.products = await pRes.json();
                } catch(e) { console.log("Admin fetch error"); }

                const totalRevenue = state.orders.reduce((acc, o) => acc + (o.total||0), 0);

                const root = document.getElementById('app-root');
                root.innerHTML = `
                    <div class="container animate-enter">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
                            <h1>Command Center</h1>
                            <button onclick="app.openAddProductModal()" class="btn btn-primary">+ Add Unit</button>
                        </div>

                        <div class="stat-grid">
                            <div class="stat-box">
                                <div style="color:var(--text-muted); font-size:0.9rem;">TOTAL REVENUE</div>
                                <div class="text-gradient" style="font-size:2.5rem; font-family:var(--font-tech); font-weight:700;">₹${totalRevenue.toLocaleString('en-IN')}</div>
                            </div>
                            <div class="stat-box">
                                <div style="color:var(--text-muted); font-size:0.9rem;">TOTAL ORDERS</div>
                                <div style="font-size:2.5rem; font-family:var(--font-tech); font-weight:700;">${state.orders.length}</div>
                            </div>
                        </div>

                        <div class="stat-box">
                            <h3>Live Order Feed</h3>
                            <div style="overflow-x:auto">
                                <table class="data-table">
                                    <thead><tr><th>Date</th><th>Client</th><th>Contact</th><th>Items</th><th>Status</th><th>Amount</th><th>Action</th></tr></thead>
                                    <tbody>
                                        ${state.orders.map(o => `
                                            <tr>
                                                <td>${new Date(o.date).toLocaleDateString()}</td>
                                                <td>${o.customer}</td>
                                                <td>${o.phone}</td>
                                                <td>${o.items.length} Units</td>
                                                <td>
                                                    ${o.status === 'Delivered' 
                                                    ? '<span style="color:var(--success)">DELIVERED</span>' 
                                                    : '<span style="color:var(--primary)">PENDING</span>'}
                                                </td>
                                                <td style="color:var(--primary); font-weight:bold;">₹${o.total}</td>
                                                <td>
                                                    ${o.status === 'Delivered' 
                                                    ? '<i class="fa-solid fa-check"></i>' 
                                                    : `<button onclick="app.markDelivered('${o._id}')" class="btn btn-secondary" style="padding:5px">Mark Delivered</button>`
                                                    }
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            },

            markDelivered: async (id) => {
                try {
                    await fetch(`${CONFIG.API_URL}/orders/${id}/deliver`, { method: 'PATCH' });
                    app.showToast("Status Updated");
                    app.renderAdmin();
                } catch(e) {
                    app.showToast("Update Failed");
                }
            },

            renderProfile: async () => {
                const root = document.getElementById('app-root');
                let myOrders = [];
                try {
                    const res = await fetch(`${CONFIG.API_URL}/my-orders?email=${state.user.email}`);
                    if(res.ok) myOrders = await res.json();
                } catch(e){}

                root.innerHTML = `
                    <div class="container animate-enter" style="max-width:800px;">
                        <h1 style="margin-bottom:2rem;">Agent Profile: ${state.user.name}</h1>
                        <div class="stat-box">
                            <h3 style="margin-bottom:1rem; color:var(--primary);">Order History</h3>
                            ${myOrders.length === 0 ? '<p>No acquisitions recorded.</p>' : 
                                myOrders.map(o => `
                                    <div style="border-bottom:1px solid var(--border); padding:1rem 0;">
                                        <div style="display:flex; justify-content:space-between;">
                                            <strong>#${o._id.substr(-6)}</strong>
                                            <span>${new Date(o.date).toLocaleDateString()}</span>
                                        </div>
                                        <div style="color:var(--text-muted); font-size:0.9rem; margin:5px 0;">
                                            ${o.items.map(i => i.name).join(', ')}
                                        </div>
                                        <div style="text-align:right; font-weight:bold;">₹${o.total}</div>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                `;
            },

            // --- ACTIONS ---
            handleLogin: async (e) => {
                e.preventDefault();
                const formData = Object.fromEntries(new FormData(e.target));
                try {
                    const res = await fetch(`${CONFIG.API_URL}/login`, {
                        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(formData)
                    });
                    const data = await res.json();
                    if(res.ok) {
                        state.user = data;
                        sessionStorage.setItem('user', JSON.stringify(data));
                        app.showToast(`Welcome, Agent ${data.name}`);
                        app.init();
                    } else {
                        app.showToast("Access Denied: " + data.error);
                    }
                } catch(err) { app.showToast("Connection Failed"); }
            },

            handleRegister: async (e) => {
                e.preventDefault();
                const formData = Object.fromEntries(new FormData(e.target));
                state.tempEmail = formData.email; 

                try {
                    const res = await fetch(`${CONFIG.API_URL}/register`, {
                        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(formData)
                    });
                    
                    if(res.ok) {
                        app.showToast("OTP Sent to Email");
                        app.renderAuth('verify');
                    } else {
                        const data = await res.json();
                        app.showToast(data.error || "Registration Error");
                    }
                } catch(err) { app.showToast("Registration Error"); }
            },

            handleVerifyOTP: async (e) => {
                e.preventDefault();
                const otp = e.target.otp.value;
                
                try {
                    const res = await fetch(`${CONFIG.API_URL}/verify-otp`, {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({ email: state.tempEmail, otp: otp })
                    });

                    if(res.ok) {
                        app.showToast("Identity Verified. Please Login.");
                        app.renderAuth('login');
                    } else {
                        const data = await res.json();
                        app.showToast(data.error || "Invalid OTP");
                    }
                } catch(err) { app.showToast("Verification Error"); }
            },

            logout: () => {
                sessionStorage.removeItem('user');
                state.user = null;
                state.cart = [];
                app.init();
                app.showToast("Logged Out");
            },

            // --- CART LOGIC ---
            toggleCart: () => {
                const panel = document.getElementById('cart-panel');
                if(panel.classList.contains('open')) {
                    panel.classList.remove('open');
                } else {
                    app.renderCartItems();
                    panel.classList.add('open');
                }
            },

            addToCart: (product) => {
                if(!state.user) {
                    app.showToast("Login required for purchase");
                    app.renderAuth();
                    app.closeModal();
                    return;
                }
                state.cart.push(product);
                document.getElementById('cart-count').innerText = state.cart.length;
                app.showToast(`${product.name} Added`);
                app.closeModal();
            },

            renderCartItems: () => {
                const container = document.getElementById('cart-items');
                if(state.cart.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:2rem; color:#666;"><i class="fa-solid fa-basket-shopping" style="font-size:2rem;"></i><br>Empty</div>`;
                    document.getElementById('cart-total').innerText = "₹0";
                    return;
                }
                
                let total = 0;
                container.innerHTML = state.cart.map((item, index) => {
                    total += item.price;
                    return `
                        <div style="background:#1a1a1a; padding:10px; border-radius:8px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <div style="font-weight:600;">${item.name}</div>
                                <div style="font-size:0.8rem; color:var(--primary);">₹${item.price}</div>
                            </div>
                            <button onclick="app.removeFromCart(${index})" style="background:none; border:none; color:var(--danger); cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                }).join('');
                document.getElementById('cart-total').innerText = "₹" + total.toLocaleString('en-IN');
            },

            removeFromCart: (index) => {
                state.cart.splice(index, 1);
                document.getElementById('cart-count').innerText = state.cart.length;
                app.renderCartItems();
            },

            // --- CHECKOUT & PAYMENT ---
            checkout: () => {
                if(state.cart.length === 0) return;
                app.toggleCart(); // close side panel
                
                const total = state.cart.reduce((a,b)=>a+b.price, 0);
                
                const html = `
                    <h2 style="margin-bottom:1.5rem;">Secure Checkout</h2>
                    <form id="checkout-form">
                        <input type="text" value="${state.user.name}" readonly style="opacity:0.6">
                        <input type="tel" id="c-phone" placeholder="Mobile Number" required>
                        <textarea id="c-address" placeholder="Delivery Address" rows="3" required></textarea>
                        <input type="text" id="c-pincode" placeholder="6-Digit Pincode" maxlength="6" required>
                        <div style="margin: 1rem 0; font-weight:bold; font-size:1.2rem;">
                            Amount: <span style="color:var(--primary)">₹${total.toLocaleString('en-IN')}</span>
                        </div>
                        <button type="button" onclick="app.processPayment(${total})" class="btn btn-primary" style="width:100%">Pay via Razorpay</button>
                    </form>
                `;
                app.openModalContent(html);
            },

            processPayment: async (amount) => {
                const phone = document.getElementById('c-phone').value;
                const address = document.getElementById('c-address').value;
                const pincode = document.getElementById('c-pincode').value;
                
                if(!phone || !address) return app.showToast("Details Missing");

                try {
                    // Create Order on Backend
                    const res = await fetch(`${CONFIG.API_URL}/create-order`, {
                        method: 'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ amount })
                    });
                    const orderData = await res.json();

                    // Init Razorpay
                    const options = {
                        "key": CONFIG.RAZORPAY_KEY,
                        "amount": orderData.amount,
                        "currency": "INR",
                        "name": "BNG Security",
                        "order_id": orderData.id,
                        "handler": function (response){
                            app.verifyPayment(response, amount, phone, address);
                        },
                        "theme": { "color": "#f59e0b" }
                    };
                    const rzp = new Razorpay(options);
                    rzp.open();
                    app.closeModal();

                } catch(e) { app.showToast("Payment Initialization Failed"); }
            },

            verifyPayment: async (response, amount, phone, address) => {
                try {
                    const items = [...state.cart];
                    const res = await fetch(`${CONFIG.API_URL}/verify-payment`, {
                        method: 'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({
                            orderCreationId: response.razorpay_order_id,
                            razorpayPaymentId: response.razorpay_payment_id,
                            razorpaySignature: response.razorpay_signature,
                            customerDetails: {
                                name: state.user.name, email: state.user.email,
                                phone, address, items, total: amount
                            }
                        })
                    });
                    
                    if(res.ok) {
                        state.cart = []; // clear cart
                        document.getElementById('cart-count').innerText = 0;
                        app.renderSuccess(response.razorpay_order_id, amount, items);
                    }
                } catch(e) { app.showToast("Verification Error"); }
            },

            renderSuccess: (orderId, total, items) => {
                const itemList = items.map(i => `%E2%80%A2 ${i.name} (Rs.${i.price})`).join('%0A');
                const waText = `*NEW ORDER ALERT*%0A------------------%0AID: ${orderId}%0ACustomer: ${state.user.name}%0ATotal: Rs.${total}%0A------------------%0AItems:%0A${itemList}`;
                
                const html = `
                    <div style="text-align:center; padding:1rem;">
                        <i class="fa-solid fa-circle-check" style="font-size:4rem; color:var(--success); margin-bottom:1rem;"></i>
                        <h2>Order Confirmed</h2>
                        <p style="color:#aaa; margin-bottom:2rem;">ID: #${orderId}</p>
                        <a href="https://wa.me/${CONFIG.ADMIN_PHONE}?text=${waText}" target="_blank" class="btn btn-whatsapp" style="width:100%; text-decoration:none;">
                            <i class="fa-brands fa-whatsapp"></i> Notify Admin
                        </a>
                        <button onclick="app.closeModal()" class="btn btn-secondary" style="width:100%; margin-top:10px;">Close</button>
                    </div>
                `;
                app.openModalContent(html);
            },

            // --- MODAL UTILS ---
            openProductModal: (id) => {
                const p = state.products.find(x => x._id === id);
                const html = `
                    <img src="${p.image}" style="width:100%; height:200px; object-fit:contain; background:#000; border-radius:10px; margin-bottom:1rem;">
                    <div class="tag">${p.category}</div>
                    <h2>${p.name}</h2>
                    <h3 style="color:var(--primary); margin: 0.5rem 0;">₹${p.price.toLocaleString('en-IN')}</h3>
                    <p style="color:#ccc; line-height:1.6; margin-bottom:1.5rem;">${p.desc}</p>
                    
                    <button onclick='app.addToCart(${JSON.stringify(p)})' class="btn btn-primary" style="width:100%">Add to Cart</button>
                    
                    <div style="margin-top:2rem; border-top:1px solid var(--border); padding-top:1rem;">
                        <h4>Field Reports (Reviews)</h4>
                        <div style="max-height:150px; overflow-y:auto; margin:1rem 0;">
                            ${p.reviews && p.reviews.length ? p.reviews.map(r => `
                                <div style="background:#222; padding:8px; border-radius:6px; margin-bottom:8px; font-size:0.9rem;">
                                    <span style="color:var(--primary)">${r.user}:</span> ${r.comment}
                                </div>
                            `).join('') : '<span style="color:#666">No reports filed.</span>'}
                        </div>
                        ${state.user ? `
                            <form onsubmit="app.submitReview(event, '${p._id}')" style="display:flex; gap:10px;">
                                <input name="comment" placeholder="Write report..." style="margin:0; padding:8px;">
                                <button class="btn btn-secondary" style="padding:0 15px;"><i class="fa-solid fa-paper-plane"></i></button>
                            </form>
                        ` : ''}
                    </div>
                `;
                app.openModalContent(html);
            },

            submitReview: async (e, id) => {
                e.preventDefault();
                const comment = e.target.comment.value;
                try {
                    await fetch(`${CONFIG.API_URL}/review/${id}`, {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({user: state.user.name, comment})
                    });
                    app.showToast("Review Logged");
                    app.fetchProducts().then(() => app.openProductModal(id)); // refresh
                } catch(e){}
            },

            openAddProductModal: () => {
                const html = `
                    <h2>Add Hardware</h2>
                    <form onsubmit="app.handleAddProduct(event)">
                        <input type="text" name="name" placeholder="Product Name" required>
                        <input type="number" name="price" placeholder="Price" required>
                        <input type="text" name="category" placeholder="Category" required>
                        <textarea name="desc" placeholder="Specs/Description" required></textarea>
                        <input type="file" name="image" required style="padding:10px;">
                        <button class="btn btn-primary" style="width:100%">Upload to Database</button>
                    </form>
                `;
                app.openModalContent(html);
            },

            handleAddProduct: async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                try {
                    await fetch(`${CONFIG.API_URL}/products`, {method:'POST', body:formData});
                    app.showToast("Hardware Added");
                    app.closeModal();
                    app.renderAdmin();
                } catch(e){ app.showToast("Upload Error"); }
            },

            openModalContent: (html) => {
                const overlay = document.getElementById('modal-overlay');
                const body = document.getElementById('modal-body');
                body.innerHTML = html;
                overlay.classList.add('active');
            },

            closeModal: () => {
                document.getElementById('modal-overlay').classList.remove('active');
            },

            showToast: (msg) => {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3000);
            }
        };

        // Click outside modal to close
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if(e.target.id === 'modal-overlay') app.closeModal();
        });

        // Initialize
        window.onload = app.init;

    </script>
</body>
</html>
