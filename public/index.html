<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNG Surveillance | Premium CCTV Solutions</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        /* ============================================================
           1. DESIGN SYSTEM & VARIABLES
           ============================================================ */
        :root {
            /* Colors */
            --bg-main: #f8fafc;
            --bg-white: #ffffff;
            --bg-light: #f1f5f9;
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --primary-light: #7dd3fc;
            --secondary: #64748b;
            --accent: #06b6d4;
            
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            
            --text-dark: #1e293b;
            --text-main: #334155;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            
            --font-main: 'Inter', sans-serif;
            --font-display: 'Poppins', sans-serif;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            background: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-light); }
        ::-webkit-scrollbar-thumb { 
            background: var(--primary); 
            border-radius: 10px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        ::selection { background: var(--primary-light); color: var(--text-dark); }

        /* ============================================================
           2. ANIMATIONS
           ============================================================ */
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .fade-in { animation: fadeIn 0.5s ease; }
        .slide-up { animation: slideUp 0.6s ease; }
        .slide-down { animation: slideDown 0.3s ease; }
        .float { animation: float 3s ease-in-out infinite; }

        /* ============================================================
           3. BUTTONS & FORM COMPONENTS
           ============================================================ */
        .btn { 
            padding: 12px 24px; 
            border-radius: var(--radius-md); 
            font-family: var(--font-display); 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            border: none;
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            justify-content: center; 
            font-size: 0.95rem;
            text-decoration: none;
        }

        .btn-primary { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); 
            color: white; 
            box-shadow: var(--shadow); 
        }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary { 
            background: white; 
            border: 2px solid var(--border); 
            color: var(--text-dark); 
        }
        .btn-secondary:hover { 
            border-color: var(--primary); 
            color: var(--primary); 
        }

        .btn-danger { 
            background: var(--danger); 
            color: white; 
        }
        .btn-danger:hover { 
            background: #dc2626; 
        }

        .btn-success { 
            background: var(--success); 
            color: white; 
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .form-group { margin-bottom: 20px; }
        
        .label { 
            font-weight: 600; 
            font-size: 0.9rem; 
            color: var(--text-dark); 
            margin-bottom: 8px; 
            display: block; 
        }
        
        input, textarea, select { 
            width: 100%; 
            background: white; 
            border: 2px solid var(--border); 
            padding: 12px 16px; 
            color: var(--text-dark); 
            border-radius: var(--radius-md); 
            font-family: var(--font-main); 
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        input:focus, textarea:focus, select:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); 
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }
        .badge-primary { background: var(--primary-light); color: var(--primary-dark); }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #dbeafe; color: #1e40af; }

        /* ============================================================
           4. NAVIGATION
           ============================================================ */
        nav { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: white; 
            box-shadow: var(--shadow-sm); 
            padding: 1rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .logo { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            cursor: pointer;
            transition: transform 0.3s ease;
            user-select: none;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo img {
            height: 50px;
            width: auto;
        }
        
        .logo-text {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .nav-right { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        /* User Menu Dropdown (3 Dots) */
        .user-menu-container {
            position: relative;
        }

        .user-menu-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-light);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-dark);
            font-size: 1.2rem;
        }

        .user-menu-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .user-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            background: white;
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            min-width: 220px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            transition: all 0.3s;
        }

        .user-dropdown.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .user-dropdown-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border);
        }

        .user-dropdown-item:last-child {
            border-bottom: none;
        }

        .user-dropdown-item:hover {
            background: var(--bg-light);
            color: var(--primary);
        }

        .user-dropdown-header {
            padding: 15px 20px;
            background: var(--bg-light);
            border-bottom: 2px solid var(--border);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .user-dropdown-name {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .user-dropdown-email {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* ============================================================
           5. HERO SECTION
           ============================================================ */
        .hero { 
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            padding: 80px 5%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero .subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* ============================================================
           6. CATEGORY & PRODUCT SECTIONS
           ============================================================ */
        .category-selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 5%;
        }

        .category-card-main {
            background: white;
            border-radius: var(--radius-xl);
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            border: 2px solid var(--border);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .category-card-main:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: var(--shadow-xl);
        }

        .cat-icon-circle {
            width: 80px;
            height: 80px;
            background: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            color: var(--primary);
            transition: 0.4s;
        }

        .category-card-main:hover .cat-icon-circle {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }

        .cat-title-main {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .cat-badge-main {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
        }
        
        .product-grid-container {
            padding: 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card { 
            background: white; 
            border: 2px solid var(--border); 
            border-radius: var(--radius-lg); 
            overflow: hidden; 
            transition: all 0.3s ease; 
            cursor: pointer; 
        }
        
        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: var(--shadow-xl); 
            border-color: var(--primary);
        }

        .card-img-box { 
            height: 250px; 
            background: var(--bg-light); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            position: relative; 
            overflow: hidden; 
        }
        
        .card img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            transition: 0.3s ease;
        }
        .card:hover img { 
            transform: scale(1.1); 
        }
        
        .card-info { padding: 20px; }
        
        .card-title {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .price-tag { 
            font-size: 1.6rem; 
            font-family: var(--font-display); 
            font-weight: 700; 
            color: var(--primary);
            margin: 10px 0;
        }

        .stock-label { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: var(--danger); 
            color: white; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            z-index: 10; 
        }

        .tag {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 8px;
        }

        /* ============================================================
           7. MODALS & OVERLAYS
           ============================================================ */
        .overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(4px);
            z-index: 2000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.3s ease; 
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        
        .modal { 
            background: white; 
            width: 95%; 
            max-width: 600px; 
            padding: 40px; 
            border-radius: var(--radius-xl); 
            box-shadow: var(--shadow-xl); 
            transform: scale(0.9); 
            transition: 0.3s ease; 
            max-height: 90vh; 
            overflow-y: auto; 
        }
        .overlay.active .modal { transform: scale(1); }

        /* Map Modal */
        .map-modal {
            max-width: 800px;
            width: 95%;
        }

        #location-map {
            width: 100%;
            height: 400px;
            border-radius: var(--radius-md);
            margin: 20px 0;
        }

        .map-instructions {
            background: var(--bg-light);
            padding: 15px;
            border-radius: var(--radius-md);
            margin-bottom: 15px;
            border-left: 4px solid var(--info);
        }

        /* Cart Panel */
        .cart-panel { 
            position: fixed; 
            top: 0; 
            right: -450px; 
            width: 450px; 
            height: 100vh; 
            background: white; 
            border-left: 2px solid var(--border); 
            z-index: 2100; 
            padding: 30px; 
            transition: 0.4s ease; 
            display: flex; 
            flex-direction: column; 
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.1);
        }
        .cart-panel.open { right: 0; }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 50px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(100px);
            transition: all 0.4s ease;
            z-index: 4000;
            box-shadow: var(--shadow-xl);
            max-width: 400px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
        }

        .toast.error {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
        }

        .toast.warning {
            background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%);
        }

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            z-index: 3500;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-float.show {
            display: flex;
        }

        /* Loader */
        #loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* ============================================================
           8. FOOTER
           ============================================================ */
        footer {
            background: var(--text-dark);
            color: white;
            padding: 60px 5%;
            margin-top: 80px;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .social-links a {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-links a:hover {
            background: var(--primary);
            transform: translateY(-5px);
        }

        /* ============================================================
           9. ADMIN PANEL
           ============================================================ */
        .admin-layout { 
            display: flex; 
            min-height: calc(100vh - 70px); 
        }
        
        .sidebar { 
            width: 280px; 
            background: white; 
            border-right: 2px solid var(--border); 
            padding: 30px 20px; 
            position: fixed; 
            height: calc(100vh - 70px); 
            overflow-y: auto; 
        }

        .sidebar-btn { 
            width: 100%; 
            text-align: left; 
            padding: 14px 18px; 
            margin-bottom: 8px; 
            background: transparent; 
            border: none; 
            color: var(--text-muted); 
            cursor: pointer; 
            border-radius: var(--radius-md); 
            font-weight: 600; 
            transition: all 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        .sidebar-btn:hover { 
            background: var(--bg-light); 
            color: var(--text-dark); 
        }

        .sidebar-btn.active { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); 
            color: white; 
        }

        .admin-content { 
            margin-left: 280px; 
            padding: 40px; 
            width: 100%; 
            background: var(--bg-main); 
            min-height: calc(100vh - 70px);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-box {
            background: white;
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 25px;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .stat-label {
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: var(--font-display);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .data-table thead {
            background: var(--bg-light);
        }

        .data-table th {
            padding: 15px;
            text-align: left;
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .data-table td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .data-table tbody tr:hover {
            background: var(--bg-light);
        }

        .location-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .location-link:hover {
            text-decoration: underline;
        }

        /* ============================================================
           10. RESPONSIVE DESIGN
           ============================================================ */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .cart-panel { width: 100%; right: -100%; }
            .grid, .category-selection-grid, .product-grid-container .grid { 
                grid-template-columns: 1fr; 
            }
            .sidebar { 
                position: static; 
                width: 100%; 
                border-right: none; 
                border-bottom: 2px solid var(--border);
                height: auto;
            }
            .admin-content { 
                margin-left: 0; 
                padding: 20px; 
            }
            .whatsapp-float {
                bottom: 80px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 1.6rem;
            }
            .stat-grid {
                grid-template-columns: 1fr;
            }
            .user-dropdown {
                right: -10px;
            }
        }

        /* ============================================================
           11. UTILITY CLASSES
           ============================================================ */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-left { text-align: left; }
        
        .mt-10 { margin-top: 10px; }

        // ================================================================
        // MAIN APPLICATION OBJECT
        // ================================================================
        const app = {
            
            // ============================================================
            // INITIALIZATION
            // ============================================================
            init: async () => {
                console.log('🚀 Initializing BNG Surveillance...');
                
                // Hide loader
                setTimeout(() => {
                    const loader = document.getElementById('loader');
                    if(loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.remove(), 500);
                    }
                }, 1500);

                // Load inventory
                await app.syncInventory();
                
                // Render UI
                app.showHome();
                app.renderHeader();
                
                // Show back to top on scroll
                window.addEventListener('scroll', () => {

                        backToTop.classList.remove('show');
                    }

                console.log('✅ Application ready!');
            },

                try {

                                <i class="fa-brands fa-facebook-f"></i>

            executeAddToCart: (id) => {
                if(!APP_STATE.user) {
                    app.showToast("Please login to add items to cart", 'error');
                    app.closeModal();
                    app.showAuth('login');
                    return;
                }

                const product = APP_STATE.inventory.find(x => x._id === id);
                const qtyRequested = parseInt(document.getElementById('purchase-qty-input')?.value) || 1;

                if(qtyRequested > product.stock) {
                    app.showToast("Requested quantity exceeds available stock", 'error');
                    return;
                }

                const existingIndex = APP_STATE.cart.findIndex(item => item._id === id);
                
                if(existingIndex !== -1) {
                    const newTotalQty = APP_STATE.cart[existingIndex].qty + qtyRequested;
                    if(newTotalQty > product.stock) {
                        app.showToast("Cannot add more items - stock limit reached", 'error');
                        return;
                    }
                    APP_STATE.cart[existingIndex].qty = newTotalQty;
                } else {
                    APP_STATE.cart.push({ ...product, qty: qtyRequested });
                }

                app.showToast(`${product.name} added to cart!`, 'success');
                app.closeModal();
                app.renderHeader();
            },

            showMapPicker: () => {
                const html = `
                    <div class="fade-in">
                        <h2 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 20px; color: var(--text-dark);">
                            <i class="fa-solid fa-map-marked-alt"></i> Select Your Location
                        </h2>
                        
                        <div class="map-instructions">
                            <strong><i class="fa-solid fa-info-circle"></i> Instructions:</strong>
                            <ul style="margin: 10px 0 0 25px; line-height: 1.8;">
                                <li>Click on the map to pin your exact location</li>
                                <li>You can drag the marker to adjust</li>
                                <li>Zoom in for more accuracy</li>
                            </ul>
                        </div>

                        <div id="location-map"></div>

                        <div class="flex gap-10 mt-20">
                            <button onclick="app.closeModal(); app.checkout();" class="btn btn-secondary" style="flex: 1;">
                                <i class="fa-solid fa-times"></i> Cancel
                            </button>

                                <i class="fa-solid fa-check"></i> Confirm Location
                            </button>
                        </div>
                    </div>
                `;
                
                app.openModal(html);
                document.getElementById('modal-body-content').classList.add('map-modal');
                
                // Initialize map after DOM is ready
                setTimeout(() => {
                    // Default to India center
                    const defaultLat = 20.5937;
                    const defaultLng = 78.9629;
                    
                    APP_STATE.map = L.map('location-map').setView([defaultLat, defaultLng], 5);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(APP_STATE.map);
                    
                    // Click to add marker
                    APP_STATE.map.on('click', function(e) {
                        if (APP_STATE.marker) {
                            APP_STATE.map.removeLayer(APP_STATE.marker);
                        }
                        
                        APP_STATE.marker = L.marker([e.latlng.lat, e.latlng.lng], {
                            draggable: true
                        }).addTo(APP_STATE.map);
                        
                        APP_STATE.userLocation = {
                            latitude: e.latlng.lat,
                            longitude: e.latlng.lng
                        };
                    });
                    
                    // Try to get user's current position for better UX
                    if ("geolocation" in navigator) {
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                const lat = position.coords.latitude;
                                const lng = position.coords.longitude;
                                APP_STATE.map.setView([lat, lng], 13);
                            },
                            (error) => {
                                console.log("Geolocation not available, using default view");
                            }
                        );
                    }
                }, 300);
            },

                app.closeModal();

            initiatePayment: async (amount) => {
                const phone = document.getElementById('checkout-phone').value;
                const address = document.getElementById('checkout-address').value;
                const pincode = document.getElementById('checkout-pincode').value;

                if(!phone || !address || !pincode) {
                    app.showToast("Please fill all required fields", 'error');
                    return;
                }

                if(!/^[0-9]{10}$/.test(phone.replace(/\D/g, ''))) {
                    app.showToast("Please enter a valid 10-digit phone number", 'error');
                    return;
                }

                if(!/^[0-9]{6}$/.test(pincode)) {
                    app.showToast("Please enter a valid 6-digit pincode", 'error');
                    return;
                }

                try {
                    app.showToast("Connecting to payment gateway...", 'warning');
                    
                    const response = await fetch(`${COMMAND_CONFIG.API_BASE}/create-order`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ amount })
                    });
                    
                    const orderData = await response.json();

                    const options = {
                        "key": COMMAND_CONFIG.RAZORPAY_ID,
                        "amount": orderData.amount,
                        "currency": "INR",
                        "name": "BNG Surveillance",
                        "description": "CCTV & Security Equipment",
                        "order_id": orderData.id,
                        "handler": (resp) => app.verifyPaymentResponse(resp, amount, phone, address, pincode),
                        "theme": { "color": "#0ea5e9" },
                        "prefill": {
                            "name": APP_STATE.user.name,
                            "email": APP_STATE.user.email,
                            "contact": phone
                        }
                    };

                    const rzp = new Razorpay(options);
                    rzp.open();
                    app.closeModal();

                } catch(e) {
                    app.showToast("Payment gateway error. Please try again.", 'error');
                }
            },

            verifyPaymentResponse: async (response, total, phone, address, pincode) => {
                try {
                    app.showToast("Verifying payment...", 'warning');
                    
                    const payload = {
                        orderCreationId: response.razorpay_order_id,
                        razorpayPaymentId: response.razorpay_payment_id,
                        razorpaySignature: response.razorpay_signature,
                        customerDetails: {
                            name: APP_STATE.user.name,
                            email: APP_STATE.user.email,
                            phone,
                            address,
                            pincode,
                            items: APP_STATE.cart,
                            total,
                            location: APP_STATE.userLocation
                        }
                    };

                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/verify-payment`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });

                    if(res.ok) {
                        // Send WhatsApp message to admin
                        app.sendOrderToWhatsApp(response.razorpay_order_id, APP_STATE.user.name, APP_STATE.cart, total, address, phone, pincode);
                        
                        APP_STATE.cart = [];
                        APP_STATE.userLocation = null;
                        app.showToast("Payment successful! Order confirmed.", 'success');
                        app.renderOrderSuccess(response.razorpay_order_id, total);
                        app.syncInventory();
                        app.renderHeader();
                    } else {
                        app.showToast("Payment verification failed", 'error');
                    }
                } catch(e) {
                    app.showToast("Server error. Please contact support.", 'error');
                }
            },

            sendOrderToWhatsApp: (orderId, customerName, items, total, address, phone, pincode) => {
                // Build WhatsApp message
                let message = `🛍️ *NEW ORDER RECEIVED*\n\n`;
                message += `📋 *Order ID:* ${orderId.substr(-8)}\n`;
                message += `👤 *Customer:* ${customerName}\n`;
                message += `📞 *Phone:* ${phone}\n`;
                message += `📍 *Address:* ${address}, ${pincode}\n\n`;
                message += `🛒 *Products:*\n`;
                
                items.forEach(item => {
                    message += `• ${item.qty}× ${item.name} @ ₹${item.price.toLocaleString()}\n`;
                });
                
                message += `\n💰 *Total Amount:* ₹${total.toLocaleString()}\n\n`;
                
                if (APP_STATE.userLocation) {
                    const gmapsLink = `https://www.google.com/maps?q=${APP_STATE.userLocation.latitude},${APP_STATE.userLocation.longitude}`;
                    message += `📍 *Location:* ${gmapsLink}\n`;
                }
                
                const whatsappUrl = `https://wa.me/${COMMAND_CONFIG.WHATSAPP_ID}?text=${encodeURIComponent(message)}`;
                window.open(whatsappUrl, '_blank');
            },

            cancelOrder: async (orderId) => {
                if(!confirm('⚠️ Cancel Order?\n\nAre you sure you want to cancel this order?\n\n• Refund will be processed to your account\n• Amount will be credited within 7 business days\n• This action cannot be undone')) {
                    return;
                }

                try {
                    app.showToast("Processing cancellation...", 'warning');
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/orders/${orderId}/cancel`, { 
                        method: 'PATCH' 
                    });
                    
                    if(res.ok) {
                        app.showToast("Order cancelled. Refund will be processed within 7 days.", 'success');
                        app.renderProfile();
                    } else {
                        const data = await res.json();
                        app.showToast(data.error || "Cancellation failed", 'error');
                    }
                } catch(e) { 
                    app.showToast("Server error. Please contact support.", 'error'); 
                }
            },

            handleLogin: async (e) => {
                e.preventDefault();
                app.showToast("Logging in...", 'warning');
                const fd = Object.fromEntries(new FormData(e.target));
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/login`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(fd)
                    });
                    const data = await res.json();
                    if(res.ok) {
                        APP_STATE.user = data;
                        sessionStorage.setItem('user', JSON.stringify(data));
                        app.closeModal();
                        
                        // Show simple welcome toast instead of modal
                        app.showToast(`Welcome back, ${data.name}!`, 'success');
                        
                        app.renderHeader();
                        if(APP_STATE.user.role !== 'author') {
                            app.showHome();
                        }
                    } else {
                        app.showToast(data.error || "Login failed", 'error');
                    }
                } catch(e) { 
                    app.showToast("Connection error", 'error'); 
                }
            },

            handleRegister: async (e) => {
                e.preventDefault();
                app.showToast("Creating account...", 'warning');
                const fd = Object.fromEntries(new FormData(e.target));
                APP_STATE.registrationEmail = fd.email;
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/register`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(fd)
                    });
                    if(res.ok) {
                        app.showToast("Verification code sent to your email!", 'success');
                        app.showAuth('verify');
                    } else {
                        const data = await res.json();
                        app.showToast(data.error, 'error');
                    }
                } catch(e) { 
                    app.showToast("Registration failed", 'error'); 
                }
            },

            handleVerifyOTP: async (e) => {
                e.preventDefault();
                const otp = e.target.otp.value;
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/verify-otp`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email: APP_STATE.registrationEmail, otp })
                    });
                    if(res.ok) {
                        app.showToast("Email verified! Please login.", 'success');
                        app.showAuth('login');
                    } else {
                        app.showToast("Invalid verification code", 'error');
                    }
                } catch(e) { 
                    app.showToast("Verification failed", 'error'); 
                }
            },

            executeLogout: () => {
                if(!confirm('Are you sure you want to logout?')) return;
                sessionStorage.removeItem('user');
                APP_STATE.user = null;
                APP_STATE.cart = [];
                
                const whatsappBtn = document.getElementById('whatsapp-float');
                if (whatsappBtn) whatsappBtn.classList.remove('show');
                
                app.showToast("Logged out successfully", 'success');
                app.showHome();

            postReview: async (id) => {
                const comment = document.getElementById('review-comment-field').value;
                if(!comment || comment.trim() === '') {
                    app.showToast("Please write a review", 'error');
                    return;
                }
                try {
                    await fetch(`${COMMAND_CONFIG.API_BASE}/review/${id}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ user: APP_STATE.user.name, comment })
                    });
                    app.showToast("Review posted successfully!", 'success');
                    app.syncInventory().then(() => app.viewProductDetails(id));
                } catch(e) {
                    app.showToast("Failed to post review", 'error');
                }

            executeSubmitRequest: async () => {
                const type = document.getElementById('req-type-select').value;
                const msg = document.getElementById('req-msg-field').value;
                const addr = document.getElementById('req-addr-field').value;
                const pin = document.getElementById('req-pin-field').value;

                if(!msg || !addr || !pin) {
                    app.showToast("Please fill all required fields", 'error');
                    return;
                }

                const data = {
                    customerName: APP_STATE.user.name,
                    email: APP_STATE.user.email,
                    type: type,
                    message: `${msg}\n\nAddress: ${addr}\nPincode: ${pin}`,
                    location: null
                };

                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/requests`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });

                    if(res.ok) {
                        let waText = `*NEW ${type.toUpperCase()} REQUEST*\nFrom: ${APP_STATE.user.name}\nEmail: ${APP_STATE.user.email}\n\n${encodeURIComponent(msg)}\n\nAddress: ${addr}\nPincode: ${pin}`;
                        
                        window.open(`https://wa.me/${COMMAND_CONFIG.WHATSAPP_ID}?text=${waText}`);
                        
                        app.showToast("Request submitted successfully!", 'success');
                        app.closeModal();
                    }
                } catch(e) { 
                    app.showToast("Failed to submit request. Please try again.", 'error'); 
                }
            },

                            </h1>
                            <button onclick="app.showAddProduct()" class="btn btn-primary">
                                <i class="fa-solid fa-plus"></i> Add Product
                            </button>
                        </div>
                        
                        <div class="stat-box" style="overflow-x: auto;">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Category</th>
                                        <th>Price</th>
                                        <th>Stock</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${APP_STATE.inventory.map(p => `
                                        <tr>
                                            <td>
                                                <div class="flex gap-15" style="align-items: center;">
                                                    <img src="${p.image}" style="width:50px; height:50px; object-fit:contain; background: var(--bg-light); border-radius: var(--radius-sm); padding: 4px;">
                                                    <strong>${p.name}</strong>
                                                </div>
                                            </td>
                                            <td><span class="badge badge-primary">${CATEGORIES[p.category]?.name || p.category}</span></td>
                                            <td style="font-weight: 700;">₹${p.price.toLocaleString()}</td>
                                            <td style="color: ${p.stock < 1 ? 'var(--danger)' : 'var(--success)'}; font-weight: 700;">
                                                ${p.stock}
                                            </td>
                                            <td>
                                                <div class="flex gap-10">
                                                    <button onclick='app.showEditProduct(${JSON.stringify(p)})' class="btn btn-secondary btn-sm">
                                                        <i class="fa-solid fa-pen"></i> Edit
                                                    </button>
                                                    <button onclick="app.executeDeleteProduct('${p._id}', '${p.name}')" class="btn btn-danger btn-sm">
                                                        <i class="fa-solid fa-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }
                return '';
            },

            executeSolveQuery: async (id) => {
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/requests/${id}/solve`, { method: 'PATCH' });
                    if(res.ok) {
                        app.showToast("Request marked as resolved", 'success');
                        await app.renderAdminPortal();
                    }
                } catch(e) { app.showToast("Operation failed", 'error'); }
            },

            executeDeleteQuery: async (id) => {
                if(!confirm("Delete this support request?")) return;
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/requests/${id}`, { method: 'DELETE' });
                    if(res.ok) {
                        app.showToast("Request deleted", 'success');
                        await app.renderAdminPortal();
                    }
                } catch(e) { app.showToast("Delete failed", 'error'); }
            },

            showAddProduct: () => {
                const categoryOptions = Object.keys(CATEGORIES).map(key => 
                    `<option value="${key}">${CATEGORIES[key].name}</option>`
                ).join('');

                const html = `
                    <div class="fade-in">
                        <h2 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 25px; color: var(--text-dark);">
                            Add New Product
                        </h2>
                        <form id="add-product-form" onsubmit="app.executeAddProduct(event)">
                            <div class="form-group">
                                <label class="label">Product Name</label>
                                <input name="name" placeholder="Enter product name" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Category</label>
                                <select name="category" required>
                                    <option value="">Select Category</option>
                                    ${categoryOptions}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="label">Price (₹)</label>
                                <input name="price" type="number" placeholder="Enter price" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Stock Quantity</label>
                                <input name="stock" type="number" placeholder="Enter stock quantity" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Description</label>
                                <textarea name="desc" placeholder="Enter product description" required rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label class="label">Product Image</label>
                                <input type="file" name="image" required accept="image/*" style="padding: 10px;">
                            </div>
                            <button type="submit" class="btn btn-primary w-full" style="padding: 16px;">
                                <i class="fa-solid fa-plus"></i> Add Product
                            </button>
                        </form>
                    </div>
                `;
                app.openModal(html);
            },

            executeAddProduct: async (e) => {
                e.preventDefault();
                app.showToast("Adding product...", 'warning');
                const fd = new FormData(e.target);
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/products`, { method: 'POST', body: fd });
                    if(res.ok) {
                        app.showToast("Product added successfully!", 'success');
                        app.closeModal();
                        await app.renderAdminPortal();
                    }
                } catch(err) { app.showToast("Failed to add product", 'error'); }
            },

            showEditProduct: (p) => {
                const categoryOptions = Object.keys(CATEGORIES).map(key => 
                    `<option value="${key}" ${p.category === key ? 'selected' : ''}>${CATEGORIES[key].name}</option>`
                ).join('');

                const html = `
                    <div class="fade-in">
                        <h2 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 25px; color: var(--text-dark);">
                            Edit Product
                        </h2>
                        <form onsubmit="app.executeEditProduct(event, '${p._id}')">
                            <div class="form-group">
                                <label class="label">Product Name</label>
                                <input name="name" value="${p.name}" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Category</label>
                                <select name="category" required>
                                    ${categoryOptions}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="label">Price (₹)</label>
                                <input name="price" type="number" value="${p.price}" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Stock</label>
                                <input name="stock" type="number" value="${p.stock}" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Description</label>
                                <textarea name="desc" required rows="3">${p.desc}</textarea>
                            </div>
                            <div class="form-group">
                                <label class="label">New Image (Optional)</label>
                                <input type="file" name="image" accept="image/*" style="padding: 10px;">
                            </div>
                            <button type="submit" class="btn btn-primary w-full" style="padding: 16px;">
                                <i class="fa-solid fa-save"></i> Save Changes
                            </button>
                        </form>
                    </div>
                `;
                app.openModal(html);
            },

            executeEditProduct: async (e, id) => {
                e.preventDefault();
                app.showToast("Updating product...", 'warning');
                const fd = new FormData(e.target);
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/products/${id}`, { method: 'PUT', body: fd });
                    if(res.ok) {
                        app.showToast("Product updated successfully!", 'success');
                        app.closeModal();
                        await app.renderAdminPortal();
                    }
                } catch(err) { app.showToast("Update failed", 'error'); }
            },

            executeDeleteProduct: async (id, name) => {
                if(!confirm(`Delete "${name}"?\n\nThis action cannot be undone.`)) return;

                try {
                    app.showToast("Deleting product...", 'warning');
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/products/${id}`, { method: 'DELETE' });
                    
                    if(res.ok) {
                        app.showToast("Product deleted successfully", 'success');
                        await app.renderAdminPortal();
                    } else {
                        app.showToast("Failed to delete product", 'error');
                    }
                } catch(e) { 
                    app.showToast("Delete operation failed", 'error'); 
                }
            },

            executeOrderDelivery: async (id) => {
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/orders/${id}/deliver`, { method: 'PATCH' });
                    if(res.ok) { 
                        app.showToast("Order marked as delivered", 'success'); 
                        await app.renderAdminPortal(); 
                    }
                } catch(e) { app.showToast("Operation failed", 'error'); }
            },

            // ============================================================
            // UTILITIES
            // ============================================================
            openModal: (html) => {
                document.getElementById('modal-body-content').innerHTML = html;
                document.getElementById('modal-overlay').classList.add('active');
            },

            closeModal: () => {
                document.getElementById('modal-overlay').classList.remove('active');
                document.getElementById('modal-body-content').classList.remove('map-modal');
                
                // Cleanup map if exists
                if (APP_STATE.map) {
                    APP_STATE.map.remove();
                    APP_STATE.map = null;
                    APP_STATE.marker = null;
                }
            },

            showToast: (msg, type = 'success') => {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.className = 'toast show ' + type;
                setTimeout(() => t.classList.remove('show'), 3500);
            }
        };

        // ================================================================
        // EVENT LISTENERS
        // ================================================================
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if(e.target.id === 'modal-overlay') app.closeModal();
        });

        // ================================================================
        // EASTER EGG INITIALIZATION
        // ================================================================
        (function() {
            'use strict';
            
            const bannerArt = `
    ╔══════════════════════════════════════════════════════════════╗
    ║       🛡️  BNG SURVEILLANCE - DEV MODE ACTIVATED  🛡️            ║
    ║       "We see everything... including your code!" 👀          ║
    ╚══════════════════════════════════════════════════════════════╝
    `;

            const activateCCTVMode = () => {
                document.body.style.filter = 'grayscale(100%) contrast(1.2)';
                document.body.style.transition = 'filter 0.5s ease';
                
                const overlay = document.createElement('div');
                overlay.innerHTML = `
                    <div style="position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.8); color: lime; padding: 15px; font-family: 'Courier New', monospace; border: 2px solid lime; z-index: 9999; border-radius: 5px;">
                        <div style="font-size: 20px; font-weight: bold;">📹 CCTV MODE</div>
                        <div style="font-size: 12px; color: #0f0;">● REC</div>
                    </div>
                `;
                document.body.appendChild(overlay);
                
                console.log('%c🎬 CCTV MODE ACTIVATED! 🎬', 'color: lime; font-size: 20px; font-weight: bold; background: black; padding: 10px;');
                
                setTimeout(() => {
                    document.body.style.filter = '';
                    overlay.remove();
                }, 10000);
            };

            const matrixRain = () => {
                const canvas = document.createElement('canvas');
                canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;pointer-events:none;';
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                document.body.appendChild(canvas);
                
                const ctx = canvas.getContext('2d');
                const chars = 'BNGSURVEILLANCE01234@#$%';
                const fontSize = 14;
                const columns = canvas.width / fontSize;
                const drops = Array(Math.floor(columns)).fill(1);
                
                const draw = () => {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#0F0';
                    ctx.font = fontSize + 'px monospace';
                    
                    for (let i = 0; i < drops.length; i++) {
                        const text = chars[Math.floor(Math.random() * chars.length)];
                        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                        drops[i]++;
                    }
                };
                
                const interval = setInterval(draw, 33);
                console.log('%c🌧️ ENTERING THE MATRIX...', 'color: #0f0; font-size: 18px; font-family: monospace;');
                
                setTimeout(() => {
                    clearInterval(interval);
                    canvas.remove();
                }, 15000);
            };

            window.BNG = {
                cctvMode: activateCCTVMode,
                matrix: matrixRain,
                
                whoIsWatching: () => {
                    console.log('%c👀 WHO IS WATCHING?', 'color: orange; font-size: 20px; font-weight: bold;');
                    console.log('%cIt\'s us. The dev team. Hi! 👋', 'color: cyan; font-size: 14px;');
                },
                
                secretStats: () => {
                    console.table({
                        'Coffee Consumed': Math.floor(Math.random() * 100) + ' cups ☕',
                        'Bugs Fixed': Math.floor(Math.random() * 500) + ' bugs 🐛',
                        'Late Nights': Math.floor(Math.random() * 50) + ' nights 🌙',
                        'Lines of Code': (Math.random() * 10000).toFixed(0) + ' lines 💻'
                    });
                },
                
                help: () => {
                    console.log(bannerArt);
                    console.log('%c🎮 SECRET DEV COMMANDS', 'color: #0ea5e9; font-size: 18px; font-weight: bold;');
                    console.log('%c  BNG.cctvMode()      - CCTV mode 📹', 'color: #f59e0b; font-weight: bold;');
                    console.log('%c  BNG.matrix()        - Matrix effect 🌧️', 'color: #f59e0b; font-weight: bold;');
                    console.log('%c  BNG.whoIsWatching() - Find out 👀', 'color: #f59e0b; font-weight: bold;');
                    console.log('%c  BNG.secretStats()   - Dev stats 📊', 'color: #f59e0b; font-weight: bold;');
                    console.log('%c💡 Tip: Triple-click the logo!', 'color: #8b5cf6;');
                }
            };

            setTimeout(() => {
                const logo = document.getElementById('app-logo');
                if (logo) {
                    let clicks = 0;
                    logo.addEventListener('click', () => {
                        clicks++;
                        if (clicks === 3) {
                            activateCCTVMode();
                            if (app?.showToast) app.showToast("🎉 Easter egg unlocked!", 'success');
                            clicks = 0;
                        }
                        setTimeout(() => clicks = 0, 500);
                    });
                }
            }, 1000);

            console.log(bannerArt);
            console.log('%cType %cBNG.help()%c for secret commands!', 'color: #94a3b8;', 'color: #f59e0b; font-weight: bold;', 'color: #94a3b8;');

        })();

        // ================================================================
        // BOOT APPLICATION
        // ================================================================
        window.onload = app.init;
    </script>
</body>
</html>
