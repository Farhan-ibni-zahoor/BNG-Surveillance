<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNG Surveillance | Premium Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <style>
        :root {
            --bg-dark: #050505;
            --bg-panel: #121212;
            --bg-glass: rgba(20, 20, 20, 0.7);
            --primary: #f59e0b;
            --primary-glow: rgba(245, 158, 11, 0.4);
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.5; transform: scale(1); } }

        .animate-up { animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .text-gradient { background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn { padding: 12px 28px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #d97706); color: #000; box-shadow: 0 4px 15px var(--primary-glow); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-whatsapp { background: #25D366; color: #000; font-weight: 800; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }

        nav { padding: 1.2rem 3rem; display: flex; justify-content: space-between; align-items: center; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
        main { flex: 1; padding: 3rem; max-width: 1400px; margin: 0 auto; width: 100%; padding-bottom: 4rem; }

        /* HERO & UI */
        .hero-banner { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1557597774-9d273605dfa9?q=80&w=1920&auto=format&fit=crop'); background-size: cover; background-position: center; height: 400px; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 20px; margin-bottom: 3rem; border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; }
        .hero-banner::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(45deg, var(--primary) 0%, transparent 100%); opacity: 0.1; z-index: 1; }
        .hero-content { position: relative; z-index: 2; }
        .hero-title { font-size: 3.5rem; font-weight: 800; font-family: 'Space Grotesk'; margin-bottom: 1rem; }

        /* AUTH & MODALS */
        .auth-wrapper { position: fixed; inset: 0; z-index: 999; background: url('https://images.unsplash.com/photo-1511367461989-f85a21fda167?q=80&w=1920&auto=format&fit=crop') center/cover; display: flex; align-items: center; justify-content: center; }
        .auth-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); }
        .glass-card { position: relative; background: var(--bg-glass); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); padding: 3rem; border-radius: 24px; width: 100%; max-width: 450px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }

        /* SHOP GRID */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .product-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: all 0.4s ease; position: relative; }
        .product-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 15px 30px -5px rgba(0,0,0,0.5); }
        .product-img { 
            width: 100%; 
            height: 260px; 
            object-fit: contain; /* Show full image, no cropping */
            background-color: #000; /* Black background for clean look */
            border-bottom: 1px solid var(--border);
        }
        .product-card:hover .product-img { transform: scale(1.05); }
        .product-info { padding: 1.5rem; position: relative; z-index: 2; background: var(--bg-panel); }
        .product-cat { color: var(--primary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
        .product-price { font-size: 1.6rem; font-weight: 700; margin: 0.5rem 0; font-family: 'Space Grotesk', sans-serif; }

        /* ADMIN DASHBOARD ELEMENTS */
        .stat-card { background: linear-gradient(145deg, #1a1a1a, #0f0f0f); border: 1px solid var(--border); padding: 2rem; border-radius: 16px; position: relative; overflow: hidden; }
        .stat-val { font-size: 2.5rem; font-weight: 800; margin-top: 0.5rem; font-family: 'Space Grotesk', sans-serif; }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; letter-spacing: 0.5px; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; padding: 1rem; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 1rem; border-bottom: 1px solid var(--border); color: var(--text-main); vertical-align: middle; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .item-list { list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: #ccc; }
        .item-list li { margin-bottom: 4px; }

        /* CART & FORMS */
        input, select, textarea { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; color: white; margin-bottom: 1rem; font-family: 'Outfit', sans-serif; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; background: rgba(255,255,255,0.07); }
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 200; display: flex; justify-content: flex-end; }
        .cart-panel { background: #121212; width: 420px; padding: 2rem; display: flex; flex-direction: column; border-left: 1px solid var(--border); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; padding: 2.5rem; border-radius: 20px; width: 550px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        .detail-img { width: 100%; height: 300px; object-fit: contain; background: #000; border-radius: 12px; margin-bottom: 1.5rem; }
        .review-item { background: #222; padding: 1rem; border-radius: 8px; margin-bottom: 0.8rem; border: 1px solid #333; }
        
        /* FOOTER */
        .services-section { background: linear-gradient(to bottom, #0f172a, #050505); padding: 4rem 3rem; border-top: 1px solid var(--border); text-align: center; }
        .social-links { margin-top: 2rem; display: flex; justify-content: center; gap: 1.5rem; }
        .social-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #222; color: white; font-size: 1.5rem; transition: 0.3s; text-decoration: none; }
        .social-btn:hover { background: var(--primary); color: black; transform: scale(1.1); }

        @media (max-width: 768px) {
            nav { padding: 1rem; }
            .cart-panel { width: 100%; }
            main { padding: 1.5rem; }
            .hero-title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" style="position:fixed; inset:0; background:#050505; z-index:9999; display:flex; align-items:center; justify-content:center; transition:opacity 0.5s;">
        <div style="text-align:center;">
            <i class="fa-solid fa-video" style="font-size:3rem; color:var(--primary); margin-bottom:1rem; animation: pulse 1.5s infinite;"></i>
            <h2 style="color:white;">BNG Surveillance</h2>
            <p style="color:#666; font-size:0.9rem; margin-top:5px;">Initializing Secure Systems...</p>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">BNG <span class="text-gradient">Surveillance</span></div>
        <div id="nav-actions" class="flex items-center gap-4"></div>
    </nav>

    <!-- MAIN APP ROOT -->
    <main id="app-root"></main>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container" style="position:fixed; bottom:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:10px;"></div>

    <script>
        // CONFIGURATION
        const API_URL = '/api'; 
        
        // ⚠️ IMPORTANT: PASTE YOUR NEW RAZORPAY LIVE KEY ID HERE
        const RAZORPAY_KEY_ID = 'PASTE_YOUR_NEW_RAZORPAY_KEY_ID_HERE'; 

        const ADMIN_PHONE_NUMBER = '916006750581';

        let myChart = null;
        const state = { user: JSON.parse(sessionStorage.getItem('user')) || null, cart: [] };

        const app = {
            // SMARTER LOADING LOGIC
            init: async () => {
                const loader = document.getElementById('loading-overlay');
                
                // Reduced loading time for better UX
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }, 1500); // 1.5 seconds

                app.updateNav();
                app.showShop();
            },

            showToast: (msg) => {
                const div = document.createElement('div');
                div.style.cssText = "background:var(--bg-panel); color:white; padding:1rem; border-left:4px solid var(--primary); border-radius:4px; animation: slideUp 0.3s;";
                div.innerText = msg;
                document.getElementById('toast-container').appendChild(div);
                setTimeout(() => { div.style.opacity=0; setTimeout(()=>div.remove(),300); }, 3000);
            },

            updateNav: () => {
                const u = state.user;
                const actions = document.getElementById('nav-actions');
                if(!u) {
                    actions.innerHTML = `<button class="btn btn-secondary" onclick="app.showAuth()">Login</button>`;
                } else {
                    if(u.role === 'author') {
                        actions.innerHTML = `<button class="btn btn-secondary" onclick="app.showAdmin()">Dashboard</button><button class="btn btn-danger" onclick="app.logout()">Logout</button>`;
                    } else {
                        actions.innerHTML = `
                            <button class="btn btn-secondary" onclick="app.showShop()">Shop</button>
                            <button class="btn btn-secondary" onclick="app.showProfile()"><i class="fa-solid fa-user"></i> My Orders</button>
                            <button class="btn btn-primary" onclick="app.toggleCart()"><i class="fa-solid fa-cart-shopping"></i> Cart (${state.cart.length})</button>
                            <button class="btn btn-danger" onclick="app.logout()">Logout</button>
                        `;
                    }
                }
            },

            /* --- AUTHENTICATION --- */
            showAuth: () => {
                document.getElementById('app-root').innerHTML = `
                    <div class="auth-wrapper">
                        <div class="auth-overlay"></div>
                        <div class="glass-card animate-up">
                            <h1 style="font-size:2.2rem; margin-bottom:0.5rem; text-align:center;">Welcome Back</h1>
                            <p style="color:var(--text-muted); margin-bottom:2rem; text-align:center;">Access to BNG Surveillance Portal</p>
                            
                            <form onsubmit="app.login(event)">
                                <input type="email" name="email" placeholder="Email Address" required>
                                <input type="password" name="password" placeholder="Password" required>
                                <button type="submit" class="btn btn-primary" style="width:100%">Enter System</button>
                            </form>

                            <button onclick="app.showShop()" style="width:100%; margin-top:1rem; background:transparent; border:none; color:#888; cursor:pointer;">Continue as Guest</button>
                            
                            <p style="margin-top:1.5rem; text-align:center; font-size:0.9rem; color:var(--text-muted);">
                                Don't have an account? <a href="#" onclick="app.showRegister()" style="color:var(--primary); text-decoration:none; font-weight:600;">Register</a>
                            </p>
                        </div>
                    </div>
                `;
            },

            showRegister: () => {
                document.getElementById('app-root').innerHTML = `
                    <div class="auth-wrapper">
                        <div class="auth-overlay"></div>
                        <div class="glass-card animate-up">
                            <h1 style="text-align:center;">Create Account</h1>
                            <form onsubmit="app.register(event)">
                                <input type="text" name="name" placeholder="Full Name" required>
                                <input type="email" name="email" placeholder="Email Address" required>
                                <input type="password" name="password" placeholder="Password" required>
                                <button type="submit" class="btn btn-primary" style="width:100%">Sign Up</button>
                            </form>
                            <p style="margin-top:1.5rem; text-align:center; font-size:0.9rem;">
                                Already have an account? <a href="#" onclick="app.showAuth()" style="color:var(--primary);">Login</a>
                            </p>
                        </div>
                    </div>
                `;
            },

            login: async (e) => {
                e.preventDefault();
                const formData = Object.fromEntries(new FormData(e.target));
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(formData)
                });
                const data = await res.json();
                
                if(res.ok) {
                    state.user = data;
                    sessionStorage.setItem('user', JSON.stringify(data));
                    app.updateNav(); 
                    data.role === 'author' ? app.showAdmin() : app.showShop();
                } else {
                    alert("⚠️ Error: " + (data.error || "Login Failed"));
                }
            },

            register: async (e) => {
                e.preventDefault();
                const formData = Object.fromEntries(new FormData(e.target));
                await fetch(`${API_URL}/register`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(formData)
                });
                alert("Registration Successful"); app.showAuth();
            },

            logout: () => {
                state.user = null; state.cart = []; sessionStorage.removeItem('user'); app.updateNav(); app.showShop();
            },

            /* --- SHOP & HERO --- */
            showShop: async () => {
                const res = await fetch(`${API_URL}/products`);
                if (!res.ok) { return alert("Could not load products"); }
                const products = await res.json();
                
                document.getElementById('app-root').innerHTML = `
                    <div class="hero-banner animate-up">
                        <div class="hero-content">
                            <h1 class="hero-title">BNG <span class="text-gradient">Surveillance</span></h1>
                            <p style="font-size: 1.2rem; color: #ccc; max-width: 600px; margin: 0 auto;">
                                Advanced Security Solutions for Home & Business. 24/7 Protection. Professional Installation.
                            </p>
                            <button class="btn btn-primary" style="margin-top:2rem;" onclick="document.getElementById('shop-grid').scrollIntoView({behavior:'smooth'})">Explore Store</button>
                        </div>
                    </div>

                    <div class="animate-up" style="text-align:center; margin-bottom:2rem;">
                        <h2 style="font-size:2rem;">Premium Equipment</h2>
                        <p style="color:var(--text-muted);">Professional surveillance technology for modern era.</p>
                    </div>
                    
                    <div class="product-grid" id="shop-grid">
                        ${products.map(p => `
                            <div class="product-card">
                                <img src="${p.image}" class="product-img">
                                <div class="product-info">
                                    <div class="product-cat">${p.category}</div>
                                    <h3 style="margin:5px 0; font-size:1.2rem;">${p.name}</h3>
                                    <div class="product-price">₹${p.price.toLocaleString('en-IN')}</div>
                                    <button class="btn btn-primary" style="width:100%; margin-top:1rem;" onclick="app.viewProduct('${p._id}')">View Details</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="services-section">
                        <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 2rem; border-radius: 16px; max-width: 800px; margin: 0 auto;">
                            <h2 style="margin-bottom:1.5rem; color:var(--primary);">Our Services</h2>
                            <p style="font-size:1.1rem; line-height:1.6; color:#ccc; margin-bottom:2rem;">
                                We provide end-to-end <strong>Technical Repairment</strong> for all surveillance equipment.
                            </p>
                            <div class="social-links">
                                <a href="https://www.instagram.com/bng_surveillance/?hl=en" target="_blank" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
                                <a href="https://www.facebook.com/profile.php?id=61585589131328" target="_blank" class="social-btn"><i class="fa-brands fa-facebook-f"></i></a>
                            </div>
                            
                            <!-- NEW FOOTER SECTION -->
                            <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1);">
                                <h4 style="color:var(--text-muted); text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem;">Developer</h4>
                                <p style="font-size: 1.5rem; color: #fff; font-weight: 600; margin-bottom: 0.5rem;">
                                    Created by <a href="https://farhanzahoor.info" target="_blank" style="color: var(--primary); text-decoration: none; border-bottom: 1px solid var(--primary); transition: border-color 0.3s;">Farhan Zahoor</a>
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            },

            /* --- VIEW PRODUCT & REVIEWS (REVIEWS BELOW BUY BUTTON) --- */
            viewProduct: async (id) => {
                const res = await fetch(`${API_URL}/products`);
                if(!res.ok) return alert("Error fetching product data");
                
                const products = await res.json();
                const product = products.find(p => p._id === id);

                if(!product) return;

                const modal = document.createElement('div'); modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal-content animate-up">
                        <div style="text-align:right; margin-bottom:1rem;">
                            <button onclick="this.closest('.modal-overlay').remove()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
                        </div>
                        <img src="${product.image}" class="detail-img">
                        <h2 style="font-size:2rem; margin-bottom:0.5rem;">${product.name}</h2>
                        <div style="color:var(--primary); font-size:1.5rem; font-weight:bold; margin-bottom:1rem;">₹${product.price.toLocaleString('en-IN')}</div>
                        
                        <h4 style="margin-bottom:0.5rem; color:var(--text-muted);">Description</h4>
                        <p style="line-height:1.6; margin-bottom:1.5rem;">${product.desc}</p>
                        
                        <div class="flex" style="gap:10px;">
                            <button type="button" class="btn btn-primary" style="flex:1;" onclick="app.addToCart('${product._id}', '${product.name}', ${product.price})">Add to Cart</button>
                        </div>

                        <!-- REVIEWS SECTION (MOVED BELOW BUY BUTTON) -->
                        <div style="margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                            <h3 style="margin-bottom:1rem;">Customer Reviews</h3>
                            
                            ${product.reviews && product.reviews.length > 0 ? product.reviews.map(r => `
                                <div class="review-item">
                                    <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                                        <strong style="color:white;">${r.user}</strong>
                                        <span style="font-size:0.8rem; color:#666;">${new Date(r.date).toLocaleDateString()}</span>
                                    </div>
                                    <p style="color:#ddd; font-size:0.9rem;">${r.comment}</p>
                                </div>
                            `).join('') : '<p style="color:#888; font-style:italic;">No reviews yet.</p>'}

                            <!-- ADD REVIEW FORM -->
                            ${state.user ? `
                                <form style="margin-top:1.5rem;" onsubmit="app.addReview(event, '${product._id}')">
                                    <div style="margin-bottom: 0.5rem; color:var(--text-muted);">Write a review:</div>
                                    <textarea name="comment" placeholder="Share your experience..." rows="2" required style="background:#000; border:1px solid #333;"></textarea>
                                    <button type="submit" class="btn btn-secondary" style="width:100%">Submit Review</button>
                                </form>
                            ` : `<div style="margin-top:1rem; text-align:center; color:var(--primary); background:rgba(245,158,11,0.1); padding:0.5rem; border-radius:4px; font-size:0.8rem;">Please Login to write a review</div>`}
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            },

            addReview: async (e, productId) => {
                e.preventDefault();
                if(!state.user) return alert("Please login to review");
                
                const comment = e.target.comment.value;
                const res = await fetch(`${API_URL}/review/${productId}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user: state.user.name, comment })
                });
                if(res.ok) {
                    alert("Review Submitted!");
                    app.viewProduct(productId);
                } else {
                    alert("Failed to submit review");
                }
            },

            addToCart: (id, name, price) => {
                // FIX: Guests cannot add to cart
                if (!state.user) {
                    alert("⚠️ You must login to add items to cart.");
                    app.showAuth();
                    return;
                }
                state.cart.push({ _id: id, name, price });
                app.showToast(`${name} added to cart`);
                app.updateNav();
                document.querySelector('.modal-overlay').remove();
            },

            /* --- MY ORDERS (FULL IMPLEMENTATION) --- */
            showProfile: async () => {
                const res = await fetch(`${API_URL}/my-orders?email=${state.user.email}`);
                if (!res.ok) { return alert("Failed to load orders"); }
                
                const orders = await res.json();

                document.getElementById('app-root').innerHTML = `
                    <div class="animate-up" style="max-width: 900px; margin: 0 auto;">
                        <h1 style="margin-bottom:2rem; font-size:2rem;">My Order History</h1>
                        
                        <div style="background: rgba(245, 158, 11, 0.1); border: 1px solid var(--primary); padding: 1rem; border-radius: 8px; margin-bottom: 2rem; display:flex; align-items:center; gap:10px;">
                            <i class="fa-solid fa-truck-fast" style="color:var(--primary); font-size:1.5rem;"></i>
                            <div>
                                <h4 style="color:var(--primary); font-size:1rem; margin-bottom:2px;">Delivery Policy</h4>
                                <p style="font-size:0.9rem; color:#ccc; margin:0;">All orders are delivered to you within <strong>7 days</strong> with service.</p>
                            </div>
                        </div>

                        <div class="stat-card" style="background: var(--bg-panel);">
                            ${orders.length === 0 ? 
                                `<div style="text-align:center; padding: 3rem 0; color:var(--text-muted);">
                                    <i class="fa-solid fa-box-open" style="font-size:3rem; margin-bottom:1rem; opacity:0.5;"></i>
                                    <p>You haven't placed any orders yet.</p>
                                </div>` 
                                : 
                                `<div style="overflow-x:auto;">
                                    <table>
                                        <thead><tr><th>Date</th><th>Order ID</th><th>Items Bought</th><th style="text-align:right">Total</th></tr></thead>
                                        <tbody>
                                            ${orders.map(o => `
                                                <tr style="vertical-align:top;">
                                                    <td style="padding-top:1.5rem; color:var(--text-muted);">${new Date(o.date).toLocaleDateString()}</td>
                                                    <td style="padding-top:1.5rem; font-family:'Space Grotesk'">#${o._id.toString().substring(o._id.length-6)}</td>
                                                    <td style="padding-top:1.5rem; padding-bottom:1.5rem;">
                                                        <ul class="item-list">
                                                            ${o.items.map(i => `<li>${i.name} (₹${i.price})</li>`).join('')}
                                                        </ul>
                                                    </td>
                                                    <td style="padding-top:1.5rem; text-align:right; font-weight:bold; color:var(--primary);">₹${o.total.toLocaleString('en-IN')}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>`
                            }
                        </div>
                    </div>
                `;
            },

            /* --- ADMIN DASHBOARD (UPDATED WITH ITEMS & ADDRESS) --- */
            showAdmin: async () => {
                try {
                    const [orders, products] = await Promise.all([
                        fetch(`${API_URL}/orders`).then(r => r.json()).catch(() => []),
                        fetch(`${API_URL}/products`).then(r => r.json()).catch(() => [])
                    ]);
                    
                    const safeOrders = Array.isArray(orders) ? orders : [];
                    const safeProducts = Array.isArray(products) ? products : [];
                    const totalSales = safeOrders.reduce((acc, o) => acc + (o.total || 0), 0);

                    document.getElementById('app-root').innerHTML = `
                        <div class="animate-up">
                            <div class="flex justify-between items-center" style="margin-bottom:2rem">
                                <h1 style="font-size:2.5rem; font-family:'Space Grotesk'">Command Center</h1>
                                <button class="btn btn-primary" onclick="app.openProductModal()">+ New Unit</button>
                            </div>

                            <div class="flex" style="margin-bottom:2rem; gap:2rem; flex-wrap:wrap;">
                                <div class="stat-card" style="flex:1"><div class="stat-label">Total Revenue</div><div class="stat-val text-gradient">₹${totalSales.toLocaleString('en-IN')}</div></div>
                                <div class="stat-card" style="flex:1"><div class="stat-label">Total Orders</div><div class="stat-val">${safeOrders.length}</div></div>
                            </div>

                            <div class="stat-card" style="margin-bottom:2rem">
                                <h3 style="margin-bottom:1rem;">Recent Orders</h3>
                                <div style="overflow-x:auto;">
                                    ${safeOrders.length === 0 ? '<p style="color:#666">No orders yet.</p>' : `
                                        <table>
                                                <thead><tr><th>Customer</th><th>Phone</th><th>Address</th><th>Items Bought</th><th>Total</th></tr></thead>
                                                <tbody>
                                                    ${safeOrders.map(o => `
                                                        <tr>
                                                                <td>${o.customer}</td>
                                                                <td>${o.phone}</td>
                                                                <td style="font-size:0.8rem; color:#ccc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px;" title="${o.address}">${o.address}</td>
                                                                <td style="font-size:0.8rem; color:#ccc;">
                                                                    <ul class="item-list">
                                                                        ${o.items.map(i => `<li>${i.name}</li>`).join('')}
                                                                    </ul>
                                                                </td>
                                                                <td style="color:var(--primary); font-weight:bold;">₹${o.total}</td>
                                                            </tr>
                                                        `).join('')}
                                                </tbody>
                                        </table>
                                    `}
                                </div>
                            </div>
                            
                            <h3 style="margin-bottom:1rem">Inventory</h3>
                            <div class="product-grid">
                                ${safeProducts.map(p => `
                                    <div class="product-card">
                                        <img src="${p.image}" class="product-img">
                                        <div class="product-info">
                                            <div class="product-cat">${p.category}</div>
                                            <h3 style="margin:5px 0">${p.name}</h3>
                                            <div class="product-price">₹${p.price.toLocaleString('en-IN')}</div>
                                            <button class="btn btn-danger" style="margin-top:1rem; width:100%" onclick="app.deleteProduct('${p._id}')">Delete</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } catch (err) {
                    console.error(err);
                    alert("Failed to load dashboard. Please check console.");
                }
            },

            deleteProduct: async (id) => {
                if(confirm("Delete?")) { 
                    await fetch(`${API_URL}/products/${id}`, {method:'DELETE'}); 
                    app.showAdmin(); 
                }
            },

            openProductModal: () => {
                const modal = document.createElement('div'); modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal-content animate-up">
                        <h2 style="margin-bottom:1.5rem">Add Hardware</h2>
                        <form onsubmit="app.addProduct(event)">
                            <input type="text" name="name" placeholder="Name" required>
                            <input type="number" name="price" placeholder="Price" required>
                            <input type="text" name="category" placeholder="Category" required>
                            <textarea name="desc" placeholder="Description" required></textarea>
                            <input type="file" name="image" accept="image/*" required>
                            <div class="flex" style="gap:10px;">
                                <button type="submit" class="btn btn-primary">Save</button>
                                <button type="button" class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                            </div>
                        </form>
                    </div>`; document.body.appendChild(modal);
            },

            addProduct: async (e) => {
                e.preventDefault(); 
                const btn = e.target.querySelector('button[type="submit"]');
                const originalText = btn.innerText;
                
                btn.innerText = "Uploading...";
                btn.disabled = true;
                btn.style.opacity = "0.7";

                try {
                    const formData = new FormData(e.target);
                    const res = await fetch(`${API_URL}/products`, { method: 'POST', body: formData });
                    const data = await res.json();
                    
                    if(res.ok) {
                        alert("✅ Product Added Successfully!");
                        document.querySelector('.modal-overlay').remove(); 
                        app.showAdmin();
                    } else {
                        alert("❌ Upload Failed: " + (data.error || "Unknown error"));
                    }
                } catch (err) {
                    console.error("Frontend Error:", err);
                    alert("❌ Network Error: Could not connect to server.");
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                    btn.style.opacity = "1";
                }
            },

            /* --- CHECKOUT LOGIC --- */
            toggleCart: () => {
                const total = state.cart.reduce((a, b) => a + b.price, 0);
                const html = `
                    <div class="cart-overlay" onclick="if(event.target === this) this.remove()">
                        <div class="cart-panel animate-up">
                            <div class="flex justify-between"><h2>Cart</h2><button onclick="this.closest('.cart-overlay').remove()" style="background:none; border:none; color:white; font-size:1.5rem;">&times;</button></div>
                            <div class="flex-col" style="margin:1.5rem 0; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:10px;">
                                ${state.cart.map(i => `<div class="flex justify-between" style="background:#222; padding:10px; border-radius:8px; border:1px solid var(--border);"><span>${i.name}</span><span>₹${i.price}</span></div>`).join('')}
                            </div>
                            <div class="flex justify-between" style="font-weight:bold; font-size:1.2rem; margin-bottom:1rem">Total: ₹${total.toLocaleString('en-IN')}</div>
                            <button class="btn btn-primary" style="width:100%" onclick="app.checkLoginBeforePay(${total})">Proceed to Pay</button>
                        </div>
                    </div>
                `; document.body.insertAdjacentHTML('beforeend', html);
            },

            checkLoginBeforePay: (total) => {
                if (!state.user) {
                    alert("⚠️ You must login to complete your purchase.");
                    document.querySelector('.cart-overlay').remove();
                    app.showAuth();
                } else {
                    document.querySelector('.cart-overlay').remove();
                    app.showCheckout(total);
                }
            },

            showCheckout: (total) => {
                const modal = document.createElement('div'); modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal-content animate-up">
                        <h2 style="margin-bottom:1rem; color:var(--primary)">Shipping Details</h2>
                        <form id="checkout-form">
                            <input type="text" id="ship-name" placeholder="Full Name" value="${state.user.name}" readonly style="background:#333; border-color:#444">
                            <input type="tel" id="ship-phone" placeholder="Phone Number" required>
                            <textarea id="ship-address" placeholder="Delivery Address" rows="3" required></textarea>
                            <div class="flex justify-between items-center" style="margin-bottom:1rem; font-size:1.2rem;">
                                <span>Total to Pay:</span>
                                <span style="color:var(--primary)">₹${total.toLocaleString('en-IN')}</span>
                            </div>
                            <button type="button" class="btn btn-primary" style="width:100%" onclick="app.initiatePayment(${total})">Pay with Razorpay</button>
                            <button type="button" class="btn btn-secondary" style="width:100%; margin-top:10px" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                        </form>
                    </div>
                `; document.body.appendChild(modal);
            },

            initiatePayment: async (amount) => {
                const phone = document.getElementById('ship-phone').value;
                const address = document.getElementById('ship-address').value;
                if(!phone || !address) return alert("Please fill details");

                const res = await fetch(`${API_URL}/create-order`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ amount })
                });
                const order = await res.json();
                var options = {
                    "key": RAZORPAY_KEY_ID, "amount": order.amount, "currency": "INR",
                    "name": "BNG Surveillance", "description": "Order Payment",
                    "image": "https://cdn-icons-png.flaticon.com/512/3209/3209265.png",
                    "order_id": order.id,
                    "handler": function (response){ app.verifyPayment(response, amount, phone, address); },
                    "prefill": { "name": state.user.name, "email": state.user.email, "contact": phone },
                    "theme": { "color": "#f59e0b" }
                };
                var rzp1 = new Razorpay(options); rzp1.open();
            },

            verifyPayment: async (response, amount, phone, address) => {
                const itemsForWhatsApp = state.cart;
                state.cart = []; app.updateNav();
                
                const res = await fetch(`${API_URL}/verify-payment`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        orderCreationId: response.razorpay_order_id,
                        razorpayPaymentId: response.razorpay_payment_id,
                        razorpaySignature: response.razorpay_signature,
                        customerDetails: { name: state.user.name, email: state.user.email, phone, address, items: itemsForWhatsApp, total: amount }
                    })
                });
                const result = await res.json();
                if (result.message === "Payment Successful") {
                    document.querySelector('.modal-overlay').remove();
                    app.showSuccessScreen(result.orderId, amount, phone, address, itemsForWhatsApp);
                } else { alert("Payment Verification Failed"); }
            },

            // UPDATED: Clear WhatsApp Template with Address & Items
            showSuccessScreen: (orderId, total, phone, address, items) => {
                // Safety Check: Ensure we have valid data
                const safeOrderId = orderId ? `#${orderId}` : "Processing...";
                const safeItems = Array.isArray(items) ? items : [];

                // Build the item list string (Ensures Product Names are there)
                let itemListString = "";
                safeItems.forEach(item => {
                    const itemName = item.name || "Unknown Item"; // Fallback
                    const itemPrice = item.price || 0;
                    itemListString += `• ${itemName} (₹${itemPrice})%0A`;
                });

                const waText = `🆕 *NEW ORDER ALERT* 🆕
%0A----------------------------
%0A🆔 *Order ID:* ${safeOrderId}
%0A👤 *Customer:* ${state.user.name}
%0A📞 *Phone:* ${phone}
%0A📍 *Delivery Address:*
 ${address}
%0A----------------------------
%0A💰 *Total:* ₹${total.toLocaleString('en-IN')}
%0A----------------------------
%0A📦 *Ordered Items:*
%0A${itemListString}`;
                
                const waLink = `https://wa.me/${ADMIN_PHONE_NUMBER}?text=${waText}`;

                document.getElementById('app-root').innerHTML = `
                    <div style="text-align:center; margin-top:5rem;" class="animate-up">
                        <div style="font-size:5rem; color:var(--success); margin-bottom:1rem;"><i class="fa-solid fa-circle-check"></i></div>
                        <h1 style="color:var(--success); font-size:2.5rem;">Payment Successful!</h1>
                        <p style="color:#888; margin:1rem 0; font-size:1.2rem;">Order ID: #${orderId}</p>
                        
                        <div style="max-width:400px; margin:0 auto;">
                            <a href="${waLink}" target="_blank" class="btn btn-whatsapp" style="width:100%; display:flex; justify-content:center; gap:10px; text-decoration:none;">
                                <i class="fa-brands fa-whatsapp" style="font-size:1.2rem;"></i> Notify Admin on WhatsApp
                            </a>
                            <button class="btn btn-secondary" style="width:100%; margin-top:1rem" onclick="app.showShop()">Back to Shop</button>
                        </div>
                    </div>
                `;
            }
        };

        app.init();
    </script>
</body>
</html>
