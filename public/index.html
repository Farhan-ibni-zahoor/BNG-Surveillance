                } catch(e) { console.error("Admin Load Failed"); }

                const root = document.getElementById('app-root-view');
                root.innerHTML = `
                    <div class="admin-layout fade-in">
                        <aside class="sidebar">
                            <h3 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 25px; color: var(--text-dark); padding: 0 10px;">
                                <i class="fa-solid fa-dashboard"></i> Admin Panel
                            </h3>
                            
                            <button onclick="app.switchAdminTab('dashboard')" class="sidebar-btn ${APP_STATE.currentAdminTab === 'dashboard' ? 'active' : ''}">
                                <i class="fa-solid fa-chart-line"></i> Dashboard
                            </button>
                            <button onclick="app.switchAdminTab('orders')" class="sidebar-btn ${APP_STATE.currentAdminTab === 'orders' ? 'active' : ''}">
                                <i class="fa-solid fa-shopping-bag"></i> Orders
                            </button>
                            <button onclick="app.switchAdminTab('queries')" class="sidebar-btn ${APP_STATE.currentAdminTab === 'queries' ? 'active' : ''}">
                                <i class="fa-solid fa-headset"></i> Support Requests
                            </button>
                            <button onclick="app.switchAdminTab('inventory')" class="sidebar-btn ${APP_STATE.currentAdminTab === 'inventory' ? 'active' : ''}">
                                <i class="fa-solid fa-box"></i> Inventory
                            </button>
                            
                            <div style="margin-top: 40px; padding: 0 10px;">
                                <button onclick="app.renderShop()" class="btn btn-secondary" style="width:100%;">
                                    <i class="fa-solid fa-store"></i> Back to Store
                                </button>
                            </div>
                        </aside>

                        <main class="admin-content">
                            <div id="admin-tab-view">
                                ${app.getTabContent(APP_STATE.currentAdminTab)}
                            </div>
                        </main>
                    </div>
                `;
            },

            switchAdminTab: (tab) => {
                APP_STATE.currentAdminTab = tab;
                app.renderAdminPortal();
            },

            getTabContent: (tab) => {
                const totalRevenue = APP_STATE.orders.reduce((sum, o) => sum + (o.total || 0), 0);
                const activeOrders = APP_STATE.orders.filter(o => o.status === 'Processing').length;

                if(tab === 'dashboard') {
                    return `
                        <h1 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 40px; color: var(--text-dark);">Dashboard Overview</h1>
                        <div class="stat-grid">
                            <div class="stat-box">
                                <div style="font-weight: 600; color: var(--text-muted); margin-bottom: 8px; font-size: 0.9rem;">Total Revenue</div>
                                <div style="font-size: 2.5rem; font-weight: 800; font-family: var(--font-display); background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">₹${totalRevenue.toLocaleString()}</div>
                            </div>
                            <div class="stat-box">
                                <div style="font-weight: 600; color: var(--text-muted); margin-bottom: 8px; font-size: 0.9rem;">Total Orders</div>
                                <div style="font-size: 2.5rem; font-weight: 800; color: var(--text-dark);">${APP_STATE.orders.length}</div>
                            </div>
                            <div class="stat-box">
                                <div style="font-weight: 600; color: var(--text-muted); margin-bottom: 8px; font-size: 0.9rem;">Active Orders</div>
                                <div style="font-size: 2.5rem; font-weight: 800; color: var(--warning);">${activeOrders}</div>
                            </div>
                            <div class="stat-box">
                                <div style="font-weight: 600; color: var(--text-muted); margin-bottom: 8px; font-size: 0.9rem;">Products</div>
                                <div style="font-size: 2.5rem; font-weight: 800; color: var(--text-dark);">${APP_STATE.inventory.length}</div>
                            </div>
                        </div>
                    `;
                }

                if(tab === 'orders') {
                    return `
                        <h1 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 30px; color: var(--text-dark);">Order Management</h1>
                        <div class="stat-box" style="overflow-x: auto;">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Customer</th>
                                        <th>Items</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${APP_STATE.orders.map(o => `
                                        <tr>
                                            <td>${new Date(o.date).toLocaleDateString()}</td>
                                            <td>
                                                <strong>${o.customer}</strong><br>
                                                <small style="color: var(--text-muted);">${o.phone}</small>
                                            </td>
                                            <td>${o.items.length} items</td>
                                            <td style="font-weight: 700; color: var(--primary);">₹${o.total.toLocaleString()}</td>
                                            <td><span class="badge ${
                                                o.status === 'Delivered' ? 'badge-success' : 
                                                o.status === 'Cancelled' || o.status === 'Refund Processing' ? 'badge-danger' : 
                                                'badge-warning'
                                            }">${o.status}</span></td>
                                            <td>
                                                ${o.status === 'Processing' 
                                                    ? `<button onclick="app.executeOrderDelivery('${o._id}')" class="btn btn-success" style="padding:6px 12px; font-size:0.8rem;">Mark Delivered</button>` 
                                                    : '<i class="fa-solid fa-check-circle" style="color:var(--success); font-size: 1.2rem;"></i>'
                                                }
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                if(tab === 'queries') {
                    return `
                        <h1 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 30px; color: var(--text-dark);">Support Requests</h1>
                        <div class="stat-box" style="overflow-x: auto;">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Customer</th>
                                        <th>Type</th>
                                        <th>Message</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${APP_STATE.queries.map(q => `
                                        <tr>
                                            <td>${new Date(q.date).toLocaleDateString()}</td>
                                            <td>
                                                <strong>${q.customerName}</strong><br>
                                                <small style="color: var(--text-muted);">${q.email}</small>
                                            </td>
                                            <td><span class="badge badge-primary">${q.type}</span></td>
                                            <td style="max-width:300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${q.message}</td>
                                            <td><span class="badge ${q.status === 'Solved' ? 'badge-success' : 'badge-warning'}">${q.status}</span></td>
                                            <td>
                                                ${q.status !== 'Solved' 
                                                    ? `<button onclick="app.executeSolveQuery('${q._id}')" class="btn btn-success" style="padding: 6px 12px; font-size: 0.8rem;">Resolve</button>`
                                                    : `<button onclick="app.executeDeleteQuery('${q._id}')" class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;">Delete</button>`
                                                }
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                if(tab === 'inventory') {
                    return `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px;">
                            <h1 style="font-family: var(--font-display); font-weight: 700; color: var(--text-dark);">Product Inventory</h1>
                            <button onclick="app.showAddProduct()" class="btn btn-primary">
                                <i class="fa-solid fa-plus"></i> Add Product
                            </button>
                        </div>
                        <div class="stat-box" style="overflow-x: auto;">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Category</th>
                                        <th>Price</th>
                                        <th>Stock</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${APP_STATE.inventory.map(p => `
                                        <tr>
                                            <td>
                                                <div style="display: flex; align-items: center; gap: 12px;">
                                                    <img src="${p.image}" style="width:50px; height:50px; object-fit:contain; background: var(--bg-light); border-radius: var(--radius-sm); padding: 4px;">
                                                    <strong>${p.name}</strong>
                                                </div>
                                            </td>
                                            <td><span class="badge badge-primary">${CATEGORIES[p.category]?.name || p.category}</span></td>
                                            <td style="font-weight: 700;">₹${p.price.toLocaleString()}</td>
                                            <td style="color: ${p.stock < 1 ? 'var(--danger)' : 'var(--success)'}; font-weight: 700;">${p.stock}</td>
                                            <td>
                                                <div style="display: flex; gap: 8px;">
                                                    <button onclick='app.showEditProduct(${JSON.stringify(p)})' class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;">
                                                        <i class="fa-solid fa-pen"></i> Edit
                                                    </button>
                                                    <button onclick="app.executeDeleteProduct('${p._id}', '${p.name}')" class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;">
                                                        <i class="fa-solid fa-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }
                return '';
            },

            executeSolveQuery: async (id) => {
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/requests/${id}/solve`, { method: 'PATCH' });
                    if(res.ok) {
                        app.showToast("Request marked as resolved");
                        app.renderAdminPortal();
                    }
                } catch(e) { app.showToast("Operation failed"); }
            },

            executeDeleteQuery: async (id) => {
                if(!confirm("Delete this support request?")) return;
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/requests/${id}`, { method: 'DELETE' });
                    if(res.ok) {
                        app.showToast("Request deleted");
                        app.renderAdminPortal();
                    }
                } catch(e) { app.showToast("Delete failed"); }
            },

            showAddProduct: () => {
                const categoryOptions = Object.keys(CATEGORIES).map(key => 
                    `<option value="${key}">${CATEGORIES[key].name}</option>`
                ).join('');

                const html = `
                    <div class="fade-in">
                        <h2 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 25px; color: var(--text-dark);">Add New Product</h2>
                        <form id="add-product-form" onsubmit="app.executeAddProduct(event)">
                            <div class="form-group">
                                <label class="label">Product Name</label>
                                <input name="name" placeholder="Enter product name" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Category</label>
                                <select name="category" required>
                                    <option value="">Select Category</option>
                                    ${categoryOptions}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="label">Price (₹)</label>
                                <input name="price" type="number" placeholder="Enter price" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Stock Quantity</label>
                                <input name="stock" type="number" placeholder="Enter stock quantity" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Description</label>
                                <textarea name="desc" placeholder="Enter product description" required rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label class="label">Product Image</label>
                                <input type="file" name="image" required accept="image/*" style="padding: 10px;">
                            </div>
                            <button type="submit" class="btn btn-primary" style="width:100%; padding: 16px;">
                                <i class="fa-solid fa-plus"></i> Add Product
                            </button>
                        </form>
                    </div>
                `;
                app.openModal(html);
            },

            executeAddProduct: async (e) => {
                e.preventDefault();
                app.showToast("Adding product...");
                const fd = new FormData(e.target);
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/products`, { method: 'POST', body: fd });
                    if(res.ok) {
                        app.showToast("Product added successfully!");
                        app.closeModal();
                        app.renderAdminPortal();
                    }
                } catch(err) { app.showToast("Failed to add product"); }
            },

            showEditProduct: (p) => {
                const categoryOptions = Object.keys(CATEGORIES).map(key => 
                    `<option value="${key}" ${p.category === key ? 'selected' : ''}>${CATEGORIES[key].name}</option>`
                ).join('');

                const html = `
                    <div class="fade-in">
                        <h2 style="font-family: var(--font-display); font-weight: 700; margin-bottom: 25px; color: var(--text-dark);">Edit Product</h2>
                        <form onsubmit="app.executeEditProduct(event, '${p._id}')">
                            <div class="form-group">
                                <label class="label">Product Name</label>
                                <input name="name" value="${p.name}" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Category</label>
                                <select name="category" required>
                                    ${categoryOptions}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="label">Price (₹)</label>
                                <input name="price" type="number" value="${p.price}" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Stock</label>
                                <input name="stock" type="number" value="${p.stock}" required>
                            </div>
                            <div class="form-group">
                                <label class="label">Description</label>
                                <textarea name="desc" required rows="3">${p.desc}</textarea>
                            </div>
                            <div class="form-group">
                                <label class="label">New Image (Optional)</label>
                                <input type="file" name="image" accept="image/*" style="padding: 10px;">
                            </div>
                            <button type="submit" class="btn btn-primary" style="width:100%; padding: 16px;">
                                <i class="fa-solid fa-save"></i> Save Changes
                            </button>
                        </form>
                    </div>
                `;
                app.openModal(html);
            },

            executeEditProduct: async (e, id) => {
                e.preventDefault();
                app.showToast("Updating product...");
                const fd = new FormData(e.target);
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/products/${id}`, { method: 'PUT', body: fd });
                    if(res.ok) {
                        app.showToast("Product updated successfully!");
                        app.closeModal();
                        app.renderAdminPortal();
                    }
                } catch(err) { app.showToast("Update failed"); }
            },

            executeDeleteProduct: async (id, name) => {
                if(!confirm(`Delete "${name}"?\n\nThis action cannot be undone.`)) return;

                try {
                    app.showToast("Deleting product...");
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/products/${id}`, { method: 'DELETE' });
                    
                    if(res.ok) {
                        app.showToast("Product deleted successfully");
                        app.renderAdminPortal();
                    } else {
                        app.showToast("Failed to delete product");
                    }
                } catch(e) { 
                    app.showToast("Delete operation failed"); 
                }
            },

            executeOrderDelivery: async (id) => {
                try {
                    const res = await fetch(`${COMMAND_CONFIG.API_BASE}/orders/${id}/deliver`, { method: 'PATCH' });
                    if(res.ok) { 
                        app.showToast("Order marked as delivered"); 
                        app.renderAdminPortal(); 
                    }
                } catch(e) { app.showToast("Operation failed"); }
            },

            // UTILITIES
            openModal: (html) => {
                document.getElementById('modal-body-content').innerHTML = html;
                document.getElementById('modal-overlay').classList.add('active');
            },

            closeModal: () => {
                document.getElementById('modal-overlay').classList.remove('active');
            },

            showToast: (msg) => {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3500);
            }
        };

        // ================================================================
        // EVENT LISTENERS
        // ================================================================
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if(e.target.id === 'modal-overlay') app.closeModal();
        });

        // ================================================================
        // EASTER EGG INITIALIZATION
        // ================================================================
        (function() {
            'use strict';
            
            const bannerArt = `
    ╔══════════════════════════════════════════════════════════════╗
    ║      🛡️  BNG SURVEILLANCE - DEV MODE ACTIVATED  🛡️           ║
    ║      "We see everything... including your code!" 👀          ║
    ╚══════════════════════════════════════════════════════════════╝
    `;

            // CCTV Mode
            const activateCCTVMode = () => {
                document.body.style.filter = 'grayscale(100%) contrast(1.2)';
                document.body.style.transition = 'filter 0.5s ease';
                
                const overlay = document.createElement('div');
                overlay.innerHTML = `
                    <div style="position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.8); color: lime; padding: 15px; font-family: 'Courier New', monospace; border: 2px solid lime; z-index: 9999; border-radius: 5px;">
                        <div style="font-size: 20px; font-weight: bold;">📹 CCTV MODE</div>
                        <div style="font-size: 12px; color: #0f0;">● REC</div>
                    </div>
                `;
                document.body.appendChild(overlay);
                
                console.log('%c🎬 CCTV MODE ACTIVATED! 🎬', 'color: lime; font-size: 20px; font-weight: bold; background: black; padding: 10px;');
                
                setTimeout(() => {
                    document.body.style.filter = '';
                    overlay.remove();
                }, 10000);
            };

            // Matrix Rain
            const matrixRain = () => {
                const canvas = document.createElement('canvas');
                canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;pointer-events:none;';
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                document.body.appendChild(canvas);
                
                const ctx = canvas.getContext('2d');
                const chars = 'BNGSURVEILLANCE01234@#$%';
                const fontSize = 14;
                const columns = canvas.width / fontSize;
                const drops = Array(Math.floor(columns)).fill(1);
                
                const draw = () => {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#0F0';
                    ctx.font = fontSize + 'px monospace';
                    
                    for (let i = 0; i < drops.length; i++) {
                        const text = chars[Math.floor(Math.random() * chars.length)];
                        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                        drops[i]++;
                    }
                };
                
                const interval = setInterval(draw, 33);
                console.log('%c🌧️ ENTERING THE MATRIX...', 'color: #0f0; font-size: 18px; font-family: monospace;');
                
                setTimeout(() => {
                    clearInterval(interval);
                    canvas.remove();
                }, 15000);
            };

            // Global Commands
            window.BNG = {
                cctvMode: activateCCTVMode,
                matrix: matrixRain,
                
                whoIsWatching: () => {
                    console.log('%c👀 WHO IS WATCHING?', 'color: orange; font-size: 20px; font-weight: bold;');
                    console.log('%cIt\'s us. The dev team. Hi! 👋', 'color: cyan; font-size: 14px;');
                },
                
                secretStats: () => {
                    console.table({
                        'Coffee Consumed': Math.floor(Math.random() * 100) + ' cups ☕',
                        'Bugs Fixed': Math.floor(Math.random() * 500) + ' bugs 🐛',
                        'Late Nights': Math.floor(Math.random() * 50) + ' nights 🌙',
                        'Lines of Code': (Math.random() * 10000).toFixed(0) + ' lines 💻'
                    });
                },
                
                help: () => {
                    console.log(bannerArt);
                    console.log('%c🎮 SECRET DEV COMMANDS', 'color: #0ea5e9; font-size: 18px; font-weight: bold;');
                    console.log('%c  BNG.cctvMode()      - CCTV mode 📹', 'color: #f59e0b; font-weight: bold;');
                    console.log('%c  BNG.matrix()        - Matrix effect 🌧️', 'color: #f59e0b; font-weight: bold;');
                    console.log('%c  BNG.whoIsWatching() - Find out 👀', 'color: #f59e0b; font-weight: bold;');
                    console.log('%c  BNG.secretStats()   - Dev stats 📊', 'color: #f59e0b; font-weight: bold;');
                    console.log('%c💡 Tip: Triple-click the logo!', 'color: #8b5cf6;');
                }
            };

            // Triple-click logo Easter egg
            setTimeout(() => {
                const logo = document.getElementById('app-logo');
                if (logo) {
                    let clicks = 0;
                    logo.addEventListener('click', () => {
                        clicks++;
                        if (clicks === 3) {
                            activateCCTVMode();
                            if (app?.showToast) app.showToast("🎉 Easter egg unlocked!");
                            clicks = 0;
                        }
                        setTimeout(() => clicks = 0, 500);
                    });
                }
            }, 1000);

            // Welcome message
            console.log(bannerArt);
            console.log('%cType %cBNG.help()%c for secret commands!', 'color: #94a3b8;', 'color: #f59e0b; font-weight: bold;', 'color: #94a3b8;');

        })();

        // ================================================================
        // BOOT APPLICATION
        // ================================================================
        window.onload = app.init;
    </script>
</body>
</html>
